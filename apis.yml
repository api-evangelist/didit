aid: didit
name: Didit
description: >-
  Didit is a developer-first identity verification and fraud-prevention platform that
  exposes one unified API for KYC (ID verification, passive/active liveness, face match
  and search, age estimation, proof of address, NFC), KYB business verification (registry,
  UBO/ownership, officers, entity AML), AML sanctions/PEP screening, transaction monitoring
  (KYT), crypto wallet screening, and FATF/EU Travel Rule. It spans 220+ countries, 14,000+
  document types and 50+ languages with sub-two-second inference, pay-per-call pricing from
  $0.30 and a 500-verification monthly free tier. The v3 REST API authenticates with an
  x-api-key header, ships Web/iOS/Android/React Native/Flutter SDKs, HMAC-signed webhooks,
  a live hosted MCP server, and Agent Skills. Backed by Y Combinator and Robinhood Ventures.
