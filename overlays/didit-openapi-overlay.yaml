overlay: 1.0.0
info:
  title: API Evangelist enhancements for Didit Verification API
  version: 1.0.0
extends: openapi/didit-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-18'
    x-api-provider: Didit
    x-api-base-url: https://verification.didit.me
    x-authentication: x-api-key header (ApiKeyAuth); scoped Session-Token and X-Transaction-Token for
