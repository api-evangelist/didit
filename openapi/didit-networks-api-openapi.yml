  /v3/organization/{organization_id}/application/{application_id}/networks/{network_uuid}/notes/{note_uuid}/:
    delete:
      operationId: delete_network_note
      tags:
      - Networks
      summary: Delete your network note
      description: Requires write:networks and the authenticated author of the note. Deletion is irreversible. Connected account and verification data are unaffected.
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Organization UUID.
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Application UUID.
      - name: network_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Network UUID.
      - name: note_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: Console user access token in the form Bearer <token>.
      responses:
        '204':
          description: Note deleted.
        '401':
          description: Authentication is required.
        '403':
          description: Missing permission or Networks access.
        '404':
          description: Network or note is not visible to this application.
  /v3/organization/{organization_id}/application/{application_id}/networks/{network_uuid}/report/:
    get:
      operationId: download_network_report
      tags:
      - Networks
      summary: Download a network evidence report
      description: Download a PDF of the current organization network, its observed account connections, signal references and review status. Requires read:networks. Global intelligence and private analyst notes are not included. Each account and signal list is capped at 500 entries and the report states when it is incomplete. The request does not change network status. Errors are returned as JSON.
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Organization UUID.
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Application UUID.
      - name: network_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Network UUID.
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: Console user access token in the form Bearer <token>.
      responses:
        '200':
          description: 'Network evidence report. Cache-Control: no-store.'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Authentication is required.
        '403':
          description: Missing permission or Networks access.
        '404':
          description: Network or note is not visible to this application.
  /v3/organization/{organization_id}/application/{application_id}/networks/{network_uuid}/notes/:
    get:
      operationId: list_network_notes
      tags:
      - Networks
      summary: List private network notes
      description: Console users with read:networks can read notes on a network visible to the application. Notes stay within the organization and are not contributed to shared intelligence. Newest notes appear first.
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Organization UUID.
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Application UUID.
      - name: network_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Network UUID.
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: Console user access token in the form Bearer <token>.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      responses:
        '200':
          description: A page of notes. Count is capped at 100; use next to continue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                  previous:
                    type:
                    - string
                    - 'null'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/NetworkNote'
        '401':
          description: Authentication is required.
        '403':
          description: Missing permission or Networks access.
        '404':
          description: Network or note is not visible to this application.
    post:
      operationId: create_network_note
      tags:
      - Networks
      summary: Add a private network note
      description: Requires a console user with write:networks. The author is assigned from the authenticated user. Supply a new random UUID client_reference for each note; retry the same body and reference after an uncertain response to avoid duplicates. Reusing a reference for another body, author or network returns 409. Notes follow the surviving investigation when networks merge.
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Organization UUID.
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Application UUID.
      - name: network_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Network UUID.
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: Console user access token in the form Bearer <token>.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - comment
              - client_reference
              properties:
                comment:
                  type: string
                  minLength: 1
                  maxLength: 10000
                client_reference:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Saved private note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkNote'
        '200':
          description: Saved private note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkNote'
        '400':
          description: Invalid or blank note.
        '409':
          description: The reference was already used for another note.
        '401':
          description: Authentication is required.
        '403':
          description: Missing permission or Networks access.
        '404':
          description: Network or note is not visible to this application.
components:
  schemas:
    NetworkNodeTag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type:
          - string
          - 'null'
          description: Null for guard tags, whose color token the renderer owns.
        source:
          type: string
          enum:
          - subject_tag
          - session_tag
          - transaction_tag
          - signal_guard
          description: 'Where the tag came from: a tag on the user/business, a tag on a session in this network, a tag on a transaction a party belongs to, or a signal guard condition (e.g. hub, datacenter IP).'
        category:
          type:
          - string
          - 'null'
          enum:
          - customer
          - quality
          description: customer for customer-defined tags, quality for signal-quality guard tags. Null when not applicable.
    NetworkRiskDisplay:
      type: object
      properties:
        score:
          type: integer
          description: Risk score, 0-100.
        band:
          type: string
          enum:
          - low
          - medium
          - high
          description: Band the score renders as. high >= 70, medium >= 40, otherwise low.
        bar:
          type: number
          format: float
          description: Normalized 0-1 value for rendering a risk bar.
    NetworkGraphNode:
      type: object
      description: 'A subject node or a signal node, distinguished by kind. Subject nodes (kind: vendor_user | vendor_business | transaction_party) carry id, kind, subject, node_status (approved | in_review | declined | not_completed), and tags. Signal nodes (kind: signal) carry id, kind, uuid, signal_type, subject_count, coverage, is_hub, is_datacenter_ip, is_high_collision_device, node_status (signal_active | signal_guarded), tags, risk_evidence, first_seen_at, and last_seen_at.'
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - vendor_user
          - vendor_business
          - transaction_party
          - signal
    NetworkMember:
      type: object
      properties:
        subject:
          type: object
          description: The vendor_user, vendor_business, or transaction_party this member represents.
        outcome_status:
          type: string
          description: The subject's verification/decision outcome.
        node_status:
          type: string
          enum:
          - approved
          - in_review
          - declined
          - not_completed
          - signal_active
          - signal_guarded
          description: 'For a member row this is always one of the subject-outcome values: approved, in_review, declined, or not_completed.'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/NetworkNodeTag'
        risk:
          $ref: '#/components/schemas/NetworkRiskDisplay'
        signal_coverage:
          type: object
        shared_infrastructure:
          type: object
        joined_at:
          type:
          - string
          - 'null'
          format: date-time
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
        provenance:
          type: object
          properties:
            session_ids:
              type: array
              items:
                type: string
                format: uuid
            business_session_ids:
              type: array
              items:
                type: string
                format: uuid
            transaction_ids:
              type: array
              items:
                type: string
                format: uuid
    NetworkSignal:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        signal_type:
          type: string
          enum:
          - ip_address
          - device
          - face
          - document_number
          - phone
          - email
          - address
        subject_count:
          type: integer
        coverage:
          type: number
          format: float
        is_hub:
          type: boolean
          description: True when this signal links an unusually large number of subjects.
        is_datacenter_ip:
          type: boolean
        is_high_collision_device:
          type: boolean
        node_status:
          type: string
          enum:
          - signal_active
          - signal_guarded
        tags:
          type: array
          items:
            $ref: '#/components/schemas/NetworkNodeTag'
        risk_evidence:
          type: object
        first_seen_at:
          type:
          - string
          - 'null'
          format: date-time
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
    NetworkMap:
      type: object
      properties:
        network:
          $ref: '#/components/schemas/NetworkDetail'
        convergence_count:
          type: integer
          description: Number of distinct address/location points members converge on.
        countries:
          type: array
          items:
            type: string
        points:
          type: array
          items:
            type: object
            properties:
              uuid:
                type: string
                format: uuid
              country:
                type:
                - string
                - 'null'
              country_code:
                type:
                - string
                - 'null'
              city:
                type:
                - string
                - 'null'
              latitude:
                type:
                - number
                - 'null'
                format: float
              longitude:
                type:
                - number
                - 'null'
                format: float
              observed_at:
                type:
                - string
                - 'null'
                format: date-time
    EntityNetworkMembership:
      type: object
      properties:
        network:
          $ref: '#/components/schemas/NetworkListItem'
        subject:
          type: object
        signal_types:
          type: array
          items:
            type: string
            enum:
            - ip_address
            - device
            - face
            - document_number
            - phone
            - email
            - address
        signal_count:
          type: integer
        joined_at:
          type:
          - string
          - 'null'
          format: date-time
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
    NetworkListItem:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        network_id:
          type: string
          description: Human-readable per-organization sequential id, e.g. N-0001.
        name:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - active
          - in_review
          - resolved
          - dismissed
          description: Network lifecycle status. Distinct from the per-applicant outcome_status inside a network (approved/in_review/declined/not_completed).
        risk:
          $ref: '#/components/schemas/NetworkRiskDisplay'
        pattern_types:
          type: array
          items:
            type: string
            enum:
            - exact_same_device
            - similar_device
            - same_ip_address
            - same_address
            - similar_selfie_backgrounds
            - similar_poa_documents
            - same_document_number
            - same_phone_number
            - same_email
          description: The clustering patterns detected in this network.
        signal_types:
          type: array
          items:
            type: string
            enum:
            - ip_address
            - device
            - face
            - document_number
            - phone
            - email
            - address
          description: The distinct signal types present in this network.
        member_counts:
          type: object
          description: Counts of members by category (e.g. total, per outcome_status).
        member_status:
          type: object
          description: Breakdown of members by outcome_status.
        signal_coverage:
          type: object
          description: Per signal_type coverage of this network's members.
        first_activity_at:
          type:
          - string
          - 'null'
          format: date-time
        last_activity_at:
          type:
          - string
          - 'null'
          format: date-time
    NetworkDetail:
      allOf:
      - $ref: '#/components/schemas/NetworkListItem'
      - type: object
        properties:
          stats:
            type: object
            description: Aggregate stats for the network (e.g. member totals).
          fraud_tags:
            type: array
            items:
              type: object
            description: Fraud-pattern tags surfaced on the network.
          risk_signals:
            type: object
            description: 'Risk-signal summaries: residential_proxy_reuse, email_intelligence, phone_intelligence.'
          reviewed_at:
            type:
            - string
            - 'null'
            format: date-time
          reviewed_by:
            type:
            - string
            - 'null'
          review_reason:
            type:
            - string
            - 'null'
      properties:
        notes_count:
          type: integer
          minimum: 0
          readOnly: true
          description: Number of private analyst notes in this investigation.
    NetworkGraph:
      type: object
      properties:
        network:
          $ref: '#/components/schemas/NetworkDetail'
        depth:
          type:
          - integer
          - 'null'
          description: Effective depth applied, or null when unbounded (depth=all).
        truncated:
          type: boolean
          description: True if the neighborhood was cut off by depth.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NetworkGraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/NetworkGraphEdge'
        metrics:
          type: object
          properties:
            node_count:
              type: integer
            edge_count:
              type: integer
            hub_signal_count:
              type: integer
    NetworkTimelineEvent:
      type: object
      properties:
        event_type:
          type: string
          description: e.g. network_detected, signal_observed, network_in_review, network_resolved, network_dismissed.
        occurred_at:
          type:
          - string
          - 'null'
          format: date-time
        label:
          type: string
        metadata:
          type: object
    NetworkNote:
      type: object
      required:
      - uuid
      - actor_email
      - comment
      - client_reference
      - created_at
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        actor_email:
          type: string
          format: email
          readOnly: true
          description: Authenticated author, assigned by the server.
        comment:
          type: string
          minLength: 1
          maxLength: 10000
        client_reference:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          readOnly: true
    NetworkGraphEdge:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          description: Subject node id.
        target:
          type: string
          description: Signal node id.
        subject_kind:
          type: string
          enum:
          - vendor_user
          - vendor_business
          - transaction_party
        signal_type:
          type: string
          enum:
          - ip_address
          - device
          - face
          - document_number
          - phone
          - email
          - address
        confidence:
          type: number
          format: float
          description: 1.0 for an exact match.
        observation_count:
          type: integer
        first_seen_at:
          type:
          - string
          - 'null'
          format: date-time
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: 'Your application''s API key, from Developers -> API keys in the Business Console. The primary key has full access. A named key can be scoped: none, read or write per resource, limited to some workflows or to approved sessions, to a list of IP addresses, and to an expiry date. 401 means the key is missing, wrong, revoked or expired; 403 means the key has no access to this resource or action, or the request came from an address outside its IP list; 404 on a session route means the session is outside the key''s workflows or statuses. A key without media access receives image, video and PDF URLs as null, and a key without sessions write receives session links and tokens as null. See https://docs.didit.me/console/api-keys.'
    TransactionTokenAuth:
      type: apiKey
      in: header
      name: X-Transaction-Token
      description: Short-lived scoped token minted by your backend via POST /v3/transactions/sdk-token/. Used by the Didit SDKs on the device-facing /v1/transactions/ endpoints.
    SessionTokenAuth:
      type: apiKey
      in: header
      name: Session-Token
      description: Short-lived token returned in the `session_token` field of POST /v3/session/. Used by the hosted verification flow (and custom sandbox UIs) to call session-scoped endpoints on behalf of the verifying user, without your server-side API key.
    BearerAuth:
      type: http
      scheme: bearer
      description: The application's client-credentials access token.
    CaseRequestToken:
      type: apiKey
      in: header
      name: X-Case-Request-Token
      description: Request-specific credential from the secure link. Grants access only to this request.
