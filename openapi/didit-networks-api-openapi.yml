openapi: 3.2.0
info:
  version: 3.0.0
  title: Didit Verification Networks API
  description: Identity verification API. Authenticate with x-api-key header.
servers:
- url: https://verification.didit.me
tags:
- name: Networks
paths:
  /v3/organization/{organization_id}/application/{application_id}/networks/:
    get:
      summary: List networks
      description: List fraud networks detected within this application's organization, newest activity first by default. By default dismissed networks are excluded; pass status to include them. Sandbox applications never have networks - clustering excludes sandbox data entirely.
      operationId: list_networks
      tags:
      - Networks
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Organization UUID.
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Application UUID.
      - name: status
        in: query
        schema:
          type: string
        description: 'Comma-separated statuses to include: active,in_review,resolved,dismissed. Omit to exclude dismissed.'
      - name: signal_type
        in: query
        schema:
          type: string
        description: 'Comma-separated signal types: ip_address,device,face,document_number,phone,email,address.'
      - name: pattern_type
        in: query
        schema:
          type: string
        description: Comma-separated pattern types, e.g. exact_same_device,same_email.
      - name: risk_band
        in: query
        schema:
          type: string
        description: 'Comma-separated bands: low,medium,high.'
      - name: min_size
        in: query
        schema:
          type: integer
        description: Minimum member count.
      - name: max_size
        in: query
        schema:
          type: integer
        description: Maximum member count.
      - name: date_from
        in: query
        schema:
          type: string
          format: date
        description: Lower bound on last_activity_at (ISO 8601 date or datetime).
      - name: date_to
        in: query
        schema:
          type: string
          format: date
        description: Upper bound on first_activity_at (ISO 8601 date or datetime).
      - name: q
        in: query
        schema:
          type: string
        description: Free-text search across network name, member names, the network_id (N-0001), and exact pattern_type tokens.
      - name: ordering
        in: query
        schema:
          type: string
        description: One of risk_score, -risk_score, last_activity_at, -last_activity_at, first_activity_at, -first_activity_at, network_number, -network_number. Defaults to -risk_score,-last_activity_at.
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 500
        description: Page size, 1-500. Defaults to 100.
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
        description: Zero-based offset of the first record.
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X GET 'https://verification.didit.me/v3/organization/11111111-2222-3333-4444-555555555555/application/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee/networks/?status=active,in_review&ordering=-risk_score' \\\n  -H 'x-api-key: YOUR_API_KEY'"
      responses:
        '200':
          description: Paginated network list with console KPIs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - integer
                    - 'null'
                    description: Offset of the next page, or null on the last page.
                  previous:
                    type:
                    - integer
                    - 'null'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/NetworkListItem'
                  kpis:
                    type: object
                    description: Each key is {value, delta} over the results matching the current filters.
                    properties:
                      active:
                        type: object
                      in_review:
                        type: object
                      applicants_involved:
                        type: object
                      detected_this_period:
                        type: object
                      false_positive_rate:
                        type: object
  /v3/organization/{organization_id}/application/{application_id}/networks/{network_uuid}/:
    get:
      summary: Get network
      description: Retrieve a single network's full detail, including stats, fraud tags, and risk signals.
      operationId: get_network
      tags:
      - Networks
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Organization UUID.
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Application UUID.
      - name: network_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: n3a5e000-0000-4000-8000-000000000001
        description: Network UUID.
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X GET 'https://verification.didit.me/v3/organization/11111111-2222-3333-4444-555555555555/application/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee/networks/n3a5e000-0000-4000-8000-000000000001/' \\\n  -H 'x-api-key: YOUR_API_KEY'"
      responses:
        '200':
          description: Network detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkDetail'
        '404':
          description: Network not found (or not visible to this application).
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /v3/organization/{organization_id}/application/{application_id}/networks/{network_uuid}/graph/:
    get:
      summary: Get network graph
      description: Retrieve the network as a graph of subject nodes (vendor users, vendor businesses, transaction parties) and signal nodes (the shared device/IP/face/document/phone/email/address values linking them), with edges representing memberships.
      operationId: get_network_graph
      tags:
      - Networks
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Organization UUID.
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Application UUID.
      - name: network_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: n3a5e000-0000-4000-8000-000000000001
        description: Network UUID.
      - name: depth
        in: query
        schema:
          type: string
          enum:
          - '1'
          - '2'
          - '3'
          - all
        description: Hops from the focus subject to include. Defaults to all (unbounded).
      - name: focus_kind
        in: query
        schema:
          type: string
          enum:
          - vendor_user
          - vendor_business
          - transaction_party
        description: Subject type to center the graph on. Must be supplied together with focus_id; defaults to an arbitrary member when depth is bounded and neither is supplied.
      - name: focus_id
        in: query
        schema:
          type: string
          format: uuid
        description: Subject UUID to center the graph on.
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X GET 'https://verification.didit.me/v3/organization/11111111-2222-3333-4444-555555555555/application/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee/networks/n3a5e000-0000-4000-8000-000000000001/graph/?depth=2' \\\n  -H 'x-api-key: YOUR_API_KEY'"
      responses:
        '200':
          description: Network graph.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkGraph'
        '404':
          description: Network not found (or not visible to this application).
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
  /v3/organization/{organization_id}/application/{application_id}/networks/{network_uuid}/members/:
