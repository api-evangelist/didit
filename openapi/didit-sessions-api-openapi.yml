  /v3/sessions/delete/:
    post:
      summary: Bulk soft-delete KYC sessions by session_number
      description: 'Bulk soft-delete User Verification (KYC) sessions by their numeric `session_number`, or wipe every KYC session in your application with `delete_all: true`.


        `session_number` is the human-friendly incrementing counter shown in the Console session list and returned as `session_number` by the create-session and decision endpoints — it is **not** the `session_id` UUID. To delete a session by UUID — or to delete a Business Verification (KYB) session, which this endpoint never touches — use `DELETE /v3/session/{sessionId}/delete/` instead.


        Each deleted session gets exactly the same treatment as the single-session delete endpoint: stamped with a deletion timestamp, removed from all read endpoints, related face/liveness/face-match records soft-deleted, and all stored media moved to a quarantined storage prefix by a background job so previously issued media URLs stop resolving. Database records are retained internally but become unreachable through the API; blocklist entries are **not** removed; no webhook is emitted; there is no undo.


        **Selection semantics:**

        - Entries in `session_numbers` that do not match a live KYC session in your application — unknown numbers, already-deleted sessions, or sessions owned by another application — are **silently skipped**. There is no per-item failure report: the endpoint returns `204` whether it deleted all, some, or none of the listed sessions.

        - Validation failures (a non-numeric entry, an empty list, or neither `session_numbers` nor `delete_all` provided) reject the **whole request** with `400` and delete nothing.

        - All deletions run inside a single database transaction.

        - There is no documented cap on the list length; the shared write rate limit (below) is the practical bound.


        **Idempotency:** fully idempotent — repeating the same request returns `204` again (already-deleted numbers are skipped).


        **`delete_all: true` — destructive:** soft-deletes **every** non-deleted KYC session in the application; `session_numbers` is ignored when set. There is no confirmation step and no undo.


        **Authentication:** API key in the `x-api-key` header. Missing or invalid credentials return `403` (`{"detail": "You do not have permission to perform this action."}`) — this API never returns `401`.


        **Rate limit:** shared write budget of 300 requests/min per API key across all POST/PATCH/DELETE endpoints; exceeding it returns `429`.


        This endpoint accepts API keys only — Business Console user Bearer tokens are rejected with `403` (unlike the single-session delete, which accepts both).'
      operationId: batch_delete_sessions
      tags:
      - Sessions
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_numbers:
                  type: array
                  description: Numeric `session_number` values of the KYC sessions to soft-delete, as digit-only strings (JSON numbers are also accepted and coerced). Required unless `delete_all` is `true`; an empty list returns `400`. Any non-digit entry rejects the whole request with `400` (unless `delete_all` is `true`, in which case validation is skipped and the entries are ignored). Numbers that do not match a live session in your application are silently skipped.
                  items:
                    type: string
                    pattern: ^[0-9]+$
                    example: '1001'
                  minItems: 1
                  example:
                  - '1001'
                  - '1002'
                  - '1003'
                delete_all:
                  type: boolean
                  description: When `true`, every non-deleted KYC session in the calling application is soft-deleted and `session_numbers` is ignored. Defaults to `false`. Irreversible — there is no confirmation step.
                  default: false
                  example: false
            examples:
              Specific sessions:
                summary: Delete specific sessions by number
                value:
                  session_numbers:
                  - '1001'
                  - '1002'
                  - '1003'
              All sessions:
                summary: Delete every KYC session in the application
                value:
                  delete_all: true
      responses:
        '204':
          description: Request accepted and all matching sessions soft-deleted. Empty body. Returned even when some or all `session_numbers` matched nothing (unknown or already deleted) — there is no per-item report.
        '400':
          description: Validation error — nothing was deleted. Error values are arrays of message strings keyed by field name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_numbers:
                    type: array
                    items:
                      type: string
              examples:
                Missing selector:
                  summary: Neither session_numbers nor delete_all provided
                  value:
                    session_numbers:
                    - This field is required unless delete_all is true.
                Empty list:
                  summary: session_numbers is an empty array
                  value:
                    session_numbers:
                    - This list may not be empty.
                Non-numeric entry:
                  summary: session_numbers contains a non-digit string
                  value:
                    session_numbers:
                    - All session_numbers must be numeric.
        '403':
          description: Missing or invalid API key. This API returns `403` for authentication failures — never `401`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              examples:
                Missing or invalid API key:
                  summary: No x-api-key header, or the key is invalid
                  value:
                    detail: You do not have permission to perform this action.
        '429':
          description: Shared write rate limit exceeded (300 POST/PATCH/DELETE requests per minute per API key). Inspect `Retry-After` and the `X-RateLimit-*` response headers before retrying.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              examples:
                Rate limited:
                  summary: Write budget exhausted
                  value:
                    detail: Write request rate limit exceeded. You can make up to 300 requests per minute.
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X POST \\\n  https://verification.didit.me/v3/sessions/delete/ \\\n  -H 'x-api-key: YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"session_numbers\": [\"1001\", \"1002\", \"1003\"]\n  }'"
      - lang: python
        label: Python
        source: "import requests\n\nresponse = requests.post(\n    \"https://verification.didit.me/v3/sessions/delete/\",\n    headers={\n        \"x-api-key\": \"YOUR_API_KEY\",\n        \"Content-Type\": \"application/json\",\n    },\n    json={\"session_numbers\": [\"1001\", \"1002\", \"1003\"]},\n)\nresponse.raise_for_status()  # 204 on success, even if some numbers matched nothing\n\n# Destructive: delete every KYC session in the application\n# requests.post(\n#     \"https://verification.didit.me/v3/sessions/delete/\",\n#     headers={\"x-api-key\": \"YOUR_API_KEY\"},\n#     json={\"delete_all\": True},\n# )"
      - lang: javascript
        label: JavaScript
        source: "const response = await fetch(\n  'https://verification.didit.me/v3/sessions/delete/',\n  {\n    method: 'POST',\n    headers: {\n      'x-api-key': 'YOUR_API_KEY',\n      'Content-Type': 'application/json',\n    },\n    body: JSON.stringify({ session_numbers: ['1001', '1002', '1003'] }),\n  },\n);\nif (response.status !== 204) throw new Error(`HTTP ${response.status}`);"
  /v3/sessions/{session_id}/reviews/:
    get:
      summary: List session reviews and activity log
      description: 'Return the audit trail / activity feed for a User Verification (KYC) session, newest first, in a paginated envelope (`count` / `next` / `previous` / `results`, 50 entries per page by default).


        Feed entries are written by every actor that touches the session: manual decisions made through `PATCH /v3/session/{session_id}/update-status/` (which records `previous_status` → `new_status`), Console reviewer activity (comments with `@email` mentions, KYC/POA data edits, file uploads/removals, tag changes, detail-page views), AML ongoing-monitoring matches, and notes appended via `POST` on this same path. Reading this feed is the API-side equivalent of the **Activity** panel in the Didit Console session view.


        Only User Verification (KYC) sessions are addressable here; Business Verification (KYB) session IDs return `404`.'
      operationId: list_session_reviews
      tags:
      - Sessions
      parameters:
      - name: session_id
        in: path
        required: true
