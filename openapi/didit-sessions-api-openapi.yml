  /v3/session/{sessionId}/update-poa-data/:
    patch:
      summary: Update Proof of Address data extracted from the POA document on a verification session
      description: 'Correct the fields extracted from the user''s Proof of Address document — utility bill, bank statement, or other address evidence — after the verification has finished: issuer, dates, the printed name, the address itself, and banking details. Every field in the body is optional: only the keys you send are written, everything else is left untouched (`PATCH` semantics).


        The session must belong to your application and be in `Approved`, `Declined`, `In Review`, or `Kyc Expired` status. Sessions in any other state (e.g. still `In Progress`) return `404` with `"No Session matches the given query."` — distinct from the `"Not found."` returned for an unknown or deleted `sessionId`. The session must also carry a POA record: sessions whose workflow never ran a Proof of Address step return `404` (`"The session does not have a POA."`). For graph workflows with multiple POA steps, target a specific step with `node_id` (query parameter or body field); when omitted, the most recent POA record is patched.


        `extra_fields` is merged key-by-key: nine known keys (`bank_iban`, `additional_names`, …) write through to dedicated POA columns, any other key is kept as a custom extra, and `null` / `""` deletes a key. `poa_parsed_address` accepts only the seven documented keys and recomputes `formatted_address` / `poa_formatted_address` after every edit. If the free-text `poa_address` changes, the server may also re-geocode it and refresh the structured address (skipped for sandbox sessions).


        Unlike the KYC variant of this endpoint, the `data.updated` [webhook](/integration/webhooks) (trigger `manual_review`) fires only when at least one stored value **actually changed** — re-sending identical values is a silent no-op. When values change, a `POA_DATA_UPDATED` activity entry recording the changed fields with previous and new values is appended to the session''s `reviews`, visible in [Get Decision](#get-/v3/session/-sessionId-/decision/) and the console activity timeline. The session''s status and decision are **not** re-evaluated — use [Update Status](#patch-/v3/session/-sessionId-/update-status/) to change the outcome.


        Accepts an API key or a console user token; either way the credential needs the `write:sessions` permission. Authentication and permission failures both return `403` — this API never responds `401`. Note that the session lookup runs before credential checks, so an unknown `sessionId` returns `404` even with missing credentials. This endpoint has a dedicated rate limit of 10 requests per minute per API key (invalid requests count too); the shared write budget of 300 requests per minute also applies.


        An empty JSON body `{}` is a no-op: it returns `200` echoing the current POA record without firing the webhook (`has_changes` stays false).'
      operationId: patch_v3_session_update_poa_data
      tags:
      - Sessions
      security:
      - ApiKeyAuth: []
      parameters:
      - name: sessionId
        in: path
        required: true
        description: UUID of the User Verification (KYC) session whose attached POA record you are correcting.
        schema:
          type: string
          format: uuid
          example: 11111111-2222-3333-4444-555555555555
      - name: node_id
        in: query
        required: false
        description: Workflow graph node whose POA record to patch, for graph workflows with multiple Proof of Address steps (also accepted as a `node_id` body field). When omitted, the most recent POA record on the session is patched. If no POA exists for the given node, the call returns `404` (`"The session does not have a POA for node '<node_id>'."`).
        schema:
          type: string
          example: feature_poa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: All fields optional — send only what you want to change.
              properties:
                issuing_state:
                  type: string
                  nullable: true
                  description: Country that issued the POA document, ISO 3166-1 alpha-3. Case-insensitive (normalized to uppercase); invalid codes return `400`.
                  example: ESP
                document_type:
                  type: string
                  enum:
                  - UTILITY_BILL
                  - BANK_STATEMENT
                  - GOVERNMENT_ISSUED_DOCUMENT
                  - OTHER_POA_DOCUMENT
                  - UNKNOWN
                  description: POA document category. Values are uppercase — lowercase variants like `utility_bill` return `400`.
                  example: UTILITY_BILL
                document_language:
                  type: string
                  maxLength: 50
                  nullable: true
                  description: Language of the document, typically an ISO 639-1 code (e.g. `es`). Free text — not validated as a language code.
                  example: es
                issuer:
                  type: string
                  maxLength: 255
                  nullable: true
                  description: Organization that issued the document (utility company, bank, government agency).
                  example: Energy Provider S.A.
                issue_date:
                  type: string
                  format: date
                  nullable: true
                  description: Issue date of the POA document in `YYYY-MM-DD`. Any other format returns `400`.
                  example: '2026-04-12'
                poa_address:
                  type: string
                  nullable: true
                  description: Free-text address as printed on the document. When this value changes (non-sandbox sessions only) and the structured address is still missing or incomplete, the server re-geocodes it in the background of the same request and may overwrite `poa_parsed_address` / `poa_formatted_address` with the geocoder result. The re-geocode also requires `issuing_state` to be present on the POA record.
                  example: Avda de Madrid 34, 28013 Madrid
                name_on_document:
                  type: string
                  maxLength: 255
                  nullable: true
                  description: Recipient name as printed on the document.
                  example: Carmen Espanola
                extra_fields:
                  type: object
                  additionalProperties: true
                  nullable: true
                  description: 'Document-specific extras, merged key-by-key. Nine keys map to dedicated POA columns: `bank_account_number`, `bank_iban`, `bank_sort_code`, `bank_routing_number`, `bank_swift_bic`, `bank_branch_name`, `bank_branch_address`, `document_phone_number`, and `additional_names` (must be a list of strings or `null`, otherwise `400`). Any other key is stored as a custom extra field. Per-key semantics: a value sets the key; `null` or `""` deletes it. Must be a JSON object, otherwise `400`.'
                poa_parsed_address:
                  type: object
                  nullable: true
                  description: 'Structured address. Only these nested keys are accepted: `address_type`, `city`, `region`, `street_1`, `street_2`, `postal_code`, `country` — any other key returns `400`. Per-key semantics: a value sets the key, `null` removes it. `formatted_address` (and the top-level `poa_formatted_address`) is recomputed server-side by joining `street_1`, `street_2`, `city`, `region`, `postal_code`, and `country` — you cannot set it directly.'
                  properties:
                    address_type:
                      type: string
                      nullable: true
                      description: Free-form address classification (e.g. `home`).
                    city:
                      type: string
                      nullable: true
                      example: Madrid
                    region:
                      type: string
                      nullable: true
                      description: State / province / autonomous community.
                    street_1:
                      type: string
                      nullable: true
                      example: Avda de Madrid 34
                    street_2:
                      type: string
                      nullable: true
                    postal_code:
                      type: string
                      nullable: true
                      example: '28013'
                    country:
                      type: string
                      nullable: true
                      description: ISO 3166-1 alpha-2 country code. Lowercase input is normalized to uppercase; alpha-3 codes are rejected with `400`.
                      example: ES
            examples:
              Correct issuer and address:
                summary: Fix document classification, issuer, and the structured address
                value:
                  issuing_state: ESP
                  document_type: BANK_STATEMENT
                  issuer: Banco Example S.A.
                  issue_date: '2026-05-02'
                  name_on_document: Carmen Espanola
                  poa_address: Avda de Madrid 34, 28013 Madrid
                  extra_fields:
                    bank_iban: ES9121000418450200051332
                    additional_names:
                    - Carmen E. Espanola
                  poa_parsed_address:
                    street_1: Avda de Madrid 34
                    city: Madrid
                    postal_code: '28013'
                    country: ES
              Remove a banking detail:
                summary: Delete one extra-field key, keep the rest
                value:
                  extra_fields:
                    bank_iban: null
      responses:
        '200':
          description: POA data updated. Returns the **full current POA record** (every updatable field with its stored value, plus the complete `extra_fields` map, `poa_parsed_address`, and `poa_formatted_address`) — not just the fields you submitted. The `data.updated` webhook fires only when at least one value actually changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuing_state:
                    type: string
                    nullable: true
                    description: Country that issued the POA document, ISO 3166-1 alpha-3. Case-insensitive (normalized to uppercase); invalid codes return `400`.
                    example: ESP
                  document_type:
                    type: string
                    enum:
                    - UTILITY_BILL
                    - BANK_STATEMENT
                    - GOVERNMENT_ISSUED_DOCUMENT
                    - OTHER_POA_DOCUMENT
                    - UNKNOWN
                    description: POA document category. Values are uppercase — lowercase variants like `utility_bill` return `400`.
                    example: UTILITY_BILL
                  document_language:
                    type: string
                    maxLength: 50
                    nullable: true
                    description: Language of the document, typically an ISO 639-1 code (e.g. `es`). Free text — not validated as a language code.
                    example: es
                  issuer:
                    type: string
                    maxLength: 255
                    nullable: true
                    description: Organization that issued the document (utility company, bank, government agency).
                    example: Energy Provider S.A.
                  issue_date:
                    type: string
                    format: date
                    nullable: true
                    description: Issue date of the POA document in `YYYY-MM-DD`. Any other format returns `400`.
                    example: '2026-04-12'
                  poa_address:
                    type: string
                    nullable: true
                    description: Free-text address as printed on the document. When this value changes (non-sandbox sessions only) and the structured address is still missing or incomplete, the server re-geocodes it in the background of the same request and may overwrite `poa_parsed_address` / `poa_formatted_address` with the geocoder result.
                    example: Avda de Madrid 34, 28013 Madrid
                  name_on_document:
                    type: string
                    maxLength: 255
                    nullable: true
                    description: Recipient name as printed on the document.
                    example: Carmen Espanola
                  extra_fields:
                    type: object
                    additionalProperties: true
                    nullable: true
                    description: 'Always present in the response: the nine known keys (with `null` for unset ones, `additional_names` defaulting to `[]`) plus any custom keys previously stored.'
                  poa_parsed_address:
                    type: object
                    nullable: true
                    description: Current structured address, or `null` when none exists. Includes the recomputed `formatted_address` alongside the seven editable keys. Returned as stored — after a server-side geocode it can contain bookkeeping keys (e.g. `raw_results`) alongside the editable keys.
                    properties:
                      address_type:
                        type: string
                        nullable: true
                        description: Free-form address classification (e.g. `home`).
                      city:
                        type: string
                        nullable: true
                        example: Madrid
                      region:
                        type: string
                        nullable: true
                        description: State / province / autonomous community.
                      street_1:
                        type: string
                        nullable: true
                        example: Avda de Madrid 34
                      street_2:
                        type: string
                        nullable: true
                      postal_code:
                        type: string
                        nullable: true
                        example: '28013'
