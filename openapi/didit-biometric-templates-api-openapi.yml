openapi: 3.2.0
info:
  version: 3.0.0
  title: Didit Verification Biometric Templates API
  description: Identity verification API. Authenticate with x-api-key header.
servers:
- url: https://verification.didit.me
tags:
- name: Biometric Templates
paths:
  /v3/biometric-templates/:
    get:
      summary: List retained biometric templates
      description: 'An opted-in application keeps one separately managed, image-free face biometric template anchored to the User when a session is deleted (see `DELETE /v3/session/{sessionId}/delete/`). Templates are biometric data with a finite `expires_at`; they never contain images, session data, or identity fields, and they are purged on User deletion, privacy erasure, expiry, or an explicit purge. These endpoints accept application API keys (`x-api-key`) only; Business Console user tokens are rejected with `403`.


        Returns a paginated list of the templates the application currently holds. Purged templates are not listed.'
      operationId: list_biometric_templates
      tags:
      - Biometric Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - in: query
        name: vendor_data
        required: false
        description: Case-insensitive substring match on the owning User's current `vendor_data`.
        schema:
          type: string
      - in: query
        name: vendor_user_uuid
        required: false
        description: Exact match on the owning User.
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        required: false
        description: Lifecycle status. Purged templates are never listed.
        schema:
          type: string
          enum:
          - pending
          - active
          - expired
          - held_out_of_use
          - purge_pending
          - purge_failed
      - in: query
        name: source_type
        required: false
        description: How the template was created.
        schema:
          type: string
          enum:
          - session_delete
          - automatic_retention
          - backfill
      - in: query
        name: retained_from
        required: false
        description: Templates retained at or after this time.
        schema:
          type: string
          format: date-time
      - in: query
        name: retained_to
        required: false
        description: Templates retained at or before this time. Must not be earlier than `retained_from` (`400`).
        schema:
          type: string
          format: date-time
      - in: query
        name: ordering
        required: false
        description: Sort order.
        schema:
          type: string
          enum:
          - retained_at
          - -retained_at
          - expires_at
          - -expires_at
          default: -retained_at
      - in: query
        name: limit
        required: false
        description: Page size.
        schema:
          type: integer
      - in: query
        name: offset
        required: false
        description: Pagination offset.
        schema:
          type: integer
      responses:
        '200':
          description: Paginated templates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                  previous:
                    type:
                    - string
                    - 'null'
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          format: uuid
                          description: Template id. Randomly generated; not derived from the deleted session or its face.
                        vendor_user_uuid:
                          type: string
                          format: uuid
                          description: The owning User.
                        vendor_data:
                          type:
                          - string
                          - 'null'
                          description: The User's current `vendor_data`, resolved when you read the template (never copied).
                        source_type:
                          type: string
                          enum:
                          - session_delete
                          - automatic_retention
                          - backfill
                          description: 'How the template was created: a session deletion (API or Console), the application''s automatic data-retention window, or a Didit-operated backfill you instructed.'
                        provenance_reference:
                          type: string
                          format: uuid
                          description: Opaque reference tying the template to its audit trail. It is not the deleted session's id and cannot be resolved to it.
                        retention_policy:
                          type: string
                          enum:
                          - delete_with_session
                          - retain_until_user_deleted
                          description: The application policy at retention time.
                        retention_override:
                          type:
                          - boolean
                          - 'null'
                          description: The `retain_face_embeddings` value sent on the deletion, or `null` when the policy applied.
                        retained_at:
                          type: string
                          format: date-time
                        expires_at:
                          type: string
                          format: date-time
                          description: When the template expires and is purged automatically. Always set.
                        retained_by:
                          type:
                          - string
                          - 'null'
                          description: 'Principal that gave the instruction: the application id for API keys, the Console member id for Console actions, or a `service:` identifier for automatic retention. Never an email address.'
                        retained_by_type:
                          type: string
                          enum:
                          - API_KEY
                          - CONSOLE_USER
                          - SYSTEM
                        instruction_class:
                          type: string
                          enum:
                          - operational_session_delete
                          - privacy_erasure
                        instruction_source:
                          type: string
                          enum:
                          - api
                          - console
                          - automatic_retention
                          - backfill
                          - privacy_erasure
                          - explicit_template_purge
                          - vendor_user_delete
                          - expiry
                          - reconciliation
                          - migration
                          - system
                        instruction_id:
                          type: string
                          description: The `instruction_id` sent on the deletion, or a Didit-generated id.
                        held_out_of_use:
                          type: boolean
                          description: '`true` only while a legal hold applies. A held template is excluded from all matching.'
                        status:
                          type: string
                          enum:
                          - pending
                          - active
                          - expired
                          - held_out_of_use
                          - purge_pending
                          - purge_failed
                          - purged
                          description: Only `active` templates that are not held, not past `expires_at`, and whose User still exists take part in matching.
                        purged_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
              examples:
                One active template:
                  value:
                    count: 1
                    next: null
                    previous: null
                    results:
                    - uuid: 9d2f4b6e-1c3a-4e8f-b7d5-0a1c2e3f4a5b
                      vendor_user_uuid: 2f7c1a9e-8b4d-4c6a-9e1f-3d5b7a9c1e2f
                      vendor_data: user-42
                      source_type: session_delete
                      provenance_reference: 6b1e8d2f-4a3c-4f9e-8c7d-1a2b3c4d5e6f
                      retention_policy: retain_until_user_deleted
                      retention_override: null
                      retained_at: '2026-08-28T10:15:42.318402Z'
                      expires_at: '2027-08-28T10:15:42.318402Z'
                      retained_by: 3c9e2b1f-7d4a-4e8b-9c1d-5f6a7b8c9d0e
                      retained_by_type: API_KEY
                      instruction_class: operational_session_delete
                      instruction_source: api
                      instruction_id: post-approval-cleanup-2026-08
                      held_out_of_use: false
                      status: active
                      purged_at: null
        '400':
          description: Invalid filter value, or `retained_to` earlier than `retained_from`. Field-keyed validation errors.
          content:
            application/json:
              examples:
                Bad range:
                  value:
                    retained_to:
                    - Must be on or after retained_from.
        '403':
          description: Console user token, or the API key is not allowed. These endpoints accept application API keys only.
          content:
            application/json:
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X GET 'https://verification.didit.me/v3/biometric-templates/?vendor_data=user-42&status=active' \\\n  -H 'x-api-key: YOUR_API_KEY'"
  /v3/biometric-templates/count/:
    get:
      summary: Count retained biometric templates
      description: 'An opted-in application keeps one separately managed, image-free face biometric template anchored to the User when a session is deleted (see `DELETE /v3/session/{sessionId}/delete/`). Templates are biometric data with a finite `expires_at`; they never contain images, session data, or identity fields, and they are purged on User deletion, privacy erasure, expiry, or an explicit purge. These endpoints accept application API keys (`x-api-key`) only; Business Console user tokens are rejected with `403`.


        Returns the number of templates matching the same filters as the list endpoint. Use it to check what a filtered bulk purge with `delete_all: true` would touch.'
      operationId: count_biometric_templates
      tags:
      - Biometric Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - in: query
        name: vendor_data
        required: false
        description: Case-insensitive substring match on the owning User's current `vendor_data`.
        schema:
          type: string
      - in: query
        name: vendor_user_uuid
        required: false
        description: Exact match on the owning User.
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        required: false
        description: Lifecycle status. Purged templates are never listed.
        schema:
          type: string
          enum:
          - pending
          - active
          - expired
          - held_out_of_use
          - purge_pending
          - purge_failed
      - in: query
        name: source_type
        required: false
        description: How the template was created.
        schema:
          type: string
          enum:
          - session_delete
          - automatic_retention
          - backfill
      - in: query
        name: retained_from
        required: false
        description: Templates retained at or after this time.
        schema:
          type: string
          format: date-time
      - in: query
        name: retained_to
        required: false
        description: Templates retained at or before this time. Must not be earlier than `retained_from` (`400`).
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    minimum: 0
              examples:
                Count:
                  value:
                    count: 128
        '400':
          description: Invalid filter value, or `retained_to` earlier than `retained_from`. Field-keyed validation errors.
          content:
            application/json:
              examples:
                Bad range:
                  value:
                    retained_to:
                    - Must be on or after retained_from.
        '403':
          description: Console user token, or the API key is not allowed. These endpoints accept application API keys only.
          content:
            application/json:
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X GET 'https://verification.didit.me/v3/biometric-templates/count/?status=active' \\\n  -H 'x-api-key: YOUR_API_KEY'"
  /v3/biometric-templates/{template_uuid}/:
    get:
      summary: Get a retained biometric template
      description: 'An opted-in application keeps one separately managed, image-free face biometric template anchored to the User when a session is deleted (see `DELETE /v3/session/{sessionId}/delete/`). Templates are biometric data with a finite `expires_at`; they never contain images, session data, or identity fields, and they are purged on User deletion, privacy erasure, expiry, or an explicit purge. These endpoints accept application API keys (`x-api-key`) only; Business Console user tokens are rejected with `403`.


        Returns one template. The response never includes an image, a vector, the deleted session''s id, or identity data.'
      operationId: get_biometric_template
      tags:
      - Biometric Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: template_uuid
        required: true
        description: Template id, as returned in `biometric_template_uuid` by the session deletion endpoints, `biometric_template_id` on a Face Search match, or the list endpoint.
        schema:
          type: string
          format: uuid
          example: 9d2f4b6e-1c3a-4e8f-b7d5-0a1c2e3f4a5b
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    format: uuid
                    description: Template id. Randomly generated; not derived from the deleted session or its face.
                  vendor_user_uuid:
                    type: string
                    format: uuid
                    description: The owning User.
                  vendor_data:
                    type:
                    - string
                    - 'null'
                    description: The User's current `vendor_data`, resolved when you read the template (never copied).
                  source_type:
                    type: string
                    enum:
                    - session_delete
                    - automatic_retention
                    - backfill
                    description: 'How the template was created: a session deletion (API or Console), the application''s automatic data-retention window, or a Didit-operated backfill you instructed.'
                  provenance_reference:
                    type: string
                    format: uuid
                    description: Opaque reference tying the template to its audit trail. It is not the deleted session's id and cannot be resolved to it.
                  retention_policy:
                    type: string
                    enum:
                    - delete_with_session
                    - retain_until_user_deleted
                    description: The application policy at retention time.
                  retention_override:
                    type:
                    - boolean
                    - 'null'
                    description: The `retain_face_embeddings` value sent on the deletion, or `null` when the policy applied.
                  retained_at:
                    type: string
                    format: date-time
                  expires_at:
                    type: string
                    format: date-time
                    description: When the template expires and is purged automatically. Always set.
                  retained_by:
                    type:
                    - string
                    - 'null'
                    description: 'Principal that gave the instruction: the application id for API keys, the Console member id for Console actions, or a `service:` identifier for automatic retention. Never an email address.'
                  retained_by_type:
                    type: string
                    enum:
                    - API_KEY
                    - CONSOLE_USER
                    - SYSTEM
                  instruction_class:
                    type: string
                    enum:
                    - operational_session_delete
                    - privacy_erasure
                  instruction_source:
                    type: string
                    enum:
                    - api
                    - console
                    - automatic_retention
                    - backfill
                    - privacy_erasure
                    - explicit_template_purge
                    - vendor_user_delete
                    - expiry
                    - reconciliation
                    - migration
                    - system
                  instruction_id:
                    type: string
                    description: The `instruction_id` sent on the deletion, or a Didit-generated id.
                  held_out_of_use:
                    type: boolean
                    description: '`true` only while a legal hold applies. A held template is excluded from all matching.'
                  status:
                    type: string
                    enum:
                    - pending
                    - active
                    - expired
                    - held_out_of_use
                    - purge_pending
                    - purge_failed
                    - purged
                    description: Only `active` templates that are not held, not past `expires_at`, and whose User still exists take part in matching.
                  purged_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
              examples:
                Active template:
                  value:
                    uuid: 9d2f4b6e-1c3a-4e8f-b7d5-0a1c2e3f4a5b
                    vendor_user_uuid: 2f7c1a9e-8b4d-4c6a-9e1f-3d5b7a9c1e2f
                    vendor_data: user-42
                    source_type: session_delete
                    provenance_reference: 6b1e8d2f-4a3c-4f9e-8c7d-1a2b3c4d5e6f
                    retention_policy: retain_until_user_deleted
                    retention_override: null
                    retained_at: '2026-08-28T10:15:42.318402Z'
                    expires_at: '2027-08-28T10:15:42.318402Z'
                    retained_by: 3c9e2b1f-7d4a-4e8b-9c1d-5f6a7b8c9d0e
                    retained_by_type: API_KEY
                    instruction_class: operational_session_delete
                    instruction_source: api
                    instruction_id: post-approval-cleanup-2026-08
                    held_out_of_use: false
                    status: active
                    purged_at: null
        '403':
          description: Console user token, or the API key is not allowed. These endpoints accept application API keys only.
          content:
            application/json:
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
        '404':
          description: Unknown template, a template of another application, or (on `GET`) a purged template.
          content:
            application/json:
              examples:
                Not found:
                  value:
                    detail: Biometric template not found.
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X GET https://verification.didit.me/v3/biometric-templates/9d2f4b6e-1c3a-4e8f-b7d5-0a1c2e3f4a5b/ \\\n  -H 'x-api-key: YOUR_API_KEY'"
    delete:
      summary: Purge a retained biometric template
      description: 'An opted-in application keeps one separately managed, image-free face biometric template anchored to the User when a session is deleted (see `DELETE /v3/session/{sessionId}/delete/`). Templates are biometric data with a finite `expires_at`; they never contain images, session data, or identity fields, and they are purged on User deletion, privacy erasure, expiry, or an explicit purge. These endpoints accept application API keys (`x-api-key`) only; Business Console user tokens are rejected with `403`.


        Purges one template: it is removed from every kind of matching and the stored template is deleted. Irreversible and recorded on the audit trail with the acting principal.


        **Retry semantics:** Didit deletes the stored template first and only then marks the template purged. If a biometric store is unavailable the call returns `503`, the template moves to `status: purge_failed` and is already excluded from matching; repeat the same call to finish. Repeating a purge of an already purged template returns `already_purged`.


        Templates are also purged by `POST /v3/users/delete/` for the owning User, by any deletion of that User''s sessions with `deletion_instruction: privacy_erasure`, and automatically at `expires_at`.'
      operationId: purge_biometric_template
      tags:
      - Biometric Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: template_uuid
        required: true
        description: Template id, as returned in `biometric_template_uuid` by the session deletion endpoints, `biometric_template_id` on a Face Search match, or the list endpoint.
        schema:
          type: string
          format: uuid
          example: 9d2f4b6e-1c3a-4e8f-b7d5-0a1c2e3f4a5b
      responses:
        '200':
          description: Purge outcome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    format: uuid
                  outcome:
                    type: string
                    enum:
                    - purged
                    - already_purged
              examples:
                Purged:
                  value:
                    uuid: 9d2f4b6e-1c3a-4e8f-b7d5-0a1c2e3f4a5b
                    outcome: purged
                Already purged:
                  value:
                    uuid: 9d2f4b6e-1c3a-4e8f-b7d5-0a1c2e3f4a5b
                    outcome: already_purged
        '403':
          description: Console user token, or the API key is not allowed. These endpoints accept application API keys only.
          content:
            application/json:
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
        '404':
          description: Unknown template, a template of another application, or (on `GET`) a purged template.
          content:
            application/json:
              examples:
                Not found:
                  value:
                    detail: Biometric template not found.
        '503':
          description: A biometric store was unavailable while retaining or purging a biometric template. Nothing is deleted; repeat the same request. Retries are idempotent and converge on a single template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              examples:
                Retryable:
                  value:
                    detail: The biometric-template operation could not finish because an external store is unavailable. The operation is retryable.
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X DELETE https://verification.didit.me/v3/biometric-templates/9d2f4b6e-1c3a-4e8f-b7d5-0a1c2e3f4a5b/ \\\n  -H 'x-api-key: YOUR_API_KEY'"
  /v3/biometric-templates/delete/:
    post:
      summary: Bulk purge retained biometric templates
      description: 'An opted-in application keeps one separately managed, image-free face biometric template anchored to the User when a session is deleted (see `DELETE /v3/session/{sessionId}/delete/`). Templates are biometric data with a finite `expires_at`; they never contain images, session data, or identity fields, and they are purged on User deletion, privacy erasure, expiry, or an explicit purge. These endpoints accept application API keys (`x-api-key`) only; Business Console user tokens are rejected with `403`.


        Purges many templates in one call, by explicit id list or with `delete_all: true` optionally narrowed by the same filters as the list endpoint. Templates are purged one by one and each result reports `purged` or `already_purged`. If a biometric store is unavailable the call returns `503` at the first failing template: templates purged earlier in the request stay purged, the failing one moves to `purge_failed` (already excluded from matching), and repeating the request finishes the job.


        **`delete_all: true` without filters purges every biometric template in the application and cannot be undone.** Run the count endpoint with the same filters first.'
      operationId: bulk_purge_biometric_templates
      tags:
      - Biometric Templates
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                template_uuids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  description: Templates to purge. Required unless `delete_all` is `true`. Already purged ids are reported as `already_purged`.
                delete_all:
                  type: boolean
                  default: false
                  description: When `true`, purges every template matching the filters below (all of the application's templates when no filter is given). `template_uuids` is ignored. Irreversible.
                vendor_data:
                  type: string
                  description: 'Only with `delete_all`: case-insensitive substring match on the owning User''s `vendor_data`.'
                vendor_user_uuid:
                  type: string
                  format: uuid
                  description: 'Only with `delete_all`: exact match on the owning User.'
                status:
                  type: string
                  enum:
                  - pending
                  - active
                  - expired
                  - held_out_of_use
                  - purge_pending
                  - purge_failed
                  description: Only with `delete_all`.
                source_type:
                  type: string
                  enum:
                  - session_delete
                  - automatic_retention
                  - backfill
                  description: Only with `delete_all`.
                retained_from:
                  type: string
                  format: date-time
                  description: Only with `delete_all`.
                retained_to:
                  type: string
                  format: date-time
                  description: Only with `delete_all`. Must not be earlier than `retained_from`.
            examples:
              By id:
                value:
                  template_uuids:
                  - 9d2f4b6e-1c3a-4e8f-b7d5-0a1c2e3f4a5b
                  - 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              Every template of one User:
                value:
                  delete_all: true
                  vendor_user_uuid: 2f7c1a9e-8b4d-4c6a-9e1f-3d5b7a9c1e2f
              Every template in the application:
                value:
                  delete_all: true
      responses:
        '200':
          description: Per-template purge outcomes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          format: uuid
                        outcome:
                          type: string
                          enum:
                          - purged
                          - already_purged
              examples:
                Mixed:
                  value:
                    results:
                    - uuid: 9d2f4b6e-1c3a-4e8f-b7d5-0a1c2e3f4a5b
                      outcome: purged
                    - uuid: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                      outcome: already_purged
        '400':
          description: Validation error — nothing is purged.
          content:
            application/json:
              examples:
                Missing selector:
                  value:
                    template_uuids:
                    - This field is required unless delete_all is true.
                Bad range:
                  value:
                    retained_to:
                    - Must be on or after retained_from.
        '403':
          description: Console user token, or the API key is not allowed. These endpoints accept application API keys only.
          content:
            application/json:
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
        '503':
          description: A biometric store was unavailable while retaining or purging a biometric template. Nothing is deleted; repeat the same request. Retries are idempotent and converge on a single template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              examples:
                Retryable:
                  value:
                    detail: The biometric-template operation could not finish because an external store is unavailable. The operation is retryable.
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X POST https://verification.didit.me/v3/biometric-templates/delete/ \\\n  -H 'x-api-key: YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"delete_all\": true, \"vendor_user_uuid\": \"2f7c1a9e-8b4d-4c6a-9e1f-3d5b7a9c1e2f\"}'"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: 'Your application''s API key, from Developers -> API keys in the Business Console. The primary key has full access. A named key can be scoped: none, read or write per resource, limited to some workflows or to approved sessions, to a list of IP addresses, and to an expiry date. 401 means the key is missing, wrong, revoked or expired; 403 means the key has no access to this resource or action, or the request came from an address outside its IP list; 404 on a session route means the session is outside the key''s workflows or statuses. A key without media access receives image, video and PDF URLs as null, and a key without sessions write receives session links and tokens as null. See https://docs.didit.me/console/api-keys.'
    TransactionTokenAuth:
      type: apiKey
      in: header
      name: X-Transaction-Token
      description: Short-lived scoped token minted by your backend via POST /v3/transactions/sdk-token/. Used by the Didit SDKs on the device-facing /v1/transactions/ endpoints.
    SessionTokenAuth:
      type: apiKey
      in: header
      name: Session-Token
      description: Short-lived token returned in the `session_token` field of POST /v3/session/. Used by the hosted verification flow (and custom sandbox UIs) to call session-scoped endpoints on behalf of the verifying user, without your server-side API key.
    BearerAuth:
      type: http
      scheme: bearer
      description: The application's client-credentials access token.
    CaseRequestToken:
      type: apiKey
      in: header
      name: X-Case-Request-Token
      description: Request-specific credential from the secure link. Grants access only to this request.
