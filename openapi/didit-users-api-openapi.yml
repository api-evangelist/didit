                      created_at: '2025-06-15T10:30:00Z'
                    created_at: '2025-06-01T08:00:00Z'
                    updated_at: '2025-06-15T10:30:00Z'
        '400':
          description: Missing or invalid `status`.
          content:
            application/json:
              examples:
                Missing status:
                  value:
