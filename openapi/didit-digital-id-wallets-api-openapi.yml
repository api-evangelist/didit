openapi: 3.2.0
info:
  version: 3.0.0
  title: Didit Verification Digital ID wallets API
  description: Identity verification API. Authenticate with x-api-key header.
servers:
- url: https://verification.didit.me
tags:
- name: Digital ID wallets
paths:
  /v3/id-verification/wallets/:
    get:
      operationId: list_wallets
      description: Every Digital ID wallet with its start endpoint, countries, required fields and whether this application can start it in this environment now. Listed does not mean live.
      summary: List Digital ID wallets
      tags:
      - Digital ID wallets
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiWalletCatalogResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiClientCredentialsForbiddenErrorMessage'
          description: 'Missing or invalid credentials (x-api-key or Authorization: Bearer).'
      x-codeSamples:
      - lang: curl
        label: cURL
        source: "curl --request GET \\\n  --url https://verification.didit.me/v3/id-verification/wallets/ \\\n  --header 'x-api-key: YOUR_API_KEY'"
      - lang: python
        label: Python
        source: "import os\nimport requests\n\nheaders = {\n    \"x-api-key\": os.environ[\"DIDIT_API_KEY\"]\n}\n\nresponse = requests.get(\n    \"https://verification.didit.me/v3/id-verification/wallets/\",\n    headers=headers,\n    timeout=30,\n)\nresponse.raise_for_status()\nprint(response.json())\n"
  /v3/id-verification/wallets/verifications/{request_id}/:
    get:
      operationId: get_wallet_verification
      description: 'Status and result of a wallet verification: the normalized identity and the wallet''s own attributes once verified, the error code once declined, the next action while pending. A verification past expires_at is decided timeout.'
      summary: Get a wallet verification
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        description: The request_id the start endpoint returned.
        required: true
      tags:
      - Digital ID wallets
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiWalletVerificationResponse'
              example:
                request_id: 00000000-0000-4000-8000-000000000001
                wallet_verification:
                  wallet:
                    id: ftn
                    name: Finnish Trust Network
                    issuing_authority: Finnish banks and mobile operators (FTN)
                  country: FIN
                  status: Not Finished
                  outcome: pending
                  error: null
                  interaction: redirect
                  simulated: false
                  expires_at: '2026-01-01T10:10:00Z'
                  next_action:
                    type: redirect
                    url: https://wallet.example.com/authorize
                  identity: null
                  attributes: null
                  level_of_assurance: null
                  verified_at: null
                  signature_valid: null
                  credential_type: person_identification
                vendor_data: your-customer-reference
                metadata:
                  reference: example
                created_at: '2026-01-01T10:00:00Z'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiClientCredentialsForbiddenErrorMessage'
          description: 'Missing or invalid credentials (x-api-key or Authorization: Bearer).'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiWalletVerificationError'
          description: 'error not_found: no wallet verification of this application has this request_id.'
      x-codeSamples:
      - lang: curl
        label: cURL
        source: "curl --request GET \\\n  --url https://verification.didit.me/v3/id-verification/wallets/verifications/REQUEST_ID/ \\\n  --header 'x-api-key: YOUR_API_KEY'"
      - lang: python
        label: Python
        source: "import os\nimport requests\n\nheaders = {\n    \"x-api-key\": os.environ[\"DIDIT_API_KEY\"]\n}\n\nresponse = requests.get(\n    \"https://verification.didit.me/v3/id-verification/wallets/verifications/REQUEST_ID/\",\n    headers=headers,\n    timeout=30,\n)\nresponse.raise_for_status()\nprint(response.json())\n"
  /v3/id-verification/wallets/verifications/{request_id}/poll/:
    post:
      operationId: poll_wallet_verification
      description: 'Smart-ID and Mobile-ID: ask the provider whether the user confirmed, refused or let the prompt lapse, and verify the signed identity when they confirmed. Redirect wallets complete through the user''s browser, so for them this only reads the verification back. Answers the verification as it is afterwards.'
      summary: Poll a wallet verification
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        description: The request_id the start endpoint returned.
        required: true
      tags:
      - Digital ID wallets
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiWalletVerificationResponse'
              example:
                request_id: 00000000-0000-4000-8000-000000000001
                wallet_verification:
                  wallet:
                    id: smart_id
                    name: Smart-ID
                    issuing_authority: SK ID Solutions
                  country: EST
                  status: Not Finished
                  outcome: pending
                  error: null
                  interaction: in_app
                  simulated: true
                  expires_at: '2026-01-01T10:10:00Z'
                  next_action:
                    type: confirm_in_app
                    verification_code: '1234'
                    poll_interval_seconds: 2
                  identity: null
                  attributes: null
                  level_of_assurance: null
                  verified_at: null
                  signature_valid: null
                  credential_type: person_identification
                vendor_data: your-customer-reference
                metadata:
                  reference: example
                created_at: '2026-01-01T10:00:00Z'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiClientCredentialsForbiddenErrorMessage'
          description: 'Missing or invalid credentials (x-api-key or Authorization: Bearer).'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiWalletVerificationError'
          description: 'error not_found: no wallet verification of this application has this request_id.'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiWalletVerificationError'
          description: 'error wallet_not_configured: this environment cannot reach the wallet.'
      x-codeSamples:
      - lang: curl
        label: cURL
        source: "curl --request POST \\\n  --url https://verification.didit.me/v3/id-verification/wallets/verifications/REQUEST_ID/poll/ \\\n  --header 'x-api-key: YOUR_API_KEY'"
      - lang: python
        label: Python
        source: "import os\nimport requests\n\nheaders = {\n    \"x-api-key\": os.environ[\"DIDIT_API_KEY\"]\n}\n\nresponse = requests.post(\n    \"https://verification.didit.me/v3/id-verification/wallets/verifications/REQUEST_ID/poll/\",\n    headers=headers,\n    timeout=30,\n)\nresponse.raise_for_status()\nprint(response.json())\n"
  /v3/id-verification/wallets/verifications/{request_id}/cancel/:
    post:
      operationId: cancel_wallet_verification
      description: 'Withdraw a pending verification: it is declined as cancelled and never billed. A decided one is returned unchanged. Smart-ID and Mobile-ID: a cancel that arrives while a poll is checking the sign-in waits a few seconds for that poll, then declines it, or returns it verified if the user had already confirmed. A verification the user is completing right now cannot be cancelled (409 verification_in_progress with Retry-After): retry after that many seconds to read its outcome.'
      summary: Cancel a wallet verification
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        description: The request_id the start endpoint returned.
        required: true
      tags:
      - Digital ID wallets
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiWalletVerificationResponse'
              example:
                request_id: 00000000-0000-4000-8000-000000000001
                wallet_verification:
                  wallet:
                    id: ftn
                    name: Finnish Trust Network
                    issuing_authority: Finnish banks and mobile operators (FTN)
                  country: FIN
                  status: Declined
                  outcome: cancelled
                  error: cancelled_by_customer
                  interaction: redirect
                  simulated: false
                  expires_at: '2026-01-01T10:10:00Z'
                  next_action: null
                  identity: null
                  attributes: null
                  level_of_assurance: null
                  verified_at: null
                  signature_valid: null
                  credential_type: person_identification
                vendor_data: your-customer-reference
                metadata:
                  reference: example
                created_at: '2026-01-01T10:00:00Z'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiClientCredentialsForbiddenErrorMessage'
          description: 'Missing or invalid credentials (x-api-key or Authorization: Bearer).'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiWalletVerificationError'
          description: 'error not_found: no wallet verification of this application has this request_id.'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiWalletVerificationError'
          description: 'error verification_in_progress: the user is completing this sign-in right now. The Retry-After header says when to retry; the retry returns the decided verification.'
      x-codeSamples:
      - lang: curl
        label: cURL
        source: "curl --request POST \\\n  --url https://verification.didit.me/v3/id-verification/wallets/verifications/REQUEST_ID/cancel/ \\\n  --header 'x-api-key: YOUR_API_KEY'"
      - lang: python
        label: Python
        source: "import os\nimport requests\n\nheaders = {\n    \"x-api-key\": os.environ[\"DIDIT_API_KEY\"]\n}\n\nresponse = requests.post(\n    \"https://verification.didit.me/v3/id-verification/wallets/verifications/REQUEST_ID/cancel/\",\n    headers=headers,\n    timeout=30,\n)\nresponse.raise_for_status()\nprint(response.json())\n"
  /v3/id-verification/wallets/mitid/:
    post:
      operationId: start_mitid_wallet_verification
      description: 'Start a MitID sign-in (Danish Agency for Digital Government; DNK) without any workflow. Billed once, only when the identity is verified. The response carries next_action.type=redirect with the URL to send the user''s browser to; the user returns to return_url with request_id and result appended. Read the outcome with GET /v3/id-verification/wallets/verifications/{request_id}/ or from the webhook, never from the URL. Sandbox applications get a deterministic simulation (simulated: true) that never contacts the provider.'
      summary: Start MitID verification
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Optional retry-safety key (max 255 characters). Retrying with the same key, wallet and body returns the original verification without starting a second sign-in; the same key with another wallet or body returns 409 idempotency_key_reused.
      tags:
      - Digital ID wallets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DigitalIdWalletApiMitidWalletVerificationStartRequest'
            example:
              country: DNK
              vendor_data: your-customer-reference
              metadata:
                reference: example
              return_url: https://app.example.com/identity/complete
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DigitalIdWalletApiMitidWalletVerificationStartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DigitalIdWalletApiMitidWalletVerificationStartRequest'
        required: true
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiWalletVerificationResponse'
              example:
                request_id: 00000000-0000-4000-8000-000000000001
                wallet_verification:
                  wallet:
                    id: mitid
                    name: MitID
                    issuing_authority: Danish Agency for Digital Government
                  country: DNK
                  status: Not Finished
                  outcome: pending
                  error: null
                  interaction: redirect
                  simulated: false
                  expires_at: '2026-01-01T10:10:00Z'
                  next_action:
                    type: redirect
                    url: https://wallet.example.com/authorize
                  identity: null
                  attributes: null
                  level_of_assurance: null
                  verified_at: null
                  signature_valid: null
                  credential_type: person_identification
                vendor_data: your-customer-reference
                metadata:
                  reference: example
                created_at: '2026-01-01T10:00:00Z'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiWalletVerificationStartBadRequest'
          description: 'Field validation errors ({field: [messages]}), or error return_url_invalid, return_url_not_allowed, invalid_personal_code, invalid_phone_number or idempotency_key_invalid.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiWalletVerificationStartForbidden'
          description: Missing or invalid credentials ({detail}), or error wallet_unavailable, insufficient_credits or contract_rate_missing.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiWalletVerificationError'
          description: error idempotency_key_reused or idempotency_key_in_progress (with Retry-After).
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiWalletVerificationError'
          description: 'error wallet_provider_unavailable: the provider could not start; nothing was created.'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalIdWalletApiWalletVerificationError'
          description: 'error wallet_not_configured: this environment cannot reach the wallet.'
      x-codeSamples:
      - lang: curl
        label: cURL
        source: "curl --request POST \\\n  --url https://verification.didit.me/v3/id-verification/wallets/mitid/ \\\n  --header 'x-api-key: YOUR_API_KEY' \\\n  --header 'Idempotency-Key: your-unique-attempt-key' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n  \"country\": \"DNK\",\n  \"vendor_data\": \"your-customer-reference\",\n  \"metadata\": {\n    \"reference\": \"example\"\n  },\n  \"return_url\": \"https://app.example.com/identity/complete\"\n}'"
      - lang: python
        label: Python
        source: "import os\nimport requests\n\nheaders = {\n    \"x-api-key\": os.environ[\"DIDIT_API_KEY\"],\n    \"Idempotency-Key\": \"your-unique-attempt-key\"\n}\npayload = {'country': 'DNK',\n 'vendor_data': 'your-customer-reference',\n 'metadata': {'reference': 'example'},\n 'return_url': 'https://app.example.com/identity/complete'}\n\nresponse = requests.post(\n    \"https://verification.didit.me/v3/id-verification/wallets/mitid/\",\n    headers=headers,\n    json=payload,\n    timeout=30,\n)\nresponse.raise_for_status()\nprint(response.json())\n"
      x-didit-wallet-id: mitid
