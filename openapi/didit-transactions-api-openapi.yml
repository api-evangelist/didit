        label: curl
        source: "curl -X GET 'https://verification.didit.me/v3/transactions/rules/RULE_UUID/' \\\n  -H 'x-api-key: YOUR_API_KEY'"
    patch:
      summary: Update rule
      description: Partially update a rule. Custom rules accept every configuration field. Library (PRESET) rules accept only `mode` - use it to activate, disable, or switch a preset to TEST; any other field returns 400.
      operationId: updateTransactionRule
      tags:
      - Transactions
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRuleUpdateRequest'
            example:
              mode: ACTIVE
      responses:
        '200':
          description: The updated rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRuleDetail'
        '400':
          description: Validation error, or a non-mode field on a library rule.
          content:
            application/json:
              schema:
                type: object
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X PATCH 'https://verification.didit.me/v3/transactions/rules/RULE_UUID/' \\\n  -H 'x-api-key: YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"mode\": \"ACTIVE\"}'"
      - lang: python
        label: Python
        source: "import os\n\nimport requests\n\nresp = requests.patch(\n    'https://verification.didit.me/v3/transactions/rules/RULE_UUID/',\n    headers={'x-api-key': os.environ['DIDIT_API_KEY']},\n    json={'mode': 'ACTIVE'},\n    timeout=15,\n)\nresp.raise_for_status()\nprint(resp.json()['mode'])"
    delete:
      summary: Delete rule
      description: 'Delete a CUSTOM rule. Deletion is immediate and permanent: the rule stops evaluating for new transactions and disappears from listings, while past rule runs on already-evaluated transactions keep their recorded results. Library rules cannot be deleted - uninstall them via the install endpoint instead (they can always be reinstalled from the library).'
      operationId: deleteTransactionRule
      tags:
      - Transactions
      security:
      - ApiKeyAuth: []
      responses:
        '204':
          description: Deleted.
        '400':
          description: The rule is a library preset - uninstall instead.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: Library rules cannot be deleted. Uninstall them via the rules install endpoint instead.
        '404':
          description: No such rule on this application.
          content:
            application/json:
              schema:
                type: object
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X DELETE 'https://verification.didit.me/v3/transactions/rules/RULE_UUID/' \\\n  -H 'x-api-key: YOUR_API_KEY'"
  /v3/transactions/rules/backtest/:
    post:
      summary: Backtest rule configuration
      description: Evaluate a hypothetical rule configuration against your recent transactions (most recent first, up to the backtest cap) without creating a rule or touching any transaction. Use it before activating a rule to see how often it would have matched and how many subjects it would have affected.
      operationId: backtestTransactionRules
      tags:
      - Transactions
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRuleBacktestRequest'
            example:
              conditions:
              - field: currency
                operator: eq
                value: EUR
              - field: amount
                operator: lt
                value: 10000
              aggregation:
              - metric: count
                operator: gte
                value: 20
                window: 30d
                filters:
                  direction: INBOUND
                  transaction_type: finance
                  subject_vendor_data: __current__
                  currency: EUR
              - metric: max
                field: amount
                operator: lt
                value: 10000
                window: 30d
                filters:
                  direction: INBOUND
                  transaction_type: finance
                  subject_vendor_data: __current__
                  currency: EUR
              evaluation_mode: ALL
              scope:
                transaction_types:
                - finance
                directions:
                - INBOUND
              period_days: 90
      responses:
        '200':
          description: Backtest statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRuleBacktestResult'
              example:
                evaluated: 4820
                matched: 12
                affected_entities: 4
                period_days: 90
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X POST 'https://verification.didit.me/v3/transactions/rules/backtest/' \\\n  -H 'x-api-key: YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"conditions\": [{\"field\": \"currency\", \"operator\": \"eq\", \"value\": \"EUR\"}, {\"field\": \"amount\", \"operator\": \"lt\", \"value\": 10000}], \"aggregation\": [{\"metric\": \"count\", \"operator\": \"gte\", \"value\": 20, \"window\": \"30d\", \"filters\": {\"direction\": \"INBOUND\", \"transaction_type\": \"finance\", \"subject_vendor_data\": \"__current__\", \"currency\": \"EUR\"}}, {\"metric\": \"max\", \"field\": \"amount\", \"operator\": \"lt\", \"value\": 10000, \"window\": \"30d\", \"filters\": {\"direction\": \"INBOUND\", \"transaction_type\": \"finance\", \"subject_vendor_data\": \"__current__\", \"currency\": \"EUR\"}}], \"evaluation_mode\": \"ALL\", \"scope\": {\"transaction_types\": [\"finance\"], \"directions\": [\"INBOUND\"]}, \"period_days\": 90}'"
      - lang: python
        label: Python
        source: "import os\n\nimport requests\n\nresp = requests.post(\n    'https://verification.didit.me/v3/transactions/rules/backtest/',\n    headers={'x-api-key': os.environ['DIDIT_API_KEY']},\n    json={\n    \"conditions\": [\n        {\n            \"field\": \"currency\",\n            \"operator\": \"eq\",\n            \"value\": \"EUR\"\n        },\n        {\n            \"field\": \"amount\",\n            \"operator\": \"lt\",\n            \"value\": 10000\n        }\n    ],\n    \"aggregation\": [\n        {\n            \"metric\": \"count\",\n            \"operator\": \"gte\",\n            \"value\": 20,\n            \"window\": \"30d\",\n            \"filters\": {\n                \"direction\": \"INBOUND\",\n                \"transaction_type\": \"finance\",\n                \"subject_vendor_data\": \"__current__\",\n                \"currency\": \"EUR\"\n            }\n        },\n        {\n            \"metric\": \"max\",\n            \"field\": \"amount\",\n            \"operator\": \"lt\",\n            \"value\": 10000,\n            \"window\": \"30d\",\n            \"filters\": {\n                \"direction\": \"INBOUND\",\n                \"transaction_type\": \"finance\",\n                \"subject_vendor_data\": \"__current__\",\n                \"currency\": \"EUR\"\n            }\n        }\n    ],\n    \"evaluation_mode\": \"ALL\",\n    \"scope\": {\n        \"transaction_types\": [\n            \"finance\"\n        ],\n        \"directions\": [\n            \"INBOUND\"\n        ]\n    },\n    \"period_days\": 90\n},\n    timeout=30,\n)\nresp.raise_for_status()\nstats = resp.json()\nprint(stats['matched'], 'matches across', stats['affected_entities'], 'subjects')"
