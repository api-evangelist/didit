openapi: 3.2.0
info:
  version: 3.0.0
  title: Didit Verification Transactions API
  description: Identity verification API. Authenticate with x-api-key header.
servers:
- url: https://verification.didit.me
tags:
- name: Transactions
paths:
  /v3/wallet-screening/:
    post:
      summary: Screen a wallet address
      description: Run on-demand AML screening for a single crypto wallet/address without creating a transaction. Resolves your application's configured blockchain analytics provider, screens the address synchronously, and returns the normalised risk result. LIGHTNING is available only with an Elliptic or Chainalysis BYOK connection added through Marketplace. Nothing is written to the transactions table. One AML monitoring usage is billed per successful screening (sandbox applications are not billed).
      operationId: screenWallet
      tags:
      - Transactions
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - wallet_address
              - blockchain
              properties:
                wallet_address:
                  type: string
                  description: 'The crypto address or network identifier to screen. Must match the selected network (e.g. a `0x`-prefixed 40-hex-char address for EVM chains). Alias: `address`.'
                  example: '0x94f1b9b64e2932f6a2db338f616844400cd58e8a'
                blockchain:
                  type: string
                  description: 'Network identifier. Managed screening supports BTC, ETH, LTC, XRP, BCH, DOGE, TRX, SOL, MATIC, BNB, BASE (Base), OP (Optimism), and ARB (Arbitrum One). USDT and USDC are legacy Ethereum aliases, not multi-network searches. Connected-provider coverage varies. LIGHTNING requires a supported connected provider. Celo, Mode and Plume are not currently supported. Alias: `currency`.'
                  enum:
                  - BTC
                  - LIGHTNING
                  - ETH
                  - LTC
                  - XRP
                  - BCH
                  - DOGE
                  - TRX
                  - SOL
                  - MATIC
                  - BNB
                  - USDT
                  - USDC
                  - BASE
                  - OP
                  - ARB
                  example: ETH
                direction:
                  type: string
                  description: Optional. Whether the address is being screened as an inbound (deposit) or outbound (withdrawal) counterparty. Accepts `inbound`, `outbound`, `deposit`, or `withdrawal`. Defaults to a neutral pre-transfer screen when omitted. This is passed to the provider as context only; it does not change the returned `risk_score`, `severity`, or the `source_of_funds`/`destination_of_funds` breakdowns, which are always both returned regardless of `direction`. Changing or omitting `direction` therefore does not require re-screening an address.
                  enum:
                  - inbound
                  - outbound
                  - deposit
                  - withdrawal
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X POST 'https://verification.didit.me/v3/wallet-screening/' \\\n  -H 'x-api-key: YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"wallet_address\": \"0x94f1b9b64e2932f6a2db338f616844400cd58e8a\",\n    \"blockchain\": \"ETH\"\n  }'"
      - lang: python
        label: Python
        source: "import os\n\nimport requests\n\nresp = requests.post(\n    'https://verification.didit.me/v3/wallet-screening/',\n    headers={'x-api-key': os.environ['DIDIT_API_KEY']},\n    json={\n        'wallet_address': '0x94f1b9b64e2932f6a2db338f616844400cd58e8a',\n        'blockchain': 'ETH',\n    },\n    timeout=20,\n)\nresp.raise_for_status()\nresult = resp.json()\nprint(result['risk_score'], result['severity'], result['sanctions_hit'])"
      - lang: javascript
        label: JavaScript
        source: "const result = await fetch('https://verification.didit.me/v3/wallet-screening/', {\n  method: 'POST',\n  headers: {\n    'x-api-key': process.env.DIDIT_API_KEY,\n    'Content-Type': 'application/json',\n  },\n  body: JSON.stringify({\n    wallet_address: '0x94f1b9b64e2932f6a2db338f616844400cd58e8a',\n    blockchain: 'ETH',\n  }),\n}).then((r) => r.json());\nconsole.log(result.risk_score, result.severity, result.sanctions_hit);"
      responses:
        '200':
          description: The normalised wallet screening result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletScreeningResult'
              example:
                provider: merklescience
                screening_type: WALLET_SCREENING
                risk_score: 95
                severity: CRITICAL
                status: SCREENED
                summary: 'Merkle Science risk: Critical (5/5). SANCTIONS HIT. Dominant risk: sanctioned. Driven by: the address is attributed to Sanctions / OFAC (Example Sanctions)'
                wallet_address: '0x94f1b9b64e2932f6a2db338f616844400cd58e8a'
                transaction_hash: null
                blockchain: ETH
                block_timestamp: null
                total_value_usd: null
                fee_usd: null
                sender_rows: []
                receiver_rows: []
                transaction_flows: []
                transaction_flows_status: null
                transaction_flows_error: null
                source_of_funds:
                - category: sanctioned
                  percentage: 100.0
                  amount_usd: 9813695.0
                  entity_name: Example Sanctions
                  entity_type: Sanctions
                  entity_subtype: OFAC
                  hops: null
                  description: Sanctions / OFAC
                  is_direct: true
                  exposure_direction: incoming
                  exposure_type: direct
                  provider_entity_id: '118885'
                  provider_entity_type_id: '30'
                  provider_entity_subtype_id: '125'
                  country: ''
                  raw_amount: null
                  raw_currency: null
                destination_of_funds:
                - category: defi
                  percentage: 84.824453
                  amount_usd: 7783414.38
                  entity_name: Example DeFi 7
                  entity_type: DeFi
                  entity_subtype: Bridges
                  hops: null
                  description: DeFi / Bridges
                  is_direct: false
                  exposure_direction: outgoing
                  exposure_type: indirect
                  provider_entity_id: '118459'
                  provider_entity_type_id: '33'
                  provider_entity_subtype_id: '143'
                  country: ''
                  raw_amount: null
                  raw_currency: null
                - category: defi
                  percentage: 15.175547
                  amount_usd: 1392494.37
                  entity_name: Example DeFi 2
                  entity_type: DeFi
                  entity_subtype: Yield Aggregator
                  hops: null
                  description: DeFi / Yield Aggregator
                  is_direct: false
                  exposure_direction: outgoing
                  exposure_type: indirect
                  provider_entity_id: '90192'
                  provider_entity_type_id: '33'
                  provider_entity_subtype_id: '142'
                  country: ''
                  raw_amount: null
                  raw_currency: null
                counterparty_connections:
                - entity_name: Example Sanctions
                  entity_type: Sanctions
                  entity_subtype: OFAC
                  risk_level: critical
                  categories:
                  - sanctioned
                  received_usd: null
                  sent_usd: null
                  received_hops: null
                  sent_hops: null
                  percentage: 0.0
                  is_direct: true
                  country: null
                  provider_entity_id: null
                - entity_name: Example Sanctions
                  entity_type: Sanctions
                  entity_subtype: OFAC
                  risk_level: critical
                  categories:
                  - sanctioned
                  received_usd: null
                  sent_usd: null
                  received_hops: null
                  sent_hops: null
                  percentage: 0.0
                  is_direct: true
                  country: null
                  provider_entity_id: null
                network_nodes: []
                network_edges: []
                sanctions_hit: true
                pep_counterparty: null
                dominant_risk_category: sanctioned
                risk_factors:
                - source: attribution
                  category: sanctioned
                  label: Sanctions / OFAC
                  entity_name: Example Sanctions
                  direction: attribution
                  exposure_type: attribution
                  amount_usd: null
                  percentage: 0.0
                  is_high_risk: true
                  description: the address is attributed to Sanctions / OFAC (Example Sanctions)
                - source: exposure
                  category: sanctioned
                  label: Sanctions / OFAC
                  entity_name: Example Sanctions
                  direction: incoming
                  exposure_type: direct
                  amount_usd: 9813695.0
                  percentage: 51.679304
                  is_high_risk: true
                  description: 51.6793% direct incoming exposure to Sanctions / OFAC (Example Sanctions)
                - source: exposure
                  category: defi
                  label: DeFi / Bridges
                  entity_name: Example DeFi 7
                  direction: outgoing
                  exposure_type: indirect
                  amount_usd: 7783414.38
                  percentage: 40.987766
                  is_high_risk: false
                  description: 40.9878% indirect outgoing exposure to DeFi / Bridges (Example DeFi 7)
                - source: exposure
                  category: defi
                  label: DeFi / Yield Aggregator
                  entity_name: Example DeFi 2
                  direction: outgoing
                  exposure_type: indirect
                  amount_usd: 1392494.37
                  percentage: 7.33293
                  is_high_risk: false
                  description: 7.33293% indirect outgoing exposure to DeFi / Yield Aggregator (Example DeFi 2)
                raw_response:
                  '...': provider-specific details
                report_signature: <hmac-sha256 over the result, scoped to your application>
        '400':
          description: Validation error — malformed wallet address, missing `wallet_address`, unsupported `blockchain`, or LIGHTNING without an Elliptic or Chainalysis BYOK Marketplace connection.
        '401':
          description: Missing or invalid `x-api-key`.
        '409':
          description: No AML provider is configured for the application, or the configured provider does not support wallet screening yet. Configure transaction monitoring first.
        '502':
          description: The AML provider could not complete the screening. Retry later.
  /v3/wallet-screening/pdf/:
    post:
      summary: Render a wallet-screening result as a PDF
      description: 'Stateless companion to `POST /v3/wallet-screening/`: repost the exact JSON body that endpoint returned — including the `report_signature` it added — and get back a Didit-branded PDF of the same result. No provider is called and nothing is billed or persisted; this only re-renders a result Didit already produced. The signature ties the PDF to an unmodified result: editing `risk_score`, `severity`, `sanctions_hit`, or any other signed field before reposting fails with `400`.'
      operationId: screenWalletPdf
      tags:
      - Transactions
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        description: The unmodified JSON object returned by `POST /v3/wallet-screening/`, including `report_signature`.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WalletScreeningResult'
              required:
              - report_signature
              description: Same shape as the `POST /v3/wallet-screening/` response — pass that response body back verbatim, including `report_signature`.
      x-codeSamples:
      - lang: curl
        label: curl
        source: "# $RESULT is the saved JSON body from POST /v3/wallet-screening/\ncurl -X POST 'https://verification.didit.me/v3/wallet-screening/pdf/' \\\n  -H 'x-api-key: YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d \"$RESULT\" \\\n  -o wallet_screening_report.pdf"
      - lang: python
        label: Python
        source: "import requests\n\n# `result` is the dict returned by POST /v3/wallet-screening/, unmodified\nresponse = requests.post(\n    'https://verification.didit.me/v3/wallet-screening/pdf/',\n    headers={'x-api-key': 'YOUR_API_KEY'},\n    json=result,\n    timeout=30,\n)\nresponse.raise_for_status()\nwith open('wallet_screening_report.pdf', 'wb') as fh:\n    fh.write(response.content)"
      - lang: javascript
        label: JavaScript
        source: "// `result` is the object returned by POST /v3/wallet-screening/, unmodified\nconst response = await fetch('https://verification.didit.me/v3/wallet-screening/pdf/', {\n  method: 'POST',\n  headers: {\n    'x-api-key': process.env.DIDIT_API_KEY,\n    'Content-Type': 'application/json',\n  },\n  body: JSON.stringify(result),\n});\nif (!response.ok) throw new Error(`PDF generation failed: HTTP ${response.status}`);\nconst pdfBuffer = Buffer.from(await response.arrayBuffer());"
      responses:
        '200':
          description: The rendered PDF document, returned directly as binary `application/pdf` — there is no JSON wrapper.
          headers:
            Content-Disposition:
              description: '`attachment; filename=wallet_screening_{address}.pdf`, derived from the `wallet_address` (or `transaction_hash`) in the reposted result.'
              schema:
                type: string
                example: attachment; filename=wallet_screening_0x28c6c06298d514db0899.pdf
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: The body is not a JSON object matching the wallet-screening result shape, or `report_signature` is missing or does not match the reposted fields (edited or truncated before repost).
          content:
            application/json:
              schema:
                type: object
              examples:
                Not an object:
                  value:
                    non_field_errors:
                    - Expected a JSON object matching a wallet-screening result.
                Missing or invalid signature:
                  value:
                    report_signature:
                    - This wallet-screening result is missing or fails its report signature - repost the exact JSON returned by the wallet-screening endpoint, unmodified.
        '401':
          description: Missing or invalid `x-api-key`.
  /v3/transactions/:
    get:
      summary: List transactions
      description: Paginated list of monitored transactions, newest first (`txn_date` desc). `count` is capped at 100; use `total_transactions` for the true row count. This endpoint does not support filtering or search parameters.
      operationId: listTransactions
      tags:
      - Transactions
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          minimum: 1
        description: Page size. Defaults to 50 when omitted. There is no enforced maximum, but keep pages small for latency.
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
        description: Zero-based offset of the first record to return. Prefer following the `next` URL from the previous page.
      - name: travel_rule_status
        in: query
        required: false
        schema:
          type: string
        description: Return only transactions whose Travel Rule transfer is in this exact status (for example `ON_HOLD` or `AWAITING_COUNTERPARTY`). `count` follows this filter; `total_transactions` still counts every transaction in the application.
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X GET 'https://verification.didit.me/v3/transactions/?limit=50' \\\n  -H 'x-api-key: YOUR_API_KEY'"
      - lang: python
        label: Python
        source: "import os\n\nimport requests\n\nresp = requests.get(\n    'https://verification.didit.me/v3/transactions/',\n    headers={'x-api-key': os.environ['DIDIT_API_KEY']},\n    params={'limit': 50},\n    timeout=10,\n)\nresp.raise_for_status()\npage = resp.json()\nfor tx in page['results']:\n    print(\n        tx['transaction_number'],\n        tx['status'],\n        tx['severity'],\n        f\"{tx['amount']} {tx['currency']}\",\n        tx.get('subject_name') or tx.get('subject_vendor_data'),\n    )"
      - lang: javascript
        label: JavaScript
        source: "const url = new URL('https://verification.didit.me/v3/transactions/');\nurl.searchParams.set('limit', '50');\nconst page = await fetch(url, {\n  headers: { 'x-api-key': process.env.DIDIT_API_KEY },\n}).then((r) => r.json());\nfor (const tx of page.results) {\n  console.log(tx.transaction_number, tx.status, tx.severity, tx.amount, tx.currency);\n}"
      responses:
        '200':
          description: Paginated list of transaction summaries, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Capped count of matching transactions (exact up to 100, capped thereafter). Use `total_transactions` for the true count when paginating.
                  next:
                    type:
                    - string
                    - 'null'
                    description: Absolute URL of the next page, or `null` on the last page.
                  previous:
                    type:
                    - string
                    - 'null'
                    description: Absolute URL of the previous page, or `null` on the first page.
                  total_transactions:
                    type: integer
                    description: Exact total count of (non-deleted) transactions for the application. Present on paginated responses.
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          format: uuid
                          description: Stable Didit transaction identifier. Use as `{transaction_id}` in detail/notes/related calls.
                        transaction_number:
                          type: integer
                          description: Application-scoped sequential transaction number shown in Console (e.g. `4123`).
                        txn_id:
                          type: string
                          description: Customer-provided identifier from the create call (max 128 chars). Unique per application.
                        transaction_type:
                          type: string
                          description: 'Top-level category as stored: `finance`, `kyc`, `travelRule`, `userPlatformEvent`, `gamblingBet`, `gamblingLimitChange`, `gamblingBonusChange`, `auditTrailEvent`. Note multi-word values are echoed back in camelCase even when submitted in snake_case.'
                        action_type:
                          type: string
                          description: Sub-type within the category (e.g. `deposit`, `withdrawal`, `transfer`).
                        status:
                          type: string
                          enum:
                          - APPROVED
                          - IN_REVIEW
                          - DECLINED
                          - AWAITING_USER
                          description: Current monitoring verdict.
                        direction:
                          type: string
                          enum:
                          - INBOUND
                          - OUTBOUND
                          description: Direction relative to the subject. Stored uppercase regardless of the casing submitted.
                        amount:
                          type: string
                          description: Transaction amount as a decimal string with trailing zeros stripped (e.g. `"1500"`, `"0.5"`, `"0.123456789012345678"`). Up to 18 decimal places.
                        currency:
                          type: string
                          description: 'Currency code of `amount`. Any ISO 4217 alphabetic code is accepted (e.g. `EUR`, `USD`, `NGN`), as is a crypto asset symbol (e.g. `BTC`). Prefer a currently-circulating code. Not every accepted code has an exchange rate: when none is available for the code (for example the ISO accounting unit `XSU`, or a crypto symbol Didit does not price), automatic conversion fails and `preferred_currency_amount` is returned null unless the request supplied a pre-converted `amount_in_default_currency`.'
                        preferred_currency_amount:
                          type:
                          - string
                          - 'null'
                          description: '`amount` converted to the application''s preferred currency, when available.'
                        preferred_currency_code:
                          type:
                          - string
                          - 'null'
                          description: Preferred currency code used for `preferred_currency_amount` - the application's base currency, any currently-circulating ISO 4217 code. A code with no available exchange rate leaves `preferred_currency_amount` null unless the request supplied a pre-converted `amount_in_default_currency`.
                        payment_details:
                          type:
                          - string
                          - 'null'
                          description: Free-text payment reference or memo from the submission.
                        score:
                          type: integer
                          description: Risk score (typically 0–100). Higher = riskier.
                        severity:
                          type:
                          - string
                          - 'null'
                          enum:
                          - UNKNOWN
                          - LOW
                          - MEDIUM
                          - HIGH
                          - CRITICAL
                          description: Categorical risk severity set by rules/providers (`UNKNOWN`, `LOW`, `MEDIUM`, `HIGH`, `CRITICAL`). `null` until something sets it.
                        subject_name:
                          type:
                          - string
                          - 'null'
                          description: Full name of the `APPLICANT` party.
                        subject_vendor_data:
                          type:
                          - string
                          - 'null'
                          description: Your internal user/business identifier for the applicant.
                        subject_country:
                          type:
                          - string
                          - 'null'
                          description: Country code of the applicant, from the submitted `address.country` (typically ISO 3166-1 alpha-3).
                        counterparty_name:
                          type:
                          - string
                          - 'null'
                          description: Full name of the `COUNTERPARTY` party, if any.
                        counterparty_vendor_data:
                          type:
                          - string
                          - 'null'
                          description: Your internal identifier for the counterparty.
                        counterparty_country:
                          type:
                          - string
                          - 'null'
                          description: Country code of the counterparty, from the submitted `address.country`.
                        tags:
                          type: array
                          description: Tags attached to the transaction (manually or by rules).
                          items:
                            type: object
                            properties:
                              uuid:
                                type: string
                                format: uuid
                              name:
                                type: string
                              color:
                                type: string
                              description:
                                type:
                                - string
                                - 'null'
                              source:
                                type: string
                                enum:
                                - didit
                                - custom
                                description: Whether the tag is a Didit preset or a custom tag.
                        txn_date:
                          type: string
                          format: date-time
                          description: When the transaction occurred (from `transaction_at` at create time).
                        created_at:
                          type: string
                          format: date-time
                          description: When Didit recorded the submission.
                        decision_reason_code:
                          type:
                          - string
                          - 'null'
                          description: Machine-readable reason for the current `status` (e.g. `WALLET_HIGH_RISK`).
                        decision_reason_label:
                          type:
                          - string
                          - 'null'
                          description: Human-readable label for `decision_reason_code`.
                        assigned_to_name:
                          type:
                          - string
                          - 'null'
                          description: Display name of the Console reviewer assigned to this transaction.
                        travel_rule_status:
                          type:
                          - string
                          - 'null'
                          description: Status of the transaction's Travel Rule transfer (for example `COMPLETED`), or `null` when it has none.
              examples:
                Single transaction:
                  value:
                    count: 1
                    next: null
                    previous: null
                    total_transactions: 1
                    results:
                    - uuid: abcdef12-3456-4890-abcd-ef1234567890
                      transaction_number: 4123
                      txn_id: your-txn-2026-05-17-001
                      transaction_type: finance
                      action_type: withdrawal
                      status: IN_REVIEW
                      direction: OUTBOUND
                      amount: '1500'
                      currency: EUR
                      preferred_currency_amount: '1620.45'
                      preferred_currency_code: USD
                      payment_details: Withdrawal to crypto wallet
                      txn_date: '2026-05-17T08:42:00Z'
                      created_at: '2026-05-17T08:42:11Z'
                      score: 78
                      severity: HIGH
                      decision_reason_code: WALLET_HIGH_RISK
                      decision_reason_label: Destination wallet flagged as high risk
                      tags:
                      - uuid: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                        name: Manual review
                        color: '#F59E0B'
                        description: null
                        source: custom
                      subject_name: Maria Garcia
                      subject_vendor_data: user-12345
                      counterparty_name: null
                      counterparty_vendor_data: null
                      counterparty_country: null
                      subject_country: null
                      assigned_to_name: Alex Reviewer
        '403':
          description: Missing, invalid, or revoked API key, or the key cannot list transactions for this application. This endpoint returns `403` (never `401`) for authentication failures, including requests with no credentials at all.
          content:
            application/json:
              examples:
                Forbidden:
                  value:
                    detail: You do not have permission to perform this action.
        '429':
          description: Rate limit exceeded; back off and retry after the interval indicated in `Retry-After`.
          content:
            application/json:
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 30 seconds.
      security:
      - ApiKeyAuth: []
    post:
      summary: Create transaction
      description: Submit a transaction for synchronous AML/risk monitoring. The transaction is created `APPROVED`, then your rules (and crypto screening, when applicable) run inline and may flip the returned `status` to `IN_REVIEW` or `DECLINED`. **`transaction_id` is your idempotency key** (max 128 chars, unique per app); reusing it returns 400. A `transaction.created` webhook is dispatched on success (sandbox applications are not billed and do not emit webhooks).
      operationId: createTransaction
      tags:
      - Transactions
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X POST 'https://verification.didit.me/v3/transactions/' \\\n  -H 'x-api-key: YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"transaction_id\": \"your-txn-2026-05-17-001\",\n    \"transaction_category\": \"finance\",\n    \"transaction_details\": {\n      \"direction\": \"outbound\",\n      \"amount\": 1500,\n      \"currency\": \"EUR\",\n      \"action_type\": \"withdrawal\"\n    },\n    \"subject\": {\n      \"entity_type\": \"individual\",\n      \"vendor_data\": \"user-12345\",\n      \"full_name\": \"Maria Garcia\"\n    }\n  }'"
      - lang: python
        label: Python
        source: "import os\n\nimport requests\n\nresp = requests.post(\n    'https://verification.didit.me/v3/transactions/',\n    headers={\n        'x-api-key': os.environ['DIDIT_API_KEY'],\n        'Content-Type': 'application/json',\n    },\n    json={\n        'transaction_id': 'your-txn-2026-05-17-001',\n        'transaction_category': 'finance',\n        'transaction_details': {\n            'direction': 'outbound',\n            'amount': 1500,\n            'currency': 'EUR',\n            'action_type': 'withdrawal',\n        },\n        'subject': {\n            'entity_type': 'individual',\n            'vendor_data': 'user-12345',\n            'full_name': 'Maria Garcia',\n        },\n    },\n    timeout=15,\n)\nresp.raise_for_status()\ntx = resp.json()\nprint(tx['txn_id'], '->', tx['status'], tx['severity'])"
      - lang: javascript
        label: JavaScript
        source: "const resp = await fetch('https://verification.didit.me/v3/transactions/', {\n  method: 'POST',\n  headers: {\n    'x-api-key': process.env.DIDIT_API_KEY,\n    'Content-Type': 'application/json',\n  },\n  body: JSON.stringify({\n    transaction_id: 'your-txn-2026-05-17-001',\n    transaction_category: 'finance',\n    transaction_details: {\n      direction: 'outbound',\n      amount: 1500,\n      currency: 'EUR',\n      action_type: 'withdrawal',\n    },\n    subject: {\n      entity_type: 'individual',\n      vendor_data: 'user-12345',\n      full_name: 'Maria Garcia',\n    },\n  }),\n});\nif (!resp.ok) throw new Error(await resp.text());\nconst tx = await resp.json();\nconsole.log(tx.txn_id, tx.status, tx.severity);"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction_id:
                  type: string
                  description: Your unique identifier for this transaction (max 128 characters).
                  example: your-txn-2026-05-17-001
                transaction_at:
                  type: string
                  format: date-time
                  description: When the transaction occurred. Defaults to now if omitted.
                time_zone:
                  type: string
                  description: IANA time zone identifier, e.g. `Europe/Madrid`.
                transaction_category:
                  type: string
                  description: Category of the transaction. CamelCase aliases (`travelRule`, `userPlatformEvent`, `gamblingBet`, …) are also accepted; the stored/echoed value is camelCase for multi-word categories.
                  example: finance
                  enum:
                  - finance
                  - kyc
                  - travel_rule
                  - user_event
                  - audit_trail_event
                  - gambling_bet
                  - gambling_limit_change
                  - gambling_bonus_change
                  - travelRule
                transaction_details:
                  type: object
                  description: Core financial details of the transaction.
                  required:
                  - direction
                  - amount
                  - currency
                  properties:
                    direction:
                      type: string
                      description: Direction of the transaction relative to the subject. Case-insensitive; `in`/`out` are accepted as aliases. Echoed back uppercase (`INBOUND`/`OUTBOUND`).
                      example: outbound
                      enum:
                      - inbound
                      - outbound
                      - in
                      - out
                    amount:
                      type: number
                      description: 'Transaction amount (up to 18 decimal places). Send it as a decimal string (e.g. `"0.123456789012345678"`) when exact precision matters: a JSON number is parsed as a binary float first, so digits beyond about 15 significant digits are rounded before the amount is stored.'
                      example: 1500
                    currency:
                      type: string
                      description: 'Currency code. Any ISO 4217 alphabetic code is accepted (e.g. `EUR`, `USD`, `NGN`), as is a crypto asset symbol (e.g. `BTC`). Prefer a currently-circulating code. Not every accepted code has an exchange rate: when none is available for the code (for example the ISO accounting unit `XSU`, or a crypto symbol Didit does not price), automatic conversion fails and `preferred_currency_amount` is returned null unless the request supplied a pre-converted `amount_in_default_currency`.'
                      example: EUR
                    currency_kind:
                      type: string
                      description: Whether the currency is `fiat` or `crypto`.
                    amount_in_default_currency:
                      type:
                      - number
                      - 'null'
                      description: Pre-converted amount in the default currency. If omitted, automatic FX conversion is attempted.
                    default_currency:
                      type: string
                      description: The default currency code for the converted amount. Any currently-circulating ISO 4217 code.
                    payment_details:
                      type:
                      - string
                      - 'null'
                      description: Free-text payment reference or memo.
                    payment_reference_id:
                      type:
                      - string
                      - 'null'
                      description: External payment system reference. For crypto AML transaction-hash screening, send the blockchain transaction hash and also provide `subject.payment_method.account_id` with the related address.
                    action_type:
                      type:
                      - string
                      - 'null'
                      description: Sub-type of the transaction, e.g. `deposit`, `withdrawal`, `transfer`.
                    crypto_params:
                      type: object
                      description: Crypto network selection, separate from currency (the asset symbol). Recording a custom token symbol does not guarantee transaction-hash coverage for its contract.
                      properties:
                        crypto_chain:
                          type: string
                          description: Actual network used for screening. Managed screening supports BTC, ETH, LTC, XRP, BCH, DOGE, TRX, SOL, MATIC, BNB, BASE (Base), OP (Optimism) and ARB (Arbitrum One). Always specify this for multi-network tokens. Connected-provider coverage varies; LIGHTNING requires a supported connected provider.
                          example: BASE
                subject:
                  type: object
                  description: The subject (applicant) of the transaction.
                  required:
                  - vendor_data
                  - full_name
                  properties:
                    entity_type:
                      type: string
                      description: 'Entity type: `individual` or `company`.'
                    vendor_data:
                      type: string
                      description: Your internal user/business identifier.
                      example: user-12345
                    full_name:
                      type: string
                      description: Full name of the subject.
                      example: Maria Garcia
                    first_name:
                      type: string
                      description: First name of the subject.
                    last_name:
                      type: string
                      description: Last name of the subject.
                    date_of_birth:
                      type: string
                      format: date
                      description: Date of birth (YYYY-MM-DD).
                    address:
                      type: object
                      description: Address object.
                      properties:
                        country:
                          type: string
                          description: Country code (ISO 3166-1 alpha-3 recommended). Copied to the party's `country_code`.
                        town:
                          type: string
                        state:
                          type: string
                        street:
                          type: string
                        post_code:
                          type: string
                    institution_details:
                      type: object
                      description: Institution details (for institutional subjects).
                      properties:
                        name:
                          type: string
                        code:
                          type: string
                        address:
                          type: object
                    device_context:
                      type: object
                      description: Device context captured at transaction time. browser_family and platform must be sent as explicit top-level keys — they are not derived from user_agent. The camelCase alias device is also accepted on the request.
                      properties:
                        fingerprint:
                          type: string
                          description: Unique device fingerprint.
                        persistent_device_id:
                          type: string
                          description: Stable cross-session device identifier (v2 fingerprint schema).
                        user_agent:
                          type: string
                          description: 'Browser or app user agent string. CamelCase alias: userAgent.'
                        browser_family:
                          type: string
                          description: 'Browser family (e.g. Chrome, Firefox, Safari). Must be sent explicitly — it is not derived from user_agent. CamelCase alias: browserFamily.'
                        browser_version:
                          type: string
                          description: 'Browser version string. Must be sent explicitly. CamelCase alias: browserVersion.'
                        platform:
                          type: string
                          description: Platform identifier (web, ios, android, macos, windows, linux). Must be sent explicitly — it is not derived from user_agent.
                        os_family:
                          type: string
                          description: 'Operating system family (e.g. iOS, Android, Windows). CamelCase alias: osFamily.'
                        os_version:
                          type: string
                          description: 'Operating system version string. CamelCase alias: osVersion.'
                        accept_language:
                          type: string
                          description: 'Accept-Language header value. CamelCase alias: acceptLang.'
                        session_id:
                          type: string
                          description: 'Session identifier of the user current session. Stored in metadata. CamelCase alias: sessionId.'
                        session_age_ms:
                          type: number
                          description: 'Age of the user session in milliseconds at transaction time. CamelCase alias: sessionAgeMs.'
                        network_context:
                          type: object
                          description: Network context with IP address and geo-location. A top-level ipInfo block is also folded into this object.
                          properties:
                            ip_address:
                              type: string
                              description: 'Client IP address. CamelCase alias: ip.'
                            ip_country_code:
                              type: string
                              description: 'Geo-resolved country of the IP (ISO 3166-1 alpha-3). CamelCase alias: countryCode3.'
                            latitude:
                              type: number
                              description: 'Geographic latitude of the IP. CamelCase alias: lat.'
                            longitude:
                              type: number
                              description: 'Geographic longitude of the IP. CamelCase alias: lon.'
                    payment_method:
                      type: object
                      description: Payment method used by the subject.
                      properties:
                        method_type:
                          type: string
                          description: 'Type of payment method: `bank_card`, `bank_account`, `crypto_wallet`, `ewallet`, `unhosted_wallet`, `other`.'
                        account_id:
                          type: string
                          description: Account identifier (e.g. IBAN, wallet address). For crypto screening, this should contain the wallet address for this participant. Inbound transaction-hash screening requires the service/customer deposit address on the subject. Outbound screening uses the destination wallet on the counterparty.
                        issuing_country:
                          type: string
                          description: ISO 3166-1 alpha-3 country code of the issuer.
                counterparty:
                  type: object
                  description: The counterparty of the transaction (optional).
                  properties:
                    entity_type:
                      type: string
                      description: 'Entity type: `individual` or `company`.'
                    vendor_data:
                      type: string
                      description: Your internal identifier for the counterparty.
                    full_name:
                      type: string
                      description: Full name of the counterparty.
                    first_name:
                      type: string
                    last_name:
                      type: string
                    date_of_birth:
                      type: string
                      format: date
                    address:
                      type: object
                      description: Address object with `country` (ISO 3166-1 alpha-3).
                    institution_details:
                      type: object
                    device_context:
                      type: object
                      description: Device context for the counterparty. browser_family and platform must be sent as explicit top-level keys — they are not derived from user_agent.
                      properties:
                        fingerprint:
                          type: string
                          description: Unique device fingerprint.
                        persistent_device_id:
                          type: string
                          description: Stable cross-session device identifier (v2 fingerprint schema).
                        user_agent:
                          type: string
                          description: 'Browser or app user agent string. CamelCase alias: userAgent.'
                        browser_family:
                          type: string
                          description: 'Browser family (e.g. Chrome, Firefox, Safari). Must be sent explicitly — it is not derived from user_agent. CamelCase alias: browserFamily.'
                        browser_version:
                          type: string
                          description: 'Browser version string. Must be sent explicitly. CamelCase alias: browserVersion.'
                        platform:
                          type: string
                          description: Platform identifier (web, ios, android, macos, windows, linux). Must be sent explicitly — it is not derived from user_agent.
                        os_family:
                          type: string
                          description: 'Operating system family (e.g. iOS, Android, Windows). CamelCase alias: osFamily.'
                        os_version:
                          type: string
                          description: 'Operating system version string. CamelCase alias: osVersion.'
                        accept_language:
                          type: string
                          description: 'Accept-Language header value. CamelCase alias: acceptLang.'
                        session_id:
                          type: string
                          description: 'Session identifier for the counterparty session. Stored in metadata. CamelCase alias: sessionId.'
                        session_age_ms:
                          type: number
                          description: 'Age of the user session in milliseconds at transaction time. CamelCase alias: sessionAgeMs.'
                        network_context:
                          type: object
                          description: Network context with IP address and geo-location. A top-level ipInfo block is also folded into this object.
                          properties:
                            ip_address:
                              type: string
                              description: 'Client IP address. CamelCase alias: ip.'
                            ip_country_code:
                              type: string
                              description: 'Geo-resolved country of the IP (ISO 3166-1 alpha-3). CamelCase alias: countryCode3.'
                            latitude:
                              type: number
                              description: 'Geographic latitude of the IP. CamelCase alias: lat.'
                            longitude:
                              type: number
                              description: 'Geographic longitude of the IP. CamelCase alias: lon.'
                    payment_method:
                      type: object
                      description: 'Payment method used by the counterparty. On travelRule transactions, `method_type: "unhosted_wallet"` declares the counterparty wallet as self-hosted: the transfer skips counterparty-VASP routing, is created directly in `UNCONFIRMED_OWNERSHIP`, and (when `auto_wallet_verification` is enabled) a wallet-ownership widget session is auto-minted and returned in the transaction''s `action_required` block.'
                      properties:
                        method_type:
                          type: string
                          description: 'Type of payment method: `bank_card`, `bank_account`, `crypto_wallet`, `ewallet`, `unhosted_wallet`, `other`. Use `unhosted_wallet` to declare a self-hosted wallet for the Travel Rule.'
                        account_id:
                          type: string
                          description: Account identifier (e.g. IBAN or wallet address).
                        issuing_country:
                          type: string
                custom_properties:
                  type: object
                  description: Arbitrary key-value pairs attached to the transaction. Each key can be referenced in rule conditions with the field path `custom_values.<key>`.
                  additionalProperties: true
                  example:
                    merchant_id: test
                    bank_name: test_2
                travel_rule_details:
                  type: object
                  description: 'Travel Rule compliance metadata. When Travel Rule is enabled and transaction_category is travel_rule, Didit runs the exchange itself: it ignores status, protocol, required and obligations_count, and uses originator_data, beneficiary_data and metadata. Otherwise Didit stores these values as a passive Travel Rule record.'
                  required:
