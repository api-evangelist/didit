  /v3/transactions/sdk-token/:
    post:
      summary: Mint an SDK transaction token
      description: 'Mint a short-lived scoped token your app passes to the Didit SDKs so they can submit transactions directly from the end-user''s device via `POST /v1/transactions/`. The token is bound to one `vendor_data` (your user id): every transaction submitted with it has its subject identity enforced server-side from that binding, so a tampered client cannot submit on behalf of another user. Mint tokens from your backend - never ship the API key itself in an app. camelCase aliases (`vendorData`, `ttlSeconds`, `maxUses`) are also accepted.'
      operationId: createTransactionSdkToken
      tags:
      - Transactions
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vendor_data:
                  type: string
                  description: Your internal identifier for the end user this token is scoped to. Enforced as the subject identity of every transaction submitted with the token.
                  example: user-042
                ttl_seconds:
                  type: integer
                  default: 900
                  maximum: 86400
                  description: Token lifetime in seconds. Defaults to 900 (15 minutes); maximum 86400 (24 hours).
                max_uses:
                  type:
                  - integer
                  - 'null'
                  description: Maximum number of successful submissions allowed with this token. Omit or null for unlimited uses within the TTL.
              required:
              - vendor_data
            example:
              vendor_data: user-042
              ttl_seconds: 900
              max_uses: 3
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X POST https://verification.didit.me/v3/transactions/sdk-token/ \\\n  -H 'x-api-key: YOUR_API_KEY' -H 'Content-Type: application/json' \\\n  -d '{\"vendor_data\": \"user-042\", \"ttl_seconds\": 900, \"max_uses\": 3}'"
      - lang: python
        label: Python
        source: "import os\n\nimport requests\n\nresp = requests.post(\n    'https://verification.didit.me/v3/transactions/sdk-token/',\n    headers={'x-api-key': os.environ['DIDIT_API_KEY']},\n    json={'vendor_data': 'user-042', 'ttl_seconds': 900, 'max_uses': 3},\n    timeout=10,\n)\nresp.raise_for_status()\ntoken = resp.json()\nprint(token['sdk_token'], token['expires_at'])"
      responses:
        '201':
          description: The minted token. Hand `sdk_token` to your app; it authenticates the device-facing `/v1/transactions/` endpoints via the `X-Transaction-Token` header until `expires_at`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sdk_token:
                    type: string
                    description: The scoped transaction token to pass to the SDK.
                  expires_at:
                    type: string
                    format: date-time
                    description: When the token stops being accepted.
              example:
                sdk_token: q7Zt...urlsafe
                expires_at: '2026-07-07T12:15:00Z'
        '400':
          description: 'Validation failed: missing `vendor_data`, or `ttl_seconds` outside the allowed range.'
          content:
            application/json:
              examples:
                Missing vendor_data:
                  value:
                    vendor_data:
                    - This field is required.
        '403':
          description: Missing, invalid, or revoked API key.
          content:
            application/json:
              examples:
                Invalid API Key:
                  value:
                    detail: Invalid API Key.
  /v1/transactions/:
    post:
      summary: Submit a transaction from an SDK
      description: 'Device-facing endpoint the Didit SDKs call to submit a transaction directly from the end-user''s device. Authentication is a scoped token from `POST /v3/transactions/sdk-token/` sent in the `X-Transaction-Token` header instead of an API key, and the endpoint is CORS-enabled so browsers can call it cross-origin. The payload uses the camelCase wire aliases shown below (the SDK `submitTransaction` methods build it for you). Three server-side guarantees: the application is always taken from the token; the subject identity (`externalUserId`) is always enforced from the token''s `vendor_data`, so spoofed payload values are ignored; and device intelligence (the SDK device fingerprint plus server-derived IP and user agent) is attached to the subject automatically.'
      operationId: submitTransactionFromSdk
      tags:
      - Transactions
      security:
      - TransactionTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                txnId:
                  type: string
                  description: Your unique identifier for this transaction (maps to `transaction_id`, max 128 characters).
                  example: wd-2026-07-07-0042
                txnDate:
                  type: string
                  format: date-time
                  description: When the transaction occurred (maps to `transaction_at`). Defaults to now if omitted.
                zoneId:
                  type: string
                  description: IANA time zone identifier (maps to `time_zone`), e.g. `Europe/Madrid`.
                type:
                  type: string
                  description: Transaction category (maps to `transaction_category`), e.g. `finance`, `kyc`, `travelRule`, `userPlatformEvent`, `gamblingBet`.
                  example: travelRule
                info:
                  type: object
                  description: Core financial details of the transaction (maps to `transaction_details`).
                  required:
                  - direction
                  - amount
                  - currency
                  properties:
                    direction:
                      type: string
                      description: Direction relative to the subject. Case-insensitive; `in`/`out` are accepted as aliases. Echoed back uppercase (`INBOUND`/`OUTBOUND`).
                      example: out
                    amount:
                      type: number
                      description: 'Transaction amount (up to 18 decimal places). A decimal string is also accepted and is the only way to preserve more than about 15 significant digits: a JSON number is parsed as a binary float first, so `0.123456789012345678` is stored as `0.12345678901234568`.'
                      example: 0.25
                    currency:
                      type: string
                      description: 'Currency code. Any ISO 4217 alphabetic code is accepted (e.g. `EUR`, `USD`, `NGN`), as is a crypto asset symbol (e.g. `BTC`). Prefer a currently-circulating code. Not every accepted code has an exchange rate: when none is available for the code (for example the ISO accounting unit `XSU`, or a crypto symbol Didit does not price), automatic conversion fails and `preferred_currency_amount` is returned null unless the request supplied a pre-converted `amountInDefaultCurrency`.'
                      example: ETH
                    currencyType:
                      type: string
                      description: Whether the currency is `fiat` or `crypto` (maps to `currency_kind`).
                    amountInDefaultCurrency:
                      type:
                      - number
                      - 'null'
                      description: Pre-converted amount in the default currency (maps to `amount_in_default_currency`). If omitted, automatic FX conversion is attempted.
                    defaultCurrencyCode:
                      type: string
                      description: The default currency code for the converted amount (maps to `default_currency`). Any currently-circulating ISO 4217 code.
                    paymentDetails:
                      type:
                      - string
                      - 'null'
                      description: Free-text payment reference or memo (maps to `payment_details`).
                    paymentTxnId:
                      type:
                      - string
                      - 'null'
                      description: External payment reference (maps to `payment_reference_id`); the on-chain transaction hash for crypto transactions.
                    type:
                      type:
                      - string
                      - 'null'
                      description: Sub-type of the transaction (maps to `action_type`), e.g. `deposit`, `withdrawal`, `transfer`.
                    cryptoParams:
                      type: object
                      description: 'Crypto-specific parameters, e.g. `{"crypto_chain": "ETH"}`.'
                subject:
                  type: object
                  description: 'The subject (applicant) of the transaction. `externalUserId` is ignored here: the subject identity is always enforced from the token''s `vendor_data`.'
                  required:
                  - fullName
                  properties:
                    type:
                      type: string
                      description: 'Entity type (maps to `entity_type`): `individual` (default) or `company`.'
                    externalUserId:
                      type: string
                      description: Ignored on the subject - enforced server-side from the token's `vendor_data`.
                    fullName:
                      type: string
                      example: Jane Doe
                    firstName:
                      type: string
                    lastName:
                      type: string
                    dob:
                      type: string
                      format: date
                      description: Date of birth (YYYY-MM-DD; maps to `date_of_birth`).
                    address:
                      type: object
                      description: Address object with `country` (ISO 3166-1 alpha-3), `town`, `state`, `street`, `post_code`.
                    institutionInfo:
                      type: object
                      description: Institution details for institutional participants (maps to `institution_details`).
                    device:
                      type: object
                      description: Optional explicit device context. Merged with the automatically captured device intelligence; server-derived fields win on conflict.
                    paymentMethod:
                      type: object
                      description: Payment method used by the subject (maps to `payment_method`).
                      properties:
                        type:
                          type: string
                          description: Payment method kind (maps to `method_type`), e.g. `bank_card`, `bank_account`, `crypto_wallet`, `ewallet`, `unhosted_wallet`, `other`.
                        accountId:
                          type: string
                          description: 'Account identifier (maps to `account_id`): IBAN, card fingerprint, or wallet address.'
                        issuingCountry:
                          type: string
                          description: ISO 3166-1 alpha-3 country code of the issuer (maps to `issuing_country`).
                counterparty:
                  type: object
                  description: The counterparty of the transaction (optional). Same shape as `subject`; `externalUserId` is meaningful here.
                  properties:
                    type:
                      type: string
                      description: 'Entity type (maps to `entity_type`): `individual` or `company`.'
                    externalUserId:
                      type: string
                      description: Your internal identifier for the counterparty (maps to `vendor_data`).
                    fullName:
                      type: string
                    firstName:
                      type: string
                    lastName:
                      type: string
                    dob:
                      type: string
                      format: date
                    address:
                      type: object
                    institutionInfo:
                      type: object
                    device:
                      type: object
                    paymentMethod:
                      type: object
                      description: 'Payment method used by the counterparty (maps to `payment_method`). On travelRule transactions, `type: "unhosted_wallet"` declares the counterparty wallet as self-hosted: the transfer skips counterparty-VASP routing, is created directly in `UNCONFIRMED_OWNERSHIP`, and (when `auto_wallet_verification` is enabled) a wallet-ownership widget session is auto-minted and returned in `action_required` so the SDK can launch it.'
                      properties:
                        type:
                          type: string
                          description: Payment method kind (maps to `method_type`), e.g. `bank_card`, `bank_account`, `crypto_wallet`, `ewallet`, `unhosted_wallet`, `other`. Use `unhosted_wallet` to declare a self-hosted wallet for the Travel Rule.
                        accountId:
                          type: string
                          description: 'Account identifier (maps to `account_id`): IBAN, card fingerprint, or wallet address.'
                        issuingCountry:
                          type: string
                props:
                  type: object
                  additionalProperties: true
                  description: Custom key-value pairs (maps to `custom_properties`). Each key can be referenced in rule conditions as `custom_values.<key>`.
                travelRule:
                  type: object
                  description: Travel Rule details (maps to `travel_rule_details`). When Travel Rule is enabled for the application, Didit ignores any `status` you send and drives the exchange itself.
                  required:
                  - status
                  properties:
                    status:
                      type: string
                    protocol:
                      type: string
                    required:
                      type: boolean
                    obligationsCount:
                      type: integer
                    originatorData:
                      type: object
                    beneficiaryData:
                      type: object
                    metadata:
                      type: object
                includeCryptoScreening:
                  type:
                  - boolean
                  - 'null'
                  description: Per-transaction override for crypto blockchain analytics screening (maps to `include_crypto_screening`).
                fingerprint_v2:
                  type: object
                  description: The `didit-fp-v2` device fingerprint payload. Injected automatically by the SDKs; only relevant when calling the wire API directly.
              required:
              - txnId
              - type
              - info
              - subject
            example:
              txnId: wd-2026-07-07-0042
              type: travelRule
              info:
                direction: out
                amount: '0.25'
                currency: ETH
                currencyType: crypto
                cryptoParams:
                  crypto_chain: ETH
              subject:
                fullName: Jane Doe
              counterparty:
                fullName: Ana Diaz
                paymentMethod:
                  type: unhosted_wallet
                  accountId: 0xBeneficiaryWallet01
              travelRule:
                status: AWAITING_COUNTERPARTY
                beneficiaryData:
                  wallet_address: 0xBeneficiaryWallet01
                  name: Ana Diaz
              includeCryptoScreening: true
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X POST https://verification.didit.me/v1/transactions/ \\\n  -H 'X-Transaction-Token: SDK_TOKEN' -H 'Content-Type: application/json' \\\n  -d '{\"txnId\": \"wd-2026-07-07-0042\", \"type\": \"travelRule\", \"info\": {\"direction\": \"out\", \"amount\": \"0.25\", \"currency\": \"ETH\", \"currencyType\": \"crypto\"}, \"subject\": {\"fullName\": \"Jane Doe\"}, \"counterparty\": {\"fullName\": \"Ana Diaz\", \"paymentMethod\": {\"type\": \"unhosted_wallet\", \"accountId\": \"0xBeneficiaryWallet01\"}}, \"travelRule\": {\"status\": \"AWAITING_COUNTERPARTY\", \"beneficiaryData\": {\"wallet_address\": \"0xBeneficiaryWallet01\", \"name\": \"Ana Diaz\"}}, \"includeCryptoScreening\": true}'"
      - lang: javascript
        label: Web SDK
        source: "import { DiditSdk } from '@didit-protocol/sdk-web';\n\nconst result = await DiditSdk.shared.submitTransaction({\n  transactionToken: sdkToken,\n  transaction: {\n    txnId: 'wd-2026-07-07-0042',\n    category: 'travelRule',\n    details: { direction: 'out', amount: '0.25', currency: 'ETH', currencyType: 'crypto' },\n    subject: { fullName: 'Jane Doe' },\n    counterparty: { fullName: 'Ana Diaz', paymentMethod: { type: 'unhosted_wallet', accountId: '0xBeneficiaryWallet01' } },\n    travelRule: { status: 'AWAITING_COUNTERPARTY', beneficiaryData: { wallet_address: '0xBeneficiaryWallet01', name: 'Ana Diaz' } },\n    includeCryptoScreening: true\n  },\n  onActionCompleted: (refreshed) => console.log(refreshed.status)\n});"
      responses:
        '201':
          description: Transaction submitted and monitored. Same detail shape as `GET /v3/transactions/{transaction_id}/`, including the `action_required` block when the end user must complete a follow-up action (the SDKs auto-launch it by default).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
              examples:
                Wallet ownership required:
                  value:
                    uuid: 22222222-3333-4444-5555-666666666666
                    txn_id: wd-2026-07-07-0042
                    transaction_type: travelRule
                    direction: OUTBOUND
                    status: APPROVED
                    amount: '0.25'
                    currency: ETH
                    travel_rule:
                      uuid: 33333333-4444-5555-6666-777777777777
                      status: UNCONFIRMED_OWNERSHIP
                      required: true
                    action_required:
                      type: wallet_ownership
                      url: https://verify.didit.me/wallet-ownership/3s9x...urlsafe
                      widget_session_id: 77777777-8888-9999-aaaa-bbbbbbbbbbbb
                      expires_at: '2026-07-07T13:00:00Z'
        '400':
          description: Validation failed (missing required fields, duplicate `txnId`, unknown category).
          content:
            application/json:
              examples:
                Missing fields:
                  value:
                    transaction_details:
                      currency:
                      - This field is required.
                Duplicate txnId:
                  value:
                    transaction_id:
                    - A transaction with this transaction_id already exists.
        '401':
          description: 'The transaction token was rejected: missing, unknown, revoked, over its `max_uses`, or expired. Expired-token responses always contain the word `expired` in the detail, which is how the SDKs distinguish `expired_token` from `invalid_token` errors.'
          content:
            application/json:
              examples:
                Invalid token:
                  value:
                    detail: Invalid transaction token.
                Expired token:
                  value:
                    detail: Transaction token expired.
        '409':
          description: Another request with the same `txnId` created the transaction while this one was being processed, so only one of two simultaneous submissions succeeds. Read the existing transaction instead of resubmitting.
          content:
            application/json:
              examples:
                Concurrent duplicate:
                  value:
                    detail: A transaction with this transaction_id already exists.
  /v1/transactions/{transaction_id}/:
    get:
      summary: Get a transaction from an SDK
      description: Device-facing read endpoint, authenticated with the same `X-Transaction-Token` used to submit. The SDKs poll it after an auto-launched action flow completes or its window closes, so the final state never depends on a single notification. Returns the same transaction detail as the submit response, including the current `action_required` block (`null` once the action is resolved).
      operationId: getTransactionFromSdk
      tags:
      - Transactions
      parameters:
      - name: transaction_id
        in: path
        required: true
        description: Didit-stable transaction UUID (the `uuid` from the submit response, **not** your `txnId`).
        schema:
          type: string
          format: uuid
        example: 22222222-3333-4444-5555-666666666666
      security:
      - TransactionTokenAuth: []
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X GET 'https://verification.didit.me/v1/transactions/22222222-3333-4444-5555-666666666666/' \\\n  -H 'X-Transaction-Token: SDK_TOKEN'"
      responses:
        '200':
          description: The full transaction detail, including `action_required` (`null` once the pending action is resolved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '401':
          description: 'The transaction token was rejected: missing, unknown, revoked, over its `max_uses`, or expired.'
          content:
            application/json:
              examples:
                Expired token:
                  value:
                    detail: Transaction token expired.
        '404':
          description: No transaction with this UUID exists for the token's application, or the path segment is not a valid UUID.
          content:
            application/json:
              examples:
                Not found:
                  value:
                    detail: Not found.
  /v3/transactions/rules/:
    get:
      summary: List rules
      description: 'List the application''s transaction-monitoring rules: your custom rules plus any library presets you have installed. Filter by source, category, mode, bundle or free-text search; order with `ordering` (run_count, approved_pct, reviewed_pct, declined_pct, latest_triggered_at, title, created_at, source, each with an optional `-` prefix).'
      operationId: listTransactionRules
      tags:
      - Transactions
      security:
      - ApiKeyAuth: []
      parameters:
      - name: source
        in: query
        required: false
        schema:
          type: string
          enum:
          - PRESET
          - CUSTOM
        description: PRESET or CUSTOM
      - name: category
        in: query
        required: false
        schema:
          type: string
        description: Filter by rule category
      - name: mode
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - DISABLED
          - TEST
        description: ACTIVE, DISABLED or TEST
      - name: bundle
        in: query
        required: false
        schema:
          type: string
        description: Filter presets by bundle
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Case-insensitive match against title and description
      - name: ordering
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated ordering fields, default source,-run_count
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Page size
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Page offset
      responses:
        '200':
          description: Paginated rules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                  previous:
                    type:
                    - string
                    - 'null'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionRuleDetail'
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X GET 'https://verification.didit.me/v3/transactions/rules/?source=CUSTOM&ordering=-run_count' \\\n  -H 'x-api-key: YOUR_API_KEY'"
    post:
      summary: Create rule
      description: Create a CUSTOM transaction-monitoring rule. Titles are unique per application (duplicate -> 400). A `change_status` action targeting `AWAITING_USER` must carry `workflow_id`. Rules created in ACTIVE mode apply to new transactions immediately - the recommended workflow is create in TEST mode, backtest, then switch mode to ACTIVE.
      operationId: createTransactionRule
      tags:
      - Transactions
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRuleCreateRequest'
            example:
              title: Structuring - inbound (custom)
              description: 20+ inbound EUR transfers, all under 10,000 EUR, 30 days
              category: finance
              mode: TEST
              evaluation_mode: ALL
              scope:
                transaction_types:
                - finance
                directions:
                - INBOUND
              conditions:
              - field: currency
                operator: eq
                value: EUR
              - field: amount
                operator: lt
                value: 10000
              aggregation:
              - metric: count
                operator: gte
                value: 20
                window: 30d
                filters:
                  direction: INBOUND
                  transaction_type: finance
                  subject_vendor_data: __current__
                  currency: EUR
              - metric: max
                field: amount
                operator: lt
                value: 10000
                window: 30d
                filters:
                  direction: INBOUND
                  transaction_type: finance
                  subject_vendor_data: __current__
                  currency: EUR
              actions:
              - type: add_score
                value: 35
      responses:
        '201':
          description: The created rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRuleDetail'
        '400':
          description: Validation error - duplicate title, unknown operator/metric, malformed window, invalid scope direction, or AWAITING_USER without workflow_id.
          content:
            application/json:
              schema:
                type: object
              example:
                title:
                - A rule with this name already exists.
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X POST 'https://verification.didit.me/v3/transactions/rules/' \\\n  -H 'x-api-key: YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"title\": \"Structuring - inbound (custom)\", \"description\": \"20+ inbound EUR transfers, all under 10,000 EUR, 30 days\", \"category\": \"finance\", \"mode\": \"TEST\", \"evaluation_mode\": \"ALL\", \"scope\": {\"transaction_types\": [\"finance\"], \"directions\": [\"INBOUND\"]}, \"conditions\": [{\"field\": \"currency\", \"operator\": \"eq\", \"value\": \"EUR\"}, {\"field\": \"amount\", \"operator\": \"lt\", \"value\": 10000}], \"aggregation\": [{\"metric\": \"count\", \"operator\": \"gte\", \"value\": 20, \"window\": \"30d\", \"filters\": {\"direction\": \"INBOUND\", \"transaction_type\": \"finance\", \"subject_vendor_data\": \"__current__\", \"currency\": \"EUR\"}}, {\"metric\": \"max\", \"field\": \"amount\", \"operator\": \"lt\", \"value\": 10000, \"window\": \"30d\", \"filters\": {\"direction\": \"INBOUND\", \"transaction_type\": \"finance\", \"subject_vendor_data\": \"__current__\", \"currency\": \"EUR\"}}], \"actions\": [{\"type\": \"add_score\", \"value\": 35}]}'"
      - lang: python
        label: Python
        source: "import os\n\nimport requests\n\nrule = {\n  \"title\": \"Structuring - inbound (custom)\",\n  \"description\": \"20+ inbound EUR transfers, all under 10,000 EUR, 30 days\",\n  \"category\": \"finance\",\n  \"mode\": \"TEST\",\n  \"evaluation_mode\": \"ALL\",\n  \"scope\": {\n    \"transaction_types\": [\n      \"finance\"\n    ],\n    \"directions\": [\n      \"INBOUND\"\n    ]\n  },\n  \"conditions\": [\n    {\n      \"field\": \"currency\",\n      \"operator\": \"eq\",\n      \"value\": \"EUR\"\n    },\n    {\n      \"field\": \"amount\",\n      \"operator\": \"lt\",\n      \"value\": 10000\n    }\n  ],\n  \"aggregation\": [\n    {\n      \"metric\": \"count\",\n      \"operator\": \"gte\",\n      \"value\": 20,\n      \"window\": \"30d\",\n      \"filters\": {\n        \"direction\": \"INBOUND\",\n        \"transaction_type\": \"finance\",\n        \"subject_vendor_data\": \"__current__\",\n        \"currency\": \"EUR\"\n      }\n    },\n    {\n      \"metric\": \"max\",\n      \"field\": \"amount\",\n      \"operator\": \"lt\",\n      \"value\": 10000,\n      \"window\": \"30d\",\n      \"filters\": {\n        \"direction\": \"INBOUND\",\n        \"transaction_type\": \"finance\",\n        \"subject_vendor_data\": \"__current__\",\n        \"currency\": \"EUR\"\n      }\n    }\n  ],\n  \"actions\": [\n    {\n      \"type\": \"add_score\",\n      \"value\": 35\n    }\n  ]\n}\n\nresp = requests.post(\n    'https://verification.didit.me/v3/transactions/rules/',\n    headers={'x-api-key': os.environ['DIDIT_API_KEY']},\n    json=rule,\n    timeout=15,\n)\nresp.raise_for_status()\nprint(resp.json()['uuid'], resp.json()['mode'])"
      - lang: javascript
        label: JavaScript
        source: "const rule = {\n  \"title\": \"Structuring - inbound (custom)\",\n  \"description\": \"20+ inbound EUR transfers, all under 10,000 EUR, 30 days\",\n  \"category\": \"finance\",\n  \"mode\": \"TEST\",\n  \"evaluation_mode\": \"ALL\",\n  \"scope\": {\n    \"transaction_types\": [\n      \"finance\"\n    ],\n    \"directions\": [\n      \"INBOUND\"\n    ]\n  },\n  \"conditions\": [\n    {\n      \"field\": \"currency\",\n      \"operator\": \"eq\",\n      \"value\": \"EUR\"\n    },\n    {\n      \"field\": \"amount\",\n      \"operator\": \"lt\",\n      \"value\": 10000\n    }\n  ],\n  \"aggregation\": [\n    {\n      \"metric\": \"count\",\n      \"operator\": \"gte\",\n      \"value\": 20,\n      \"window\": \"30d\",\n      \"filters\": {\n        \"direction\": \"INBOUND\",\n        \"transaction_type\": \"finance\",\n        \"subject_vendor_data\": \"__current__\",\n        \"currency\": \"EUR\"\n      }\n    },\n    {\n      \"metric\": \"max\",\n      \"field\": \"amount\",\n      \"operator\": \"lt\",\n      \"value\": 10000,\n      \"window\": \"30d\",\n      \"filters\": {\n        \"direction\": \"INBOUND\",\n        \"transaction_type\": \"finance\",\n        \"subject_vendor_data\": \"__current__\",\n        \"currency\": \"EUR\"\n      }\n    }\n  ],\n  \"actions\": [\n    {\n      \"type\": \"add_score\",\n      \"value\": 35\n    }\n  ]\n};\n\nconst resp = await fetch('https://verification.didit.me/v3/transactions/rules/', {\n  method: 'POST',\n  headers: {\n    'x-api-key': process.env.DIDIT_API_KEY,\n    'Content-Type': 'application/json',\n  },\n  body: JSON.stringify(rule),\n});\nif (!resp.ok) throw new Error(await resp.text());\nconst created = await resp.json();\nconsole.log(created.uuid, created.mode);"
  /v3/transactions/rules/{rule_uuid}/:
    parameters:
    - name: rule_uuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The rule's uuid from list or create.
    get:
      summary: Get rule
      description: Retrieve one rule with its full configuration and execution counters.
      operationId: getTransactionRule
      tags:
      - Transactions
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: The rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRuleDetail'
