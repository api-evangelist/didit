components:
  schemas:
    TransactionRuleAggregation:
      type: object
      required:
      - value
      properties:
        metric:
          type: string
          enum:
          - count
          - sum
          - max
          - min
          - avg
          - distinct_count
          default: count
          description: How the matching historical transactions are aggregated. unique_count is accepted as an alias of distinct_count.
        field:
          type: string
          default: amount
          description: Field aggregated by sum/max/min/avg/distinct_count. Ignored for count.
        operator:
          type: string
          enum:
          - eq
          - ne
          - gt
          - gte
          - lt
          - lte
          default: eq
          description: Comparison applied to the computed metric.
        value:
          type: number
          description: Threshold the computed metric is compared against.
        window:
          type: string
          pattern: ^\d+(m|h|d)$
          default: 1d
          description: 'Look-back window ending at the transaction''s txn_date: <N>m (MINUTES, not months), <N>h (hours) or <N>d (days), e.g. 30m, 24h, 7d, 30d.'
        filters:
          type: object
          additionalProperties: true
          description: 'Narrows which historical transactions are aggregated. Keys are field paths from the condition field catalog; a value of "__current__" resolves to the same field''s value on the transaction being evaluated (e.g. {"subject_vendor_data": "__current__"} scopes the window to the same subject), and a list value means membership. Filters compare by equality or membership ONLY - there is no lt/gte filter, so a range such as "historical transactions under 10,000" cannot be expressed here. Put the range on the metric instead (metric max with operator lt keeps every transaction in the window below the threshold).'
      description: Velocity check over the application's historical transactions inside the window. Every aggregation entry must match for the rule to match, regardless of evaluation_mode. An aggregation constrains only the window; the transaction being evaluated is constrained by scope and conditions, so repeat direction, currency or transaction_type on both halves when the rule promises them.
    TransactionDetail:
      type: object
      description: Full monitoring record for one transaction, as returned by `GET /v3/transactions/{transaction_id}/` and `POST /v3/transactions/`.
      properties:
        uuid:
          type: string
          format: uuid
          description: Didit-stable transaction identifier. Use as `{transaction_id}` for follow-up calls.
        environment:
          type: string
          enum:
          - live
          - sandbox
          description: Environment of the application that owns the transaction. A `sandbox` transaction is stored but never evaluated, screened, notified or billed, so its empty `rule_runs` means "not evaluated".
        transaction_number:
          type: integer
          description: Application-scoped sequential transaction number shown in Console (e.g. `4123`).
        txn_id:
          type: string
          description: The `transaction_id` you supplied at create time (max 128 chars). Unique per application.
        txn_date:
          type: string
          format: date-time
          description: When the transaction occurred (from `transaction_at`; defaults to submission time).
        zone_id:
          type:
          - string
          - 'null'
          description: IANA time zone identifier provided at create time.
        transaction_type:
          type: string
          description: 'Top-level category as stored: `finance`, `kyc`, `travelRule`, `userPlatformEvent`, `gamblingBet`, `gamblingLimitChange`, `gamblingBonusChange`, `auditTrailEvent`. Note multi-word values are echoed back in camelCase even when submitted in snake_case.'
        action_type:
          type: string
          description: Sub-type within the category (e.g. `deposit`, `withdrawal`, `transfer`). Defaults to the category when not supplied.
        direction:
          type: string
          enum:
          - INBOUND
          - OUTBOUND
          description: Direction relative to the subject. Stored uppercase regardless of the casing submitted (`in`/`out`/`inbound`/`outbound` are accepted on input).
        status:
          type: string
          enum:
          - APPROVED
          - IN_REVIEW
          - DECLINED
          - AWAITING_USER
          description: Current monitoring verdict. Transactions are created `APPROVED`; rules may flip them to `IN_REVIEW`/`DECLINED` synchronously.
        source:
          type: string
          enum:
          - LIVE
          - IMPORTED
          description: 'How the record originated: `LIVE` for transactions submitted through the API or SDK, `IMPORTED` for transactions loaded through the console import.'
        amount:
          type: string
          description: Transaction amount as a decimal string with trailing zeros stripped (e.g. `"1500"`, `"0.5"`, `"0.123456789012345678"`). Up to 18 decimal places.
        currency:
          type: string
          description: 'Currency code of `amount`. Any ISO 4217 alphabetic code is accepted (e.g. `EUR`, `USD`, `NGN`), as is a crypto asset symbol (e.g. `BTC`). Prefer a currently-circulating code. Not every accepted code has an exchange rate: when none is available for the code (for example the ISO accounting unit `XSU`, or a crypto symbol Didit does not price), automatic conversion fails and `preferred_currency_amount` is returned null unless the request supplied a pre-converted `amount_in_default_currency`.'
        currency_type:
          type:
          - string
          - 'null'
          description: '`fiat` or `crypto`, as submitted in `currency_kind`.'
        amount_in_default_currency:
          type:
          - string
          - 'null'
          description: Pre-converted amount you supplied, as a decimal string with trailing zeros stripped.
        default_currency_code:
          type:
          - string
          - 'null'
        preferred_currency_amount:
          type:
          - string
          - 'null'
          description: '`amount` converted to the application''s preferred currency, when available.'
        preferred_currency_code:
          type:
          - string
          - 'null'
        payment_details:
          type:
          - string
          - 'null'
          description: Free-text payment reference or memo from the submission.
        payment_txn_id:
          type:
          - string
          - 'null'
          description: External payment system reference (e.g. blockchain transaction hash) from `payment_reference_id`.
        score:
          type: integer
          description: Risk score accumulated by rules (typically 0–100). Higher = riskier.
        severity:
          type:
          - string
          - 'null'
          enum:
          - UNKNOWN
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          description: Categorical risk severity set by rules/providers (`UNKNOWN`, `LOW`, `MEDIUM`, `HIGH`, `CRITICAL`). `null` until something sets it.
        decision_reason_code:
          type:
          - string
          - 'null'
          description: Machine-readable reason for the current `status`.
        decision_reason_label:
          type:
          - string
          - 'null'
          description: Human-readable label for `decision_reason_code`.
        vendor_data:
          type:
          - string
          - 'null'
          description: Convenience copy of the applicant's `vendor_data`.
        metadata:
          type: object
          description: Snapshot of the `subject` and `counterparty` payloads as submitted at create time.
        props:
          type: object
          description: The `custom_properties` you supplied at create time. Each key is addressable in rule conditions as `custom_values.<key>`.
        tags:
          type: array
          items:
            type: object
            properties:
              uuid:
                type: string
                format: uuid
              name:
                type: string
              color:
                type: string
              description:
                type:
                - string
                - 'null'
              source:
                type: string
                enum:
                - didit
                - custom
                description: Whether the tag is a Didit preset or a custom tag.
          description: Tags attached to the transaction (manually or by rules).
        parties:
          type: array
          items:
            type: object
            properties:
              uuid:
                type: string
                format: uuid
              role:
                type: string
                enum:
                - APPLICANT
                - REMITTER
                - BENEFICIARY
                - COUNTERPARTY
                description: Party role. The create endpoint assigns `APPLICANT` (the subject) and `COUNTERPARTY`.
              entity_type:
                type: string
                enum:
                - individual
                - company
                - external
                - unhostedWallet
              kind:
                type: string
                enum:
                - USER
                - BUSINESS
                - EXTERNAL
                description: '`USER`/`BUSINESS` parties link back to a Didit-owned entity via `vendor_data`. `EXTERNAL` parties have no Didit entity behind them.'
              vendor_data:
                type:
                - string
                - 'null'
                description: Your internal user/business identifier.
              full_name:
                type:
                - string
                - 'null'
              first_name:
                type:
                - string
                - 'null'
              last_name:
                type:
                - string
                - 'null'
              country_code:
                type:
                - string
                - 'null'
                description: Country code from the submitted `address.country` (typically ISO 3166-1 alpha-3).
              dob:
                type:
                - string
                - 'null'
                format: date
                description: Date of birth from the submitted `date_of_birth`.
              address:
                type: object
                description: Address object as submitted. `{}` when omitted.
              institution_info:
                type: object
                description: Institution details as submitted. `{}` when omitted.
              device:
                type: object
                description: Normalized device context, including server-side IP enrichment under network_context (geolocation, VPN/data-center flags) when an IP was provided.
                properties:
                  fingerprint:
                    type: string
                    description: Unique device fingerprint.
                  persistent_device_id:
                    type: string
                    description: Stable cross-session device identifier (v2 fingerprint schema).
                  user_agent:
                    type: string
                    description: Browser or app user agent string.
                  browser_family:
                    type: string
                    description: Browser family (e.g. Chrome, Firefox, Safari).
                  browser_version:
                    type: string
                    description: Browser version string.
                  platform:
                    type: string
                    description: Platform identifier (web, ios, android, macos, windows, linux).
                  os_family:
                    type: string
                    description: Operating system family (e.g. iOS, Android, Windows).
                  os_version:
                    type: string
                    description: Operating system version string.
                  accept_language:
                    type: string
                    description: Accept-Language header value.
                  session_id:
                    type: string
                    description: Session identifier (stored in metadata).
                  session_age_ms:
                    type: number
                    description: Session age in milliseconds.
                  network_context:
                    type: object
                    description: Network context with IP address and geo-location.
                    properties:
                      ip_address:
                        type: string
                        description: Client IP address.
                      ip_country_code:
                        type: string
                        description: Geo-resolved country of the IP (ISO 3166-1 alpha-3).
                      latitude:
                        type: number
                        description: Geographic latitude of the IP.
                      longitude:
                        type: number
                        description: Geographic longitude of the IP.
              external_party_snapshot:
                type:
                - object
                - 'null'
                description: Frozen copy of the party data for `EXTERNAL` parties. `null` while the party is linked to a Didit user or business.
          description: Transaction parties (applicant, counterparty).
        payment_methods:
          type: array
          items:
            type: object
            properties:
              uuid:
                type: string
                format: uuid
              payment_method_type:
                type: string
                enum:
                - bank_card
                - bank_account
                - e_wallet
                - crypto_wallet
                - unhosted_wallet
                - other
              label:
                type:
                - string
                - 'null'
              fingerprint:
                type:
                - string
                - 'null'
                description: SHA-256 over `type:account_id:issuing_country` — stable identifier to correlate reuse of the same instrument.
              account_id:
                type:
                - string
                - 'null'
                description: Account identifier (IBAN, wallet address, card token, …).
              issuing_country:
                type:
                - string
                - 'null'
              owner_kind:
                type: string
                enum:
                - USER
                - BUSINESS
                - EXTERNAL
              vendor_data:
                type:
                - string
                - 'null'
                description: Your identifier for the owning user/business.
              owner_name:
                type:
                - string
                - 'null'
              institution_info:
                type: object
              details:
                type: object
                description: Raw `payment_method` object as submitted.
              external_owner_snapshot:
                type:
                - object
                - 'null'
              role:
                type: string
                enum:
                - SOURCE
                - DESTINATION
                - FUNDING
                - BENEFICIARY
                description: 'How this method was used in the transaction. The create endpoint assigns `SOURCE`/`DESTINATION` from the direction (outbound: subject = SOURCE; inbound: subject = DESTINATION).'
          description: Payment methods linked to the transaction.
        documents:
          type: array
          description: Files attached to the transaction from the console. `[]` when none.
          items:
            type: object
            properties:
              uuid:
                type: string
                format: uuid
              label:
                type:
                - string
                - 'null'
              note:
                type:
                - string
                - 'null'
              uploaded_by:
                type:
                - string
                - 'null'
              created_at:
                type: string
                format: date-time
              files:
                type: array
                items:
                  type: object
                  properties:
                    uuid:
                      type: string
                      format: uuid
                    file_url:
                      type:
                      - string
                      - 'null'
                      format: uri
                      description: Short-lived signed download URL; fetch it when needed rather than storing it.
                    original_filename:
                      type:
                      - string
                      - 'null'
                    file_size:
                      type:
                      - integer
                      - 'null'
        activities:
          type: array
          items:
            type: object
            properties:
              uuid:
                type: string
                format: uuid
              activity_type:
                type: string
                description: E.g. `TRANSACTION_CREATED`, `TRANSACTION_NOTE_ADDED`, `TRANSACTION_STATUS_CHANGED`.
              source:
                type: string
              status:
                type:
                - string
                - 'null'
              title:
                type:
                - string
                - 'null'
              description:
                type:
                - string
                - 'null'
              metadata:
                type: object
              occurred_at:
                type: string
                format: date-time
          description: Activity log entries (creation, notes, manual reviews, status changes).
        alerts:
          type: array
          items:
            type: object
            properties:
              uuid:
                type: string
                format: uuid
              title:
                type: string
              description:
                type:
                - string
                - 'null'
              severity:
                type: string
                enum:
                - UNKNOWN
                - LOW
                - MEDIUM
                - HIGH
                - CRITICAL
              status:
                type: string
                enum:
                - OPEN
                - INVESTIGATING
                - AWAITING_USER
                - PENDING_SAR
                - SAR_FILED
                - RESOLVED
                - DISMISSED
              source:
                type: string
                enum:
                - RULE
                - PROVIDER
                - MANUAL
              metadata:
                type: object
              created_at:
                type: string
                format: date-time
              due_at:
                type:
                - string
                - 'null'
                format: date-time
          description: Alerts raised by rules and providers.
        rule_runs:
          type: array
          items:
            type: object
            properties:
              uuid:
                type: string
                format: uuid
              rule:
                type: string
                format: uuid
                description: UUID of the rule that ran.
              rule_title:
                type: string
              rule_description:
                type:
                - string
                - 'null'
              rule_category:
                type: string
              matched:
                type: boolean
                description: Whether the rule's conditions matched this transaction. A run is recorded only for matched rules, so live evaluations always carry `true`.
              is_test:
                type: boolean
                description: True when the rule ran in TEST mode (no effect on status/score).
              mode:
                type: string
                enum:
                - ACTIVE
                - DISABLED
                - TEST
              severity:
                type:
                - string
                - 'null'
              score_delta:
                type: integer
                description: Score added by this rule's `add_score` actions.
              status_target:
                type:
                - string
                - 'null'
                description: Status set by a `change_status` action, if any.
              action_summary:
                type:
                - string
                - 'null'
                description: 'Summary of the actions the rule executed, joined with `; ` (e.g. `score +30; change_status:IN_REVIEW; add_tag:high_risk_country`). Parts: `score +N`, `change_status:<STATUS>`, `add_tag:<name>`, `add_note`, `add_to_list`, `open_case`. `null` when the rule executed no action.'
              metadata:
                type: object
                description: 'Evaluation detail: `scope_match`, `conditions[]` and `aggregations[]`. Each condition entry carries `field`, `operator`, `expected_value`, the `current_value` read from the transaction, `matched`, `group_index` and `group_logic`. Each aggregation entry (velocity / count / sum) carries `metric`, `field`, `operator`, `expected_value`, the `computed_value` the aggregate evaluated to, `window`, `filters`, `matched` and `sample_references`; deferred async aggregations have `computed_value: null` and `deferred: true`.'
              created_at:
                type: string
                format: date-time
          description: Per-rule execution results — which rule fired, with what score impact.
        provider_results:
          type: array
          items:
            type: object
            properties:
              uuid:
                type: string
                format: uuid
              provider:
                type: string
              result_type:
                type: string
                enum:
                - FIAT_MONITORING
                - WALLET_SCREENING
                - TRANSACTION_SCREENING
                - TRAVEL_RULE
                - NETWORK_GRAPH
                - CUSTOM
              status:
                type: string
              severity:
                type:
                - string
                - 'null'
              score:
                type: integer
              summary:
                type:
                - string
                - 'null'
              payload:
                type: object
                description: Raw provider response payload.
              created_at:
                type: string
                format: date-time
          description: Raw provider payloads (AML screening, blockchain analytics, etc.).
        travel_rule:
          type:
          - object
          - 'null'
          description: 'Travel Rule transfer or check. Populated when `travel_rule_details` was submitted, and also when Travel Rule is enabled and the transaction was created with `transaction_category: travelRule` (Didit initiates the exchange itself, even without `travel_rule_details`). `null` when no transfer or check exists. On an inbound transfer, the counterparty''s `originator_data` and `beneficiary_data` stay masked (`data_masked: true`) until wallet ownership is confirmed.'
          properties:
            uuid:
              type: string
              format: uuid
            status:
              type: string
            protocol:
              type:
              - string
              - 'null'
            required:
              type: boolean
            obligations_count:
              type: integer
            originator_data:
              type: object
              description: Originator party. For an inbound transfer the counterparty's values are masked until ownership is confirmed.
            beneficiary_data:
              type: object
              description: Beneficiary party. For an inbound transfer the counterparty's values are masked until ownership is confirmed.
            name_match:
              type:
              - object
              - 'null'
              description: The name comparison that decided the transfer (score and strictness). Null until one ran. The compared names are masked together with the parties.
            data_match:
              $ref: '#/components/schemas/TravelRuleDataMatch'
            mismatched_fields:
              type: array
              items:
                type: string
              description: Shortcut for `data_match.mismatched_fields`. Empty when nothing differs.
            data_unmasked:
              $ref: '#/components/schemas/TravelRuleDataUnmasked'
            data_masked:
              type: boolean
              description: True while the counterparty's personal data is masked in this response.
            metadata:
              type: object
        network_snapshot:
          type:
          - object
          - 'null'
          description: Graph snapshot of related transactions/parties used by the rules engine. Either the `network_snapshot` submitted with the transaction or the graph Didit builds from a successful AML wallet screening (which replaces a submitted one). `null` when neither exists.
          properties:
            uuid:
              type: string
              format: uuid
            nodes:
              type: array
              items:
                type: object
            edges:
              type: array
              items:
                type: object
            metrics:
              type: object
        remediation:
          type:
          - object
          - 'null'
          description: Remediation session offered to the user when re-verification is required. Superseded by `action_required`, which is the canonical block; kept for backward compatibility.
          properties:
            session_id:
              type: string
            session_token:
              type: string
            url:
              type: string
              format: uri
            status:
              type: string
        action_required:
          type:
          - object
          - 'null'
          description: 'Pending end-user action required to complete this transaction, or null when there is none. The Didit SDKs auto-launch the action by default and refresh the transaction when it finishes. Two variants, discriminated by `type`: `verification_session` (a hosted verification session created by a rule action) and `wallet_ownership` (a wallet-ownership widget session auto-minted for a Travel Rule transfer that needs proof of wallet control, gated by the `auto_wallet_verification` Travel Rule setting). When both could apply, `wallet_ownership` takes precedence because it blocks the Travel Rule exchange.'
          oneOf:
          - title: Verification session
            type: object
            properties:
              type:
                type: string
                enum:
                - verification_session
              url:
                type: string
                format: uri
                description: Hosted verification URL to open for the end user.
              session_id:
                type: string
                format: uuid
                description: Verification session id.
              session_token:
                type: string
                description: Session token, used by the mobile SDKs to launch the flow natively.
              status:
                type: string
                description: Verification session status.
            required:
            - type
            - url
          - title: Wallet ownership
            type: object
            properties:
              type:
                type: string
                enum:
                - wallet_ownership
              url:
                type: string
                format: uri
                description: Hosted wallet-ownership widget URL. Open it in a real browser surface - on mobile use SFSafariViewController or a Chrome Custom Tab, never an embedded webview.
              widget_session_id:
                type: string
                format: uuid
                description: Wallet-ownership widget session id.
              expires_at:
                type: string
                format: date-time
                description: When the widget session expires.
            required:
            - type
            - url
        cost_breakdown:
          type:
          - object
          - 'null'
          description: 'Cost of this transaction: `total_price` and `items`, one per charge, each with `usage_type`, `price`, `details` and `created_at`. A re-screen of the same transaction is a new item.'
    TransactionRuleBacktestRequest:
      type: object
      properties:
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRuleCondition'
          default: []
        aggregation:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRuleAggregation'
          default: []
        evaluation_mode:
          type: string
          enum:
          - ALL
          - ANY
          default: ALL
        scope:
          $ref: '#/components/schemas/TransactionRuleScope'
        period_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
      description: 'Hypothetical rule configuration to evaluate against recent transactions. Read-only and free: nothing is created or modified. Send the same conditions, aggregation, evaluation_mode AND scope as the rule you intend to activate. Omitted conditions, aggregation and scope add no constraints of their own; dropping scope can include directions or transaction types the saved rule skips. Omitted evaluation_mode defaults to ALL (which can reduce matches for an ANY rule), and omitted period_days defaults to 90 days, not unlimited history.'
    TransactionRuleCondition:
      type: object
      required:
      - field
      - operator
      properties:
        field:
          type: string
          description: 'Transaction field path to evaluate. Core fields: amount, currency, direction, action_type, score, severity, transaction_type, payment_details, preferred_currency_amount (falls back to amount_in_default_currency), default_currency_code, subject_country, counterparty_country, subject_vendor_data, counterparty_vendor_data, subject_device_fingerprint, counterparty_device_fingerprint, subject_browser_family, subject_browser_version, subject_platform, subject_accept_language, subject_session_age_ms, subject_ip_country, counterparty_ip_country, subject_ip_address, counterparty_ip_address, subject_payment_method_type, subject_payment_method_country, subject_payment_method_fingerprint, subject_payment_method_account_id (and the counterparty_payment_method_* equivalents), travel_rule_status, travel_rule_required, travel_rule_obligations_count, counterparty_dd_status (your decision on the Travel Rule counterparty: APPROVED, RESTRICTED or BLOCKED, an entity following its brand''s), counterparty_risk_level (LOW, MEDIUM or HIGH; HIGH while your own counterparty screening is flagged), counterparty_jurisdiction (the counterparty VASP''s country), counterparty_responsiveness (RESPONSIVE, UNRESPONSIVE or UNKNOWN), subject_days_since_previous_transaction, tags, and custom_values.<key> for any key submitted in custom_properties on transaction create. Country-code fields accept ISO-2 or ISO-3; both sides are normalized to ISO-3 before comparison.'
        operator:
          type: string
          enum:
          - eq
          - ne
          - gt
          - gte
          - lt
          - lte
          - in
          - not_in
          - contains
          - not_contains
          - contains_any
          - regex
          - fuzzy_match
          - exists
          - is_not_empty
          - is_not_null
          - not_exists
          - is_empty
          - is_null
          description: Comparison operator. in/not_in test membership (value may be a list or a single scalar). contains/not_contains are case-insensitive substring checks against a string value. contains_any takes a list of strings and matches when any is a case-insensitive substring of the field value. regex matches the value pattern against the field. fuzzy_match compares against the value string with the required `score` threshold (0-100). gt/gte/lt/lte never match when either side is missing. exists/is_not_empty/is_not_null (aliases) and not_exists/is_empty/is_null (aliases) are presence checks that ignore `value`.
        value:
          description: Comparison value. Its shape depends on the operator and value_type; omit for the presence-check operators.
        value_type:
          type: string
          enum:
          - list
          - field
          - relative_date
          description: 'Optional value interpretation. `list`: value is a List UUID and the list''s entries become the comparison value. `field`: value is another field path, compared field-to-field. `relative_date`: value is a relative-date object, e.g. {"direction": "past", "unit": "days", "amount": 30}.'
        score:
          type: number
          minimum: 0
          maximum: 100
          description: 'Required when operator is fuzzy_match: the 0-100 similarity threshold.'
        group_index:
          type: integer
          description: Optional grouped logic. When any condition carries group_index, conditions sharing an index form a group and grouped evaluation replaces evaluation_mode.
        group_logic:
          type: string
          enum:
          - AND
          - OR
          default: AND
          description: How conditions combine WITHIN a group.
        groups_logic:
          type: string
          enum:
          - AND
          - OR
          default: OR
          description: How group outcomes combine ACROSS groups. Read from the first condition.
      description: A condition reads only the transaction being evaluated - it never filters the aggregation window.
    TransactionRuleCreateRequest:
      type: object
      required:
      - title
      - category
      - mode
      properties:
        title:
          type: string
          description: Rule name. Unique per application among non-deleted rules; duplicates return 400.
        description:
          type:
          - string
          - 'null'
        category:
          type: string
          description: Risk theme used for grouping and reporting, e.g. finance, aml_ctf, anomaly_detection, fatf, device_intelligence, crypto_monitoring, travel_rule, responsible_gaming, e_commerce.
        mode:
          type: string
          enum:
          - ACTIVE
          - DISABLED
          - TEST
          description: ACTIVE evaluates live. TEST evaluates and records rule runs but never touches score or status - the recommended starting mode. DISABLED is skipped.
        evaluation_mode:
          type: string
          enum:
          - ALL
          - ANY
          default: ALL
          description: Whether every condition must match (ALL) or at least one (ANY). Ignored when conditions use group_index.
        scope:
          $ref: '#/components/schemas/TransactionRuleScope'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRuleCondition'
        aggregation:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRuleAggregation'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRuleAction'
        metadata:
          type: object
          description: Free-form metadata stored on the rule.
      description: Creates a CUSTOM rule. Rules in ACTIVE mode take effect immediately for new transactions - create in TEST mode and backtest first.
    TravelRuleDataUnmasked:
      type:
      - object
      - 'null'
      description: Audit record of the moment the counterparty's data was unmasked. Null while the data is still masked, and for outbound transfers.
      properties:
        at:
          type: string
          format: date-time
        reason:
          type: string
          enum:
          - ownership_confirmed
          - wallet_proof
          - address_book_match
          - own_verified_wallet
          - inquiry_approved
          description: 'What confirmed ownership: your confirmation through the console or the API, a wallet proof in the widget, a verified address-book wallet, your own verified wallet, or your approval of an inbound TRP inquiry.'
        actor:
          type: string
          description: 'Who confirmed it: the console user''s email or the API key''s label. Blank for an automatic decision.'
    TravelRuleDataMatch:
      type:
      - object
      - 'null'
      description: Field-by-field comparison of the transfer's party data with what the other side knows about the wallet holder. It names fields and results, never values, so it stays readable while the counterparty's data is masked. Null until a comparison ran.
      properties:
        matched:
          type: boolean
          description: True when no compared field differs.
        mismatched_fields:
          type: array
          items:
            type: string
            enum:
            - name
            - date_of_birth
            - address
            - account
          description: The fields that differ.
        fields:
          type: object
          description: One entry per field compared for the party's entity type (`name`, `date_of_birth`, `address`, `account`; a company has no `date_of_birth`).
          additionalProperties:
            type: object
            properties:
              result:
                type: string
                enum:
                - matched
                - mismatched
                - not_compared
                description: '`not_compared` when the rule is `NONE` or either side has no value for the field.'
              strictness:
                type: string
                enum:
                - NONE
                - STRICT
                - CONTAINS
                - DEFAULT
                - FUZZY
    WalletScreeningResult:
      type: object
      properties:
        provider:
          type: string
          description: Provider that performed the screening (e.g. `merklescience`, `crystal`).
        screening_type:
          type: string
          enum:
          - WALLET_SCREENING
          description: Always `WALLET_SCREENING` for this endpoint.
        risk_score:
          type: integer
          description: Normalised 0-100 risk score. Higher means greater exposure to risky entities. Merkle Science grades an address 0-5, which maps to 0, 15, 35, 55, 75 or 95.
        severity:
          type: string
          enum:
          - UNKNOWN
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          description: 'Risk bucket derived from `risk_score`: `0-9` UNKNOWN, `10-39` LOW, `40-69` MEDIUM, `70-89` HIGH, `90-100` CRITICAL. `UNKNOWN` is the lowest band, not a separate no-data state: `risk_score` 0 (the common clean-address case) means no adverse assessment, while a non-zero score in the 1-9 range is a real but sub-LOW signal - read the `risk_score`, not just the band. Never treat `UNKNOWN` as an affirmative low-risk or clear rating; do not display it as a pass.'
        status:
          type: string
          enum:
          - SCREENED
          - PENDING
          - ERROR
          description: Screening outcome status.
        summary:
          type: string
          description: Human-readable summary of the screening result.
        wallet_address:
          type: string
          description: The screened address, echoed back.
        transaction_hash:
          type:
          - string
          - 'null'
          description: Transaction screening field, shared with the result shape. Always `null` on a wallet screening result.
        blockchain:
          type: string
          description: The blockchain that was screened.
        block_timestamp:
          type:
          - string
          - 'null'
          description: Transaction screening field, shared with the result shape. Always `null` on a wallet screening result.
        total_value_usd:
          type:
          - number
          - 'null'
          description: Transaction screening field, shared with the result shape. Always `null` on a wallet screening result.
        fee_usd:
          type:
          - number
          - 'null'
          description: Transaction screening field, shared with the result shape. Always `null` on a wallet screening result.
        sender_rows:
          type: array
          items:
            type: object
          description: Transaction screening field, shared with the result shape. Always empty on a wallet screening result.
        receiver_rows:
          type: array
          items:
            type: object
          description: Transaction screening field, shared with the result shape. Always empty on a wallet screening result.
        transaction_flows:
          type: array
          items:
            type: object
          description: Transaction screening field, shared with the result shape. Always empty on a wallet screening result.
        transaction_flows_status:
          type:
          - string
          - 'null'
          description: Transaction screening field, shared with the result shape. Always `null` on a wallet screening result.
        transaction_flows_error:
          type:
          - string
          - 'null'
          description: Transaction screening field, shared with the result shape. Always `null` on a wallet screening result.
        source_of_funds:
          type: array
          description: Where the address received funds from, attributed by entity. Each entry is an exposure breakdown.
          items:
            type: object
            properties:
              category:
                type: string
                description: Normalised risk category, e.g. `exchange_licensed`, `dex`, `defi`, `payment_processor`, `mixer`, `darknet_market`, `sanctioned`, `stolen_funds`, `high_risk_exchange`.
              percentage:
                type: number
                description: Share of the direction's total exposure, 0-100.
              amount_usd:
                type:
                - number
                - 'null'
                description: USD value attributed to this entity.
              entity_name:
                type:
                - string
                - 'null'
                description: Name of the attributed entity, for example an exchange, a mixer or a sanctioned group.
              entity_type:
                type:
                - string
                - 'null'
                description: Provider entity type (e.g. `Exchange`, `DeFi`, `Sanctions`, `Theft`).
              entity_subtype:
                type:
                - string
                - 'null'
                description: More granular subtype (e.g. `Mandatory KYC and AML`, `OFAC`, `Yield Aggregator`).
              hops:
                type:
                - integer
                - 'null'
                description: 'Number of hops to the entity (1 for a direct counterparty), when the provider reports one. Always `null` for Merkle Science, which reports only whether exposure is direct or indirect: use `exposure_type`.'
              description:
                type:
                - string
                - 'null'
                description: '`entity_type / entity_subtype`, as the provider labels the entity.'
              is_direct:
                type: boolean
                description: True when `exposure_type` is `direct`.
              exposure_direction:
                type: string
                enum:
                - incoming
                - outgoing
                - connected
                description: Whether the funds came from (`incoming`) or went to (`outgoing`) this entity.
              exposure_type:
                type: string
                enum:
                - direct
                - indirect
                description: '`direct` (1 hop) or `indirect` (multi-hop) exposure.'
              provider_entity_id:
                type:
                - string
                - 'null'
                description: The provider's own identifier for the entity.
              provider_entity_type_id:
                type:
                - string
                - 'null'
                description: The provider's own identifier for `entity_type`.
              provider_entity_subtype_id:
                type:
                - string
                - 'null'
                description: The provider's own identifier for `entity_subtype`.
              country:
                type:
                - string
                - 'null'
                description: Primary ISO 3166-1 alpha-2 country of the entity. Empty or `null` when the provider does not know it.
              raw_amount:
                type:
                - number
                - 'null'
                description: Amount in the asset's own unit, when the provider reports it.
              raw_currency:
                type:
                - string
                - 'null'
                description: Unit of `raw_amount`, when the provider reports it.
        destination_of_funds:
          type: array
          description: Where the address sent funds to, attributed by entity. Same item shape as `source_of_funds` with `exposure_direction` = `outgoing`.
          items:
            type: object
            properties:
              category:
                type: string
                description: Normalised risk category, e.g. `exchange_licensed`, `dex`, `defi`, `payment_processor`, `mixer`, `darknet_market`, `sanctioned`, `stolen_funds`, `high_risk_exchange`.
              percentage:
                type: number
                description: Share of the direction's total exposure, 0-100.
              amount_usd:
                type:
                - number
                - 'null'
                description: USD value attributed to this entity.
              entity_name:
                type:
                - string
                - 'null'
                description: Name of the attributed entity, for example an exchange, a mixer or a sanctioned group.
              entity_type:
                type:
                - string
                - 'null'
                description: Provider entity type (e.g. `Exchange`, `DeFi`, `Sanctions`, `Theft`).
              entity_subtype:
                type:
                - string
                - 'null'
                description: More granular subtype (e.g. `Mandatory KYC and AML`, `OFAC`, `Yield Aggregator`).
              hops:
                type:
                - integer
                - 'null'
                description: 'Number of hops to the entity (1 for a direct counterparty), when the provider reports one. Always `null` for Merkle Science, which reports only whether exposure is direct or indirect: use `exposure_type`.'
              description:
                type:
                - string
                - 'null'
                description: '`entity_type / entity_subtype`, as the provider labels the entity.'
              is_direct:
                type: boolean
                description: True when `exposure_type` is `direct`.
              exposure_direction:
                type: string
                enum:
                - incoming
                - outgoing
                - connected
                description: Whether the funds came from (`incoming`) or went to (`outgoing`) this entity.
              exposure_type:
                type: string
                enum:
                - direct
                - indirect
                description: '`direct` (1 hop) or `indirect` (multi-hop) exposure.'
              provider_entity_id:
                type:
                - string
                - 'null'
                description: The provider's own identifier for the entity.
              provider_entity_type_id:
                type:
                - string
                - 'null'
                description: The provider's own identifier for `entity_type`.
              provider_entity_subtype_id:
                type:
                - string
                - 'null'
                description: The provider's own identifier for `entity_subtype`.
              country:
                type:
                - string
                - 'null'
                description: Primary ISO 3166-1 alpha-2 country of the entity. Empty or `null` when the provider does not know it.
              raw_amount:
                type:
                - number
                - 'null'
                description: Amount in the asset's own unit, when the provider reports it.
              raw_currency:
                type:
                - string
                - 'null'
                description: Unit of `raw_amount`, when the provider reports it.
        counterparty_connections:
          type: array
          description: 'Entities the provider attributes the screened address to. For Merkle Science these come from the address''s own owner and user tags, so the same entity can appear twice, and they carry no fund flows: `received_usd`, `sent_usd`, `received_hops` and `sent_hops` are `null` and `percentage` is 0. Do not route on `risk_level` or `is_direct` here: use `sanctions_hit`, `dominant_risk_category` and `risk_factors[].is_high_risk` for the verdict, and `exposure_type` in `source_of_funds`/`destination_of_funds` for directness.'
          items:
            type: object
            properties:
              entity_name:
                type:
                - string
                - 'null'
                description: Attributed entity name.
              entity_type:
                type:
                - string
                - 'null'
                description: Provider entity type.
              entity_subtype:
                type:
                - string
                - 'null'
                description: Provider entity subtype.
              risk_level:
                type: string
                description: Lowercase and provider-dependent. For Merkle Science it is the address's own 0-5 risk grade (`no_risk`, `low`, `medium_low`, `medium`, `high`, `critical`), raised to `high` when the entity's category is high risk; it is not a separate grade of the entity.
              categories:
                type: array
                items:
                  type: string
                description: Normalised risk categories of the entity.
              received_usd:
                type:
                - number
                - 'null'
                description: USD received from the entity, when the provider reports it.
              sent_usd:
                type:
                - number
                - 'null'
                description: USD sent to the entity, when the provider reports it.
              received_hops:
                type:
                - integer
                - 'null'
                description: Hops to the entity on the receiving side, when the provider reports them.
              sent_hops:
                type:
                - integer
                - 'null'
                description: Hops to the entity on the sending side, when the provider reports them.
              percentage:
                type: number
                description: Share of the address's exposure, when the provider reports it; otherwise 0.
              is_direct:
                type: boolean
                description: Always `true` for Merkle Science, whose connections are attributions rather than counterparties.
              country:
                type:
                - string
                - 'null'
                description: Country of the entity, when known.
              provider_entity_id:
                type:
                - string
                - 'null'
                description: The provider's own identifier for the entity.
        network_nodes:
          type: array
          items:
            type: object
          description: Exposure graph nodes for transaction screening. Empty on a wallet screening result.
        network_edges:
          type: array
          items:
            type: object
          description: Exposure graph edges for transaction screening. Empty on a wallet screening result.
        sanctions_hit:
          type: boolean
          description: True if the address has direct or indirect sanctions exposure.
        pep_counterparty:
          type:
          - boolean
          - 'null'
          description: Politically exposed person exposure. `null` when no PEP finding is available, which is every result today because no provider reports one; `false` only for an explicit negative screening result. Do not read `null` as a completed PEP check.
        dominant_risk_category:
          type:
          - string
          - 'null'
          description: Highest-weighted high-risk category, or `null` when none is dominant (e.g. `sanctioned`, `mixer`, `stolen_funds`).
        risk_factors:
          type: array
          description: 'Ranked explanation of `risk_score`: what produced this verdict. Providers grade an address on their own model and return only a verdict (Merkle Science returns an integer 0-5), so the score alone is not actionable. Ordered high-risk first, then by the value that moved through each driver, capped at the five strongest; `source_of_funds` and `destination_of_funds` always carry the complete breakdown. A high `risk_score` with no `is_high_risk` entry means the provider reported no sanctions or attributed-entity match and graded the address purely on its own exposure model - `summary` states this explicitly.'
          items:
            type: object
            properties:
              source:
                type: string
                enum:
                - attribution
                - exposure
                description: '`attribution` is what the provider says the address itself is (its own tag or cluster); `exposure` is where its funds actually moved.'
              category:
                type: string
                description: Normalised risk category, same vocabulary as the exposure breakdown.
              label:
                type: string
                description: The provider's own wording for the driver (e.g. `Gambling / Crypto only`), which is what you would also see in the provider's console.
              entity_name:
                type:
                - string
                - 'null'
                description: Attributed entity behind the driver, for example a gambling site or an exchange.
              direction:
                type: string
                enum:
                - incoming
                - outgoing
                - connected
                - unknown
                - attribution
                description: Direction of the fund flow, `attribution` when the driver is the address's own tag, or `unknown` when the provider did not report a direction.
              exposure_type:
                type: string
                enum:
                - direct
                - indirect
                - unknown
                - attribution
                description: '`direct` (1 hop) or `indirect` (multi-hop), `attribution` for the address''s own tag, or `unknown` when the provider did not state how many hops away the counterparty is. Treat `unknown` as unclassified, not as `direct`.'
              amount_usd:
                type:
                - number
                - 'null'
                format: float
                description: USD value attributed to this driver.
              percentage:
                type: number
                format: float
                description: Share of the address's TOTAL screened volume, both directions combined - unlike `percentage` inside `source_of_funds`/`destination_of_funds`, which is normalised per direction. Comparable and summable across the whole list.
              is_high_risk:
                type: boolean
                description: Whether the category is one Didit treats as high risk (`sanctioned`, `mixer`, `stolen_funds`, `ransomware`, `scam`, `darknet_market`, `terrorist_financing`, `child_exploitation`, `hacked_exchange`, `high_risk_exchange`, `seized_funds`).
              description:
                type: string
                description: One-line rendering of the driver, e.g. `9.01% indirect outgoing exposure to Gambling / Crypto only (Example Gambling)`.
        raw_response:
          type: object
          additionalProperties: true
          description: 'The provider''s own payload. Its shape is provider-specific and can change without notice: read the normalised fields instead of parsing it.'
        report_signature:
          type: string
          description: Opaque HMAC-SHA256 signature over this exact result, scoped to your application. Not meaningful on its own — repost the full response body, unmodified and including this field, to `POST /v3/wallet-screening/pdf/` to render it as a PDF. The PDF endpoint rejects the request with `400` if `report_signature` is missing or if any signed field (e.g. `risk_score`, `severity`, `sanctions_hit`) was edited before repost.
      required:
      - provider
      - screening_type
      - risk_score
      - severity
      - status
      - summary
      - wallet_address
      - blockchain
      - sanctions_hit
      - dominant_risk_category
      - source_of_funds
      - destination_of_funds
      - counterparty_connections
      - report_signature
    TransactionRuleDetail:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        title:
          type: string
          description: Rule name. Unique per application among non-deleted rules; duplicates return 400.
        description:
          type:
          - string
          - 'null'
        category:
          type: string
          description: Risk theme used for grouping and reporting, e.g. finance, aml_ctf, anomaly_detection, fatf, device_intelligence, crypto_monitoring, travel_rule, responsible_gaming, e_commerce.
        mode:
          type: string
          enum:
          - ACTIVE
          - DISABLED
          - TEST
          description: ACTIVE evaluates live. TEST evaluates and records rule runs but never touches score or status - the recommended starting mode. DISABLED is skipped.
        evaluation_mode:
          type: string
          enum:
          - ALL
          - ANY
          default: ALL
          description: Whether every condition must match (ALL) or at least one (ANY). Ignored when conditions use group_index.
        scope:
          $ref: '#/components/schemas/TransactionRuleScope'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRuleCondition'
        aggregation:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRuleAggregation'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRuleAction'
        metadata:
          type: object
          description: Free-form metadata stored on the rule.
        severity:
          type:
          - string
          - 'null'
          enum:
          - UNKNOWN
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          description: Informational severity carried by library rules; not settable on custom rules.
        source:
          type: string
          enum:
          - PRESET
          - CUSTOM
          description: PRESET rules come from the library (install/uninstall, mode-only edits); CUSTOM rules are fully yours.
        library_key:
          type:
          - string
          - 'null'
          description: Stable library identifier; null for custom rules.
        latest_triggered_at:
          type:
          - string
          - 'null'
          format: date-time
        run_count:
          type: integer
          description: How many transactions matched this rule.
        approved_count:
          type: integer
        reviewed_count:
          type: integer
        declined_count:
          type: integer
        awaiting_user_count:
          type: integer
        approved_pct:
          type: number
        reviewed_pct:
          type: number
        declined_pct:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TransactionRuleLibraryEntry:
      type: object
      properties:
        library_key:
          type: string
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        category:
          type: string
        evaluation_mode:
          type: string
          enum:
          - ALL
          - ANY
        scope:
          $ref: '#/components/schemas/TransactionRuleScope'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRuleCondition'
        aggregation:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRuleAggregation'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRuleAction'
        metadata:
          type: object
        bundle:
          type:
          - string
          - 'null'
          description: Functional family, e.g. finance, aml_ctf, crypto_monitoring, travel_rule, responsible_gaming.
        tags:
          type: array
          items:
            type: string
        industries:
          type: array
          items:
            type: string
        source:
          type: string
        is_installed:
          type: boolean
          description: Whether this preset is currently installed on the application.
    TransactionRuleAction:
      oneOf:
      - type: object
        required:
        - type
        - value
        properties:
          type:
            type: string
            enum:
            - add_score
          value:
            type: integer
            description: Points added to the transaction's risk score. May be negative.
        description: Add points to the transaction's cumulative risk score; the total decides the status via the application's review/decline thresholds.
      - type: object
        required:
        - type
        - value
        properties:
          type:
            type: string
            enum:
            - change_status
          value:
            type: string
            enum:
            - APPROVED
            - IN_REVIEW
            - DECLINED
            - AWAITING_USER
            description: 'Status to set immediately, regardless of score. Alias key: status.'
          workflow_id:
            type: string
            format: uuid
            description: 'REQUIRED when value is AWAITING_USER: the verification workflow the subject is asked to complete. Alias key: remediation_workflow_id. Didit creates a hosted remediation session for the subject when the rule fires.'
        description: Directly set the transaction status. DECLINED always wins across matched rules.
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - add_tags
          tag_uuid:
            type: string
            format: uuid
            description: Existing application tag to attach.
          tag_name:
            type: string
            description: Tag name to attach; created on first use (stored uppercased). Provide tag_uuid or tag_name.
          tag_color:
            type: string
            description: 'Hex color used when tag_name creates a new tag, e.g. #007AFE.'
        description: Attach an application tag to the matched transaction.
      - type: object
        required:
        - type
        - note
        properties:
          type:
            type: string
            enum:
            - add_note
          note:
            type: string
            description: 'Note text attached to the transaction (author: Rule Engine). Alias key: value.'
        description: Attach an automated analyst note to the matched transaction.
      - type: object
        required:
        - type
        - list_id
        properties:
          type:
            type: string
            enum:
            - add_to_list
          list_id:
            type: string
            format: uuid
            description: List to add the subject's vendor_data to.
        description: Add the subject's vendor_data to a blocklist, allowlist or custom list.
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - open_case
          blueprint:
            type: string
            format: uuid
            description: Case blueprint UUID; defaults to the application's default blueprint.
          grouping:
            type: string
            enum:
            - by_applicant
            - by_rule_and_applicant
            description: Whether repeat matches join one case per applicant or one per rule+applicant.
          attach_matched_transaction:
            type: boolean
            description: Attach the matched transaction to the case.
        description: Open (or add to) an investigation case. Only the first open_case action on a rule is applied.
      description: One rule action. A rule can carry several; all are applied together when it matches. Rules in TEST mode record what they would have done without applying any action.
    TransactionRuleInstallResult:
      type: object
      properties:
        installed_library_keys:
          type: array
          items:
            type: string
          description: 'POST (install) only: presets installed by this call.'
        installed_count:
          type: integer
          description: POST (install) only.
        uninstalled_count:
          type: integer
          description: 'DELETE (uninstall) only: presets removed by this call.'
    TransactionRuleUpdateRequest:
      type: object
      properties:
        title:
          type: string
          description: Rule name. Unique per application among non-deleted rules; duplicates return 400.
        description:
          type:
          - string
          - 'null'
        category:
          type: string
          description: Risk theme used for grouping and reporting, e.g. finance, aml_ctf, anomaly_detection, fatf, device_intelligence, crypto_monitoring, travel_rule, responsible_gaming, e_commerce.
        mode:
          type: string
          enum:
          - ACTIVE
          - DISABLED
          - TEST
          description: ACTIVE evaluates live. TEST evaluates and records rule runs but never touches score or status - the recommended starting mode. DISABLED is skipped.
        evaluation_mode:
          type: string
          enum:
          - ALL
          - ANY
          default: ALL
          description: Whether every condition must match (ALL) or at least one (ANY). Ignored when conditions use group_index.
        scope:
          $ref: '#/components/schemas/TransactionRuleScope'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRuleCondition'
        aggregation:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRuleAggregation'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRuleAction'
        metadata:
          type: object
          description: Free-form metadata stored on the rule.
      description: Partial update. Custom rules accept every field; library (PRESET) rules accept only mode - anything else returns 400.
    TransactionRuleInstallRequest:
      type: object
      properties:
        library_keys:
          type: array
          items:
            type: string
          description: Specific presets to install or uninstall.
        bundle:
          type: string
          description: Install or uninstall every preset in this bundle instead.
      description: Provide library_keys OR bundle.
    TransactionRuleBacktestResult:
      type: object
      properties:
        evaluated:
          type: integer
          description: Transactions evaluated (most recent first, capped).
        matched:
          type: integer
          description: Transactions the configuration would have matched.
        affected_entities:
          type: integer
          description: Distinct subjects (by vendor_data) among the matches.
        period_days:
          type: integer
    TransactionRuleScope:
      type: object
      properties:
        transaction_types:
          type: array
          items:
            type: string
          description: Restrict to transaction types, e.g. finance, kyc, travel_rule, user_event. Empty or missing = no restriction.
        directions:
          type: array
          items:
            type: string
            enum:
            - INBOUND
            - OUTBOUND
          description: Restrict to transaction directions (case-insensitive on write).
        action_types:
          type: array
          items:
            type: string
          description: Restrict to your action_type values, e.g. withdrawal, deposit.
      description: Which transactions the rule applies to. Only these three keys are accepted.
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: 'Your application''s API key, from Developers -> API keys in the Business Console. The primary key has full access. A named key can be scoped: none, read or write per resource, limited to some workflows or to approved sessions, to a list of IP addresses, and to an expiry date. 401 means the key is missing, wrong, revoked or expired; 403 means the key has no access to this resource or action, or the request came from an address outside its IP list; 404 on a session route means the session is outside the key''s workflows or statuses. A key without media access receives image, video and PDF URLs as null, and a key without sessions write receives session links and tokens as null. See https://docs.didit.me/console/api-keys.'
    TransactionTokenAuth:
      type: apiKey
      in: header
      name: X-Transaction-Token
      description: Short-lived scoped token minted by your backend via POST /v3/transactions/sdk-token/. Used by the Didit SDKs on the device-facing /v1/transactions/ endpoints.
    SessionTokenAuth:
      type: apiKey
      in: header
      name: Session-Token
      description: Short-lived token returned in the `session_token` field of POST /v3/session/. Used by the hosted verification flow (and custom sandbox UIs) to call session-scoped endpoints on behalf of the verifying user, without your server-side API key.
    BearerAuth:
      type: http
      scheme: bearer
      description: The application's client-credentials access token.
    CaseRequestToken:
      type: apiKey
      in: header
      name: X-Case-Request-Token
      description: Request-specific credential from the secure link. Grants access only to this request.
