openapi: 3.2.0
info:
  version: 3.0.0
  title: Didit Verification Case Management API
  description: Identity verification API. Authenticate with x-api-key header.
servers:
- url: https://verification.didit.me
tags:
- name: Case Management
paths:
  /v3/organization/{organization_id}/application/{application_id}/cases/{case_uuid}/entity-actions/:
    post:
      operationId: apply_case_entity_action
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: case_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Case Management
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CaseActionCaseEntityActionRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CaseActionCaseEntityActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CaseActionCaseEntityActionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseActionCaseEntityActionResult'
          description: ''
        '409':
          description: The reference belongs to a different action payload.
      security:
      - ApiKeyAuth: []
      description: 'Apply one explicit action to the case subject. Supply a unique client_reference to obtain an action receipt and make retries idempotent. Reusing that reference with a different payload returns 409. With a reference, inspect receipt.status even when HTTP status is 200: FAILED means no action was applied. Repeating a failed request does not execute it again unless retry is true. Omitting client_reference preserves the legacy response.'
      summary: Apply case entity action
      x-summary-source: derived
  /v3/organization/{organization_id}/application/{application_id}/cases/{case_uuid}/notes/:
    get:
      operationId: list_case_notes
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: case_uuid
        schema:
          type: string
          format: uuid
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCollaborationPaginatedCaseNoteList'
          description: ''
        '403':
          description: The caller lacks the required cases permission.
        '404':
          description: The case or note is unavailable for this caller.
      tags:
      - Case Management
      security:
      - ApiKeyAuth: []
      summary: List case notes
      x-summary-source: derived
    post:
      operationId: create_case_note
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: case_uuid
        schema:
          type: string
          format: uuid
        required: true
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CaseCollaborationCaseNoteCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCollaborationCaseNoteCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CaseCollaborationCaseNoteCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCollaborationCaseNote'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCollaborationCaseNote'
          description: ''
        '403':
          description: The caller lacks the required cases permission.
        '404':
          description: The case or note is unavailable for this caller.
        '409':
          description: This client reference was already used for another note or for a note that has been deleted.
      tags:
      - Case Management
      security:
      - ApiKeyAuth: []
      description: Add a case-scoped note. An optional client_reference makes an unchanged retry return the same note without duplicate activity or notifications. reply_to must identify a live note in this case. The response includes a bounded parent excerpt without copying that excerpt into the saved reply.
      summary: Create case note
      x-summary-source: derived
  /v3/organization/{organization_id}/application/{application_id}/cases/{case_uuid}/notes/{note_uuid}/:
    patch:
      operationId: root_partial_update
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: case_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: note_uuid
        schema:
          type: string
          format: uuid
        required: true
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CaseCollaborationPatchedCaseNoteUpdateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCollaborationPatchedCaseNoteUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CaseCollaborationPatchedCaseNoteUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCollaborationCaseNote'
          description: ''
        '403':
          description: The caller lacks the required cases permission.
        '404':
          description: The case or note is unavailable for this caller.
      tags:
      - Case Management
      security:
      - ApiKeyAuth: []
      description: Pin or unpin an existing note. Pinned notes appear first. Pin changes are recorded in case activity and do not change evidence or source decisions.
      summary: Root partial update
      x-summary-source: derived
    delete:
      operationId: delete_case_note
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: case_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: note_uuid
        schema:
          type: string
          format: uuid
        required: true
      responses:
        '204':
          description: The note is permanently deleted. Replies remain, without the deleted parent excerpt. Attachments are deleted unless another note still uses them.
        '403':
          description: The caller lacks the required cases permission.
        '404':
          description: The case or note is unavailable for this caller.
      tags:
      - Case Management
      security:
      - ApiKeyAuth: []
      summary: Delete case note
      x-summary-source: derived
