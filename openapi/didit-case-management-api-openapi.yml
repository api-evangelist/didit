          type: string
          format: uuid
        required: true
      - in: path
        name: case_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Case Management
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerMessagingCaseRequestConfirmRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerMessagingCaseRequestConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerMessagingCaseRequestConfirmRequest'
        required: true
      responses:
        '404':
          description: The request or case is unavailable for this caller.
        '403':
          description: The caller lacks the required cases permission.
        '400':
          description: Invalid inputs, unsupported purpose, unavailable verified contact or an existing immutable response.
        '409':
          description: The preview changed or expired. Preview again before confirming.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerMessagingCaseRequest'
          description: ''
      security:
      - ApiKeyAuth: []
      description: Confirm the exact signed preview within 15 minutes. Only fixed templates and an OTP-verified contact belonging to the case subject are accepted. The request ID makes retries idempotent. Delivery is queued; SENT, SIMULATED and UNKNOWN are distinct outcomes. An actionable request sets the case to Awaiting user. A review update leaves its status unchanged.
      summary: Organization application cases requests create
      x-summary-source: derived
