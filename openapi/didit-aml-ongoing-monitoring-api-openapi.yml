        '400':
          description: 'Validation error: `is_enabled` missing, no selector, or more than 1000 identifiers across both lists.'
        '401':
          description: Missing or invalid API key.
        '403':
          description: Insufficient balance to enable monitoring for this selection. The response carries the `estimate` so you can top up the right amount.
