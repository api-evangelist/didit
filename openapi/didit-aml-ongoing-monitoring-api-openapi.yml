  /v3/aml-monitoring/jobs/{job_id}/:
    get:
      summary: Get AML ongoing monitoring job
      description: Status, outcome counters and per-record results of a monitoring toggle job started from `POST /v3/users/aml-monitoring/` or `POST /v3/businesses/aml-monitoring/`. Poll every couple of seconds while `status` is `PENDING` or `PROCESSING`; `results` is complete once it is `COMPLETED`.
      operationId: get_aml_monitoring_job
      tags:
      - AML Ongoing Monitoring
      security:
      - ApiKeyAuth: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The `job_id` returned by the toggle endpoint.
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl 'https://verification.didit.me/v3/aml-monitoring/jobs/JOB_ID/' \\\n  -H 'x-api-key: YOUR_API_KEY'"
      - lang: python
        label: Python
        source: "import time\nimport requests\n\nurl = 'https://verification.didit.me/v3/aml-monitoring/jobs/JOB_ID/'\nwhile True:\n    job = requests.get(url, headers={'x-api-key': 'YOUR_API_KEY'}).json()\n    if job['status'] in ('COMPLETED', 'FAILED'):\n        break\n    time.sleep(2)\nprint(job['outcomes'])"
      - lang: javascript
        label: JavaScript
        source: "const url = 'https://verification.didit.me/v3/aml-monitoring/jobs/JOB_ID/';\nlet job;\ndo {\n  await new Promise((r) => setTimeout(r, 2000));\n  job = await (await fetch(url, { headers: { 'x-api-key': process.env.DIDIT_API_KEY } })).json();\n} while (job.status === 'PENDING' || job.status === 'PROCESSING');\nconsole.log(job.outcomes);"
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                    - PENDING
                    - PROCESSING
                    - COMPLETED
                    - FAILED
                  is_enabled:
                    type: boolean
                    description: true when the job enables monitoring, false when it disables it.
                  target_type:
                    type: string
                    enum:
                    - user
                    - business
                    description: Which profile family the job toggles.
                  total:
                    type: integer
                    description: Profiles the job processes.
                  processed:
                    type: integer
                    description: Profiles processed so far.
                  outcomes:
                    type: object
                    description: Per-record outcome counters. Every selected profile resolves to exactly one counter; nothing is silently skipped.
                    properties:
                      enabled:
                        type: integer
                        description: Monitoring enabled on an existing AML screening.
                      screened_and_enabled:
                        type: integer
                        description: A new AML screening was created (billed) and monitoring enabled on it.
                      already_enabled:
                        type: integer
                        description: Monitoring was already active; nothing changed and nothing was billed.
                      disabled:
                        type: integer
                        description: Monitoring turned off across every AML screening of the profile.
                      skipped_no_identity_data:
                        type: integer
                        description: 'Skipped: the profile lacks the full name, date of birth and country (users) or a name (businesses) needed to screen.'
                      skipped_blocked:
                        type: integer
                        description: 'Skipped: the user is blocked.'
                      skipped_sandbox:
                        type: integer
                        description: 'Skipped: sandbox application, no screening is created.'
                      failed_provider:
                        type: integer
                        description: The screening could not be completed; retry later.
                      failed_insufficient_balance:
                        type: integer
                        description: Balance ran out while the job was running.
                  results:
                    type: array
                    description: One entry per processed profile, in processing order. Grows while the job runs; complete once status is COMPLETED. Recorded for jobs started through the API; a job started from the Business Console reports counters only.
                    items:
                      type: object
                      properties:
                        didit_internal_id:
                          type: string
                          format: uuid
                          description: Didit internal id of the profile.
                        vendor_data:
                          type:
                          - string
                          - 'null'
                          description: Your own identifier for the profile.
                        outcome:
                          type: string
                          enum:
                          - enabled
                          - screened_and_enabled
                          - already_enabled
                          - disabled
                          - skipped_no_identity_data
                          - skipped_blocked
                          - skipped_sandbox
                          - failed_provider
                          - failed_insufficient_balance
                  error:
                    type:
                    - string
                    - 'null'
                    description: Generic failure message when status is FAILED; the detailed cause is kept on the platform side.
                  created_at:
                    type: string
                    format: date-time
                  completed_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
        '401':
          description: Missing or invalid API key.
        '404':
          description: No such job for this application.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: 'Your application''s API key, from Developers -> API keys in the Business Console. The primary key has full access. A named key can be scoped: none, read or write per resource, limited to some workflows or to approved sessions, to a list of IP addresses, and to an expiry date. 401 means the key is missing, wrong, revoked or expired; 403 means the key has no access to this resource or action, or the request came from an address outside its IP list; 404 on a session route means the session is outside the key''s workflows or statuses. A key without media access receives image, video and PDF URLs as null, and a key without sessions write receives session links and tokens as null. See https://docs.didit.me/console/api-keys.'
    TransactionTokenAuth:
      type: apiKey
      in: header
      name: X-Transaction-Token
      description: Short-lived scoped token minted by your backend via POST /v3/transactions/sdk-token/. Used by the Didit SDKs on the device-facing /v1/transactions/ endpoints.
    SessionTokenAuth:
      type: apiKey
      in: header
      name: Session-Token
      description: Short-lived token returned in the `session_token` field of POST /v3/session/. Used by the hosted verification flow (and custom sandbox UIs) to call session-scoped endpoints on behalf of the verifying user, without your server-side API key.
    BearerAuth:
      type: http
      scheme: bearer
      description: The application's client-credentials access token.
    CaseRequestToken:
      type: apiKey
      in: header
      name: X-Case-Request-Token
      description: Request-specific credential from the secure link. Grants access only to this request.
