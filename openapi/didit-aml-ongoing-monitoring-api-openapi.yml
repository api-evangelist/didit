  /v3/businesses/aml-monitoring/:
    post:
      summary: Enable or disable AML ongoing monitoring for businesses
      description: 'Turns AML ongoing monitoring on or off for the selected businesses, with the same semantics as the Business Console. Exactly one monitored AML screening is kept per business, so a profile that verified several times is monitored and billed once; disabling turns monitoring off across all of the profile''s screenings. Businesses without any AML screening are screened first (billed as a regular AML screening) when they have the legal or display name needed; otherwise they are reported as `skipped_no_identity_data`.


        Set `estimate_only: true` to preview counts and costs without writing anything. Selections of 20 profiles or fewer resolve inline and return `200` with the completed job; larger selections return `202` and run in the background - poll Get AML monitoring job with the returned `job_id`. Enabling is refused with `403` when the organization balance does not cover the estimate. Identifiers that match nothing are listed in `unmatched` and never fail the request: a selection that matches nothing completes as an empty job (`total` 0), the same convention as the batch delete endpoints.'
      operationId: toggle_businesses_aml_monitoring
      tags:
      - AML Ongoing Monitoring
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - is_enabled
              description: Select businesses with `vendor_data_list`, `didit_internal_id_list`, or both (the two lists are OR'd). At most 1000 identifiers per request across both lists.
              properties:
                is_enabled:
                  type: boolean
                  description: true to enable monitoring, false to disable it.
                estimate_only:
                  type: boolean
                  default: false
                  description: When true, returns the cost estimate and performs no writes - no screening, no billing, no job.
                vendor_data_list:
                  type: array
                  items:
                    type: string
                  description: Your own identifiers of the businesses to toggle, matched exactly as sent.
                didit_internal_id_list:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Didit internal ids of the businesses to toggle - the `didit_internal_id` returned by the create, get and list endpoints.
            examples:
              Estimate first:
                summary: Preview the cost without writing
                value:
                  is_enabled: true
                  estimate_only: true
                  vendor_data_list:
                  - company-123
                  - company-456
              Enable:
