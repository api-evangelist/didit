    TravelRuleMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - MESSAGE
          - DOCUMENT_REQUEST
        direction:
          type: string
          enum:
          - INBOUND
          - OUTBOUND
          description: '`OUTBOUND` is what the reader''s own side sent. In the pickup portal the direction is from the counterparty''s side.'
        author:
          type: string
          description: 'Who wrote it on its own side: a console user''s email or an API key label, or the other VASP''s name.'
        body:
          type: string
        requested_documents:
          type: array
          items:
            type: string
          description: What a DOCUMENT_REQUEST asks for, in the requester's words.
        reply_to:
          type:
          - string
          - 'null'
          format: uuid
        fulfilled_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Set on a DOCUMENT_REQUEST once a reply to it carries a document.
        attachment:
          $ref: '#/components/schemas/TravelRuleMessageAttachment'
        created_at:
          type: string
          format: date-time
    TravelRuleCounterpartyQuestionnaireRequest:
      type: object
      properties:
        sent_to:
          type: string
          format: email
          description: 'Optional. A compliance address on record for the counterparty: for a directory entry its compliance address or a contact your application sees, for a Didit network member its confirmed compliance email. Default: the address a Travel Rule email to the counterparty goes to (your own contact first, then a platform contact, then the entry''s compliance address).'
    TravelRuleCounterpartyScreeningStatus:
      type: object
      properties:
        enabled:
          type: boolean
          description: Your counterparty_screening_enabled Travel Rule setting. Off by default; nothing is screened or billed while it is off.
        price:
          type: string
          description: 'Decimal string, in USD: what one screening costs your organization, the Company AML Screening price.'
        fresh_days:
          type: integer
          description: How many days a screening stays fresh and is reused.
        screening:
          allOf:
          - $ref: '#/components/schemas/TravelRuleCounterpartyScreening'
          description: Your latest screening of the counterparty. Null when you never screened it.
    WalletAddressEntryCreate:
      type: object
      required:
      - address
      properties:
        address:
          type: string
          maxLength: 128
        chain:
          type: string
          maxLength: 32
          description: Chain token for the address, for example `ETH` or `BTC`. When Didit routes or registers a transfer, it matches address book entries on the wallet address and, when the transfer carries a chain, on this value too, ignoring case. A transfer's chain is `beneficiary_data.chain`, filled from the transaction's crypto chain or currency symbol (for example `ETH`) when you do not send it, or the `chain` of an after-deposit registration, so use the same token everywhere. An entry with an empty chain matches any chain.
        holder_vendor_data:
          type: string
          maxLength: 255
        holder_name:
          type: string
          maxLength: 255
        entity_type:
          type: string
          default: individual
          maxLength: 16
        self_declared:
          type: boolean
          default: false
          description: Write-only. When true, the entry is created already ownership-verified via a SELF_DECLARATION proof. Returns 400 when `allow_self_declaration` is off in your Travel Rule settings.
        travel_address:
          type: string
          description: Optional. The counterparty VASP's travel address for this wallet, enabling TRP routing for BTC and ETH transfers. An invalid travel address returns 400.
          maxLength: 512
    TravelRuleCounterpartyDecisionRequest:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - RESTRICTED
          - BLOCKED
        reason:
          type: string
          maxLength: 255
          description: Optional. Replaces the previous reason; omit it to clear it.
    TravelRuleCounterpartyScreeningResult:
      type: object
      properties:
        outcome:
          type: string
          enum:
          - screened
          - reused
          description: 'screened: a new screening ran and was billed (201). reused: a fresh screening was returned and nothing was billed (200).'
        screening:
          $ref: '#/components/schemas/TravelRuleCounterpartyScreening'
    WalletAddressEntryUpdate:
      type: object
      properties:
        holder_name:
          type: string
          maxLength: 255
        holder_vendor_data:
          type: string
          maxLength: 255
        entity_type:
          type: string
          maxLength: 16
        travel_address:
          type: string
          maxLength: 512
      description: PATCH is a partial update; the response echoes only holder_name, holder_vendor_data, entity_type, and travel_address.
    TravelRuleDataMatch:
      type:
      - object
      - 'null'
      description: Field-by-field comparison of the transfer's party data with what the other side knows about the wallet holder. It names fields and results, never values, so it stays readable while the counterparty's data is masked. Null until a comparison ran.
      properties:
        matched:
          type: boolean
          description: True when no compared field differs.
        mismatched_fields:
          type: array
          items:
            type: string
            enum:
            - name
            - date_of_birth
            - address
            - account
          description: The fields that differ.
        fields:
          type: object
          description: One entry per field compared for the party's entity type (`name`, `date_of_birth`, `address`, `account`; a company has no `date_of_birth`).
          additionalProperties:
            type: object
            properties:
              result:
                type: string
                enum:
                - matched
                - mismatched
                - not_compared
                description: '`not_compared` when the rule is `NONE` or either side has no value for the field.'
              strictness:
                type: string
                enum:
                - NONE
                - STRICT
                - CONTAINS
                - DEFAULT
                - FUZZY
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: 'Your application''s API key, from Developers -> API keys in the Business Console. The primary key has full access. A named key can be scoped: none, read or write per resource, limited to some workflows or to approved sessions, to a list of IP addresses, and to an expiry date. 401 means the key is missing, wrong, revoked or expired; 403 means the key has no access to this resource or action, or the request came from an address outside its IP list; 404 on a session route means the session is outside the key''s workflows or statuses. A key without media access receives image, video and PDF URLs as null, and a key without sessions write receives session links and tokens as null. See https://docs.didit.me/console/api-keys.'
    TransactionTokenAuth:
      type: apiKey
      in: header
      name: X-Transaction-Token
      description: Short-lived scoped token minted by your backend via POST /v3/transactions/sdk-token/. Used by the Didit SDKs on the device-facing /v1/transactions/ endpoints.
    SessionTokenAuth:
      type: apiKey
      in: header
      name: Session-Token
      description: Short-lived token returned in the `session_token` field of POST /v3/session/. Used by the hosted verification flow (and custom sandbox UIs) to call session-scoped endpoints on behalf of the verifying user, without your server-side API key.
    BearerAuth:
      type: http
      scheme: bearer
      description: The application's client-credentials access token.
    CaseRequestToken:
      type: apiKey
      in: header
      name: X-Case-Request-Token
      description: Request-specific credential from the secure link. Grants access only to this request.
