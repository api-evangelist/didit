openapi: 3.2.0
info:
  version: 3.0.0
  title: Didit Verification Travel Rule API
  description: Identity verification API. Authenticate with x-api-key header.
servers:
- url: https://verification.didit.me
tags:
- name: Travel Rule
paths:
  /v3/travel-rule/settings/:
    get:
      summary: Get Travel Rule settings
      description: Read the application's Travel Rule settings and VASP profile. Auto-creates a default (disabled) settings row and an empty profile on first read.
      operationId: getTravelRuleSettings
      tags:
      - Travel Rule
      security:
      - ApiKeyAuth: []
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X GET https://verification.didit.me/v3/travel-rule/settings/ \\\n  -H 'x-api-key: YOUR_API_KEY'"
      responses:
        '200':
          description: Current Travel Rule settings and VASP profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelRuleSettingsDetail'
              examples:
                Disabled (default):
                  value:
                    is_enabled: false
                    jurisdiction: EU
                    name_matching_strictness: DEFAULT
                    confirmation_timeout_hours: 48
                    timeout_outcome: HOLD
                    threshold_amount: '0.00'
                    inbound_auto_accept: true
                    allow_self_declaration: true
                    allow_screenshot_proof: true
                    auto_wallet_verification: true
                    vasp_attribution_enabled: true
                    legal_name: ''
                    lei: ''
                    compliance_email: ''
                    is_discoverable: true
                    counterparty_screening_enabled: false
                    sunrise_policy: ''
                    sunrise_jurisdictions:
                    - CO
                    - KH
                    - VN
                    non_responsive_policy: ''
                    travel_address: ''
                    disabled_networks: []
                    networks:
                      gtr:
                        rail: GTR
                        mode: unavailable
                        platform_available: false
                        connected: false
                      trust:
                        rail: TRUST
                        mode: unavailable
                        platform_available: false
                        connected: false
                      verifyvasp:
                        rail: VERIFYVASP
                        mode: unavailable
                        platform_available: false
                        connected: false
                      sygna:
                        rail: SYGNA
                        mode: unavailable
                        platform_available: false
                        connected: false
                    didit_network:
                      listed: false
                      missing:
                      - travel_rule_off
                      - legal_name_missing
                      - compliance_email_missing
                      compliance_email_confirmed: false
    put:
      summary: Update Travel Rule settings
      description: 'Upsert the application''s Travel Rule settings and VASP profile. Partial update — only send the fields you want to change. Setting `is_enabled: true` requires a non-blank `legal_name` (already stored or included in the same request), otherwise returns 400.'
      operationId: updateTravelRuleSettings
      tags:
      - Travel Rule
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravelRuleSettingsUpdate'
            example:
              is_enabled: true
              legal_name: Origin CASP SL
              jurisdiction: EU
              name_matching_strictness: DEFAULT
              confirmation_timeout_hours: 48
              timeout_outcome: HOLD
              is_discoverable: true
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X PUT https://verification.didit.me/v3/travel-rule/settings/ \\\n  -H 'x-api-key: YOUR_API_KEY' -H 'Content-Type: application/json' \\\n  -d '{\"is_enabled\": true, \"legal_name\": \"Origin CASP SL\", \"jurisdiction\": \"EU\"}'"
      responses:
        '200':
          description: Updated settings and profile, in the same shape as GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelRuleSettingsDetail'
        '400':
          description: Validation error, e.g. enabling without a legal_name, a sunrise_policy or non_responsive_policy other than HOLD, REJECT, PROCEED or empty, an unknown field in `matching_rules`, or a `data_sharing_fields` choice that cannot meet the originator obligations of your jurisdiction's regime (the errors are keyed by entity type under `data_sharing_fields`).
          content:
            application/json:
              schema:
                type: object
              example:
                legal_name:
                - legal_name is required to enable travel rule.
  /v3/travel-rule/settings/compliance-email/confirmation/:
    post:
      summary: Send the compliance email confirmation
      description: Emails a single-use confirmation link to your VASP profile's compliance_email. Opening the link and pressing its confirm button confirms the address, which the Didit network needs before it lists your profile. A new request replaces the previous link; the link stops working when the compliance email changes. One email per minute per address.
      operationId: sendTravelRuleComplianceEmailConfirmation
      x-didit-sdk:
        resource: travel_rule
        method: send_compliance_email_confirmation
        auth: api_key
        server: true
      tags:
      - Travel Rule
      security:
      - ApiKeyAuth: []
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X POST https://verification.didit.me/v3/travel-rule/settings/compliance-email/confirmation/ \\\n  -H 'x-api-key: YOUR_API_KEY'"
      responses:
        '202':
          description: The confirmation email was sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent_to:
                    type: string
                    format: email
              example:
                sent_to: compliance@your-vasp.example
        '400':
          description: No compliance email is set, or it is already confirmed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              examples:
                No compliance email:
                  value:
                    compliance_email:
                    - Set a compliance email before confirming it.
                Already confirmed:
                  value:
                    compliance_email:
                    - This compliance email is already confirmed.
        '429':
          description: A confirmation went to this address less than a minute ago.
        '503':
          description: The email could not be sent. Nothing changed; try again in a moment.
  /v3/travel-rule/wallet-addresses/:
    get:
      summary: List wallet address book entries
      description: Paginated list of your application's Travel Rule wallet address book, newest first.
      operationId: listTravelRuleWalletAddresses
      tags:
      - Travel Rule
      security:
      - ApiKeyAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          minimum: 1
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X GET https://verification.didit.me/v3/travel-rule/wallet-addresses/ \\\n  -H 'x-api-key: YOUR_API_KEY'"
      responses:
        '200':
          description: Paginated wallet address book entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                  previous:
                    type:
                    - string
                    - 'null'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/WalletAddressEntry'
    post:
      summary: Register a wallet address
      description: Add an entry to your Travel Rule wallet address book so inbound INTERNAL-rail transfers can resolve against it.
      operationId: createTravelRuleWalletAddress
      tags:
      - Travel Rule
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletAddressEntryCreate'
            example:
              address: 0xBeneficiaryWallet01
              chain: ETH
              holder_name: Ana Diaz
              holder_vendor_data: user-042
              self_declared: true
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X POST https://verification.didit.me/v3/travel-rule/wallet-addresses/ \\\n  -H 'x-api-key: YOUR_API_KEY' -H 'Content-Type: application/json' \\\n  -d '{\"address\": \"0xBeneficiaryWallet01\", \"chain\": \"ETH\", \"holder_name\": \"Ana Diaz\", \"self_declared\": true}'"
      responses:
        '201':
          description: The created entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletAddressEntry'
        '400':
          description: 'Duplicate address for this application and chain, a missing `address`, an invalid `travel_address`, `self_declared: true` while `allow_self_declaration` is off, or `self_declared: true` while `ownership_validation_mode` is `FULL`.'
          content:
            application/json:
              schema:
                type: object
              examples:
                Duplicate entry:
                  value:
                    address:
                    - A wallet address entry with this address and chain already exists.
                Invalid travel address:
                  value:
                    travel_address:
                    - Invalid travel address.
                Self-declaration disabled:
                  value:
                    self_declared:
                    - Self-declared ownership is disabled for this application.
  /v3/travel-rule/wallet-addresses/{entry_uuid}/:
    patch:
      summary: Update wallet address holder metadata
      description: Partial update of holder_name, holder_vendor_data, entity_type, and travel_address. Setting travel_address attaches a TRP routing address to the entry; invalid values are rejected with 400. The response echoes only these four fields.
      operationId: updateTravelRuleWalletAddress
      tags:
      - Travel Rule
      security:
      - ApiKeyAuth: []
      parameters:
      - name: entry_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletAddressEntryUpdate'
            example:
              holder_name: Ana Updated
              travel_address: ta2ih1MicegQ3JqiKz9xT89KsSuwaDJYw8DgzmeSEp1h9tduJcNDZ5SgKLEHeyGMcS1s2HgbM6undFrMQknhM5aTXw3G9KBzi16hx
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X PATCH https://verification.didit.me/v3/travel-rule/wallet-addresses/{entry_uuid}/ \\\n  -H 'x-api-key: YOUR_API_KEY' -H 'Content-Type: application/json' \\\n  -d '{\"holder_name\": \"Ana Updated\", \"travel_address\": \"ta2ih1MicegQ3JqiKz9xT89KsSuwaDJYw8DgzmeSEp1h9tduJcNDZ5SgKLEHeyGMcS1s2HgbM6undFrMQknhM5aTXw3G9KBzi16hx\"}'"
      responses:
        '200':
          description: The updated fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletAddressEntryUpdate'
        '400':
          description: '`travel_address` is not a valid travel address.'
          content:
            application/json:
              examples:
                Invalid travel address:
                  value:
                    travel_address:
                    - Invalid travel address.
        '404':
          description: Unknown or deleted entry.
    delete:
      summary: Delete a wallet address
      description: Deletes the entry. It stops matching new transfers immediately and the address is freed up for re-registration.
      operationId: deleteTravelRuleWalletAddress
      tags:
      - Travel Rule
      security:
      - ApiKeyAuth: []
      parameters:
      - name: entry_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X DELETE https://verification.didit.me/v3/travel-rule/wallet-addresses/{entry_uuid}/ \\\n  -H 'x-api-key: YOUR_API_KEY'"
      responses:
        '204':
          description: Deleted.
        '404':
          description: Unknown or already deleted entry.
  /v3/travel-rule/vasps/:
    get:
      summary: Search the VASP directory
      description: 'Paginated, name-sorted search of the VASP directory: the shared directory entries, which Didit builds from the ESMA interim MiCA register, the public TRISA directory, the global LEI register and its own curation, plus the members of the Didit network. Each row carries the routes your application has to it today. Your own application''s profile is never listed. Rows also carry the shared due-diligence assessment and your application''s own decision, entity screening and questionnaires.'
      operationId: listTravelRuleVasps
      tags:
      - Travel Rule
      security:
      - ApiKeyAuth: []
      parameters:
      - name: search
        in: query
        schema:
          type: string
          maxLength: 255
        description: A name or alias fragment (case-insensitive), an exact LEI, or a domain (example.com or a URL on it). Didit network members match on their legal name, LEI or the domain of their compliance email.
      - name: network
        in: query
        schema:
          type: string
          enum:
          - GTR
          - TRUST
          - VERIFYVASP
          - SYGNA
          - TRISA
        description: Only directory entries a network's member directory currently lists.
      - name: jurisdiction
        in: query
        schema:
          type: string
        description: ISO 3166 alpha-2 or alpha-3 country code. 400 for anything else.
      - name: reachable
        in: query
        schema:
          type: boolean
        description: 'true: only VASPs your application has an available route to (Didit network members included). false: only directory entries it cannot reach today.'
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - directory
          - didit
        description: Only directory entries, or only Didit network members.
      - name: risk
        in: query
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        description: Only directory entries whose risk_level is this band. Didit network members, which are not scored, never match.
      - name: responsiveness
        in: query
        schema:
          type: string
          enum:
          - RESPONSIVE
          - UNRESPONSIVE
          - UNKNOWN
        description: Only directory entries whose responsiveness.status is this value. Didit network members never match.
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          minimum: 1
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X GET 'https://verification.didit.me/v3/travel-rule/vasps/?search=counterparty&reachable=true' \\\n  -H 'x-api-key: YOUR_API_KEY'"
      responses:
        '200':
          description: Paginated, name-sorted VASP directory results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                  previous:
                    type:
                    - string
                    - 'null'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/VaspDirectoryEntry'
        '400':
          description: 'A filter is not valid: the body names each field, for example an unknown network, country code, risk band or responsiveness status.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              example:
                jurisdiction:
                - Use an ISO 3166 alpha-2 or alpha-3 country code.
                network:
                - '"SWIFT" is not a valid choice.'
      x-didit-sdk:
        resource: travel_rule
        method: list_vasps
        auth: api_key
        server: true
  /v3/travel-rule/vasps/{vasp_id}/:
    get:
      summary: Get a VASP directory entry
      description: One directory entry or Didit network member by the id the search returned, with the same fields and the routes your application has to it.
      operationId: getTravelRuleVasp
      x-didit-sdk:
        resource: travel_rule
        method: retrieve_vasp
        auth: api_key
        server: true
      tags:
      - Travel Rule
      security:
      - ApiKeyAuth: []
      parameters:
      - name: vasp_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The id of a row of GET /v3/travel-rule/vasps/.
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X GET https://verification.didit.me/v3/travel-rule/vasps/{vasp_id}/ \\\n  -H 'x-api-key: YOUR_API_KEY'"
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaspDirectoryEntry'
        '404':
          description: No entry or listed Didit network member has this id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: No directory entry has this id.
  /v3/travel-rule/vasps/{vasp_id}/decision/:
    get:
      summary: Get your decision on a VASP
      description: 'Your application''s decision on a counterparty (a directory entry or a Didit network member): approved, restricted or blocked. An entity of a brand with no decision of its own follows the brand''s decision, named in inherited_from. Private to your application.'
      operationId: getTravelRuleVaspDecision
      x-didit-sdk:
        resource: travel_rule
        method: retrieve_vasp_decision
        auth: api_key
        server: true
      tags:
      - Travel Rule
      security:
      - ApiKeyAuth: []
      parameters:
      - name: vasp_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 'The id of a row of GET /v3/travel-rule/vasps/: a directory entry or a Didit network member.'
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X GET https://verification.didit.me/v3/travel-rule/vasps/{vasp_id}/decision/ \\\n  -H 'x-api-key: YOUR_API_KEY'"
      responses:
        '200':
          description: The decision that applies, or null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelRuleCounterpartyDecisionResponse'
              examples:
                Own decision:
                  value:
                    decision:
                      decision: APPROVED
                      reason: Licensed in DE, questionnaire reviewed
                      decided_by: ''
                      updated_at: '2026-10-14T10:05:00Z'
                      inherited_from: null
                Inherited from the brand:
                  value:
                    decision:
                      decision: BLOCKED
                      reason: Group refused after review
                      decided_by: ''
                      updated_at: '2026-10-14T10:05:00Z'
                      inherited_from:
                        id: 5e4d3c2b-1a0f-4e9d-8c7b-6a5f4e3d2c1b
                        name: Example Group
                No decision:
                  value:
                    decision: null
        '404':
          description: No directory entry or listed Didit network member has this id. Your own VASP profile is never a counterparty of yours.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: No directory entry or Didit network member has this id.
    put:
      summary: Set your decision on a VASP
      description: 'Make or change your application''s decision on a counterparty: APPROVED, RESTRICTED or BLOCKED, with an optional reason. It never changes the shared directory entry and acts only through your transaction rules (counterparty_dd_status). A decision on a brand also covers each of its entities that has no decision of its own.'
      operationId: updateTravelRuleVaspDecision
      x-didit-sdk:
        resource: travel_rule
        method: update_vasp_decision
        auth: api_key
        server: true
      tags:
      - Travel Rule
      security:
      - ApiKeyAuth: []
      parameters:
      - name: vasp_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 'The id of a row of GET /v3/travel-rule/vasps/: a directory entry or a Didit network member.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravelRuleCounterpartyDecisionRequest'
            example:
              decision: BLOCKED
              reason: Unlicensed in its home jurisdiction
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X PUT https://verification.didit.me/v3/travel-rule/vasps/{vasp_id}/decision/ \\\n  -H 'x-api-key: YOUR_API_KEY' -H 'Content-Type: application/json' \\\n  -d '{\"decision\": \"BLOCKED\", \"reason\": \"Unlicensed in its home jurisdiction\"}'"
      responses:
        '200':
          description: The decision as it now applies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelRuleCounterpartyDecisionResponse'
              example:
                decision:
                  decision: BLOCKED
                  reason: Unlicensed in its home jurisdiction
                  decided_by: ''
                  updated_at: '2026-10-14T10:05:00Z'
                  inherited_from: null
        '400':
          description: The decision is missing or not one of APPROVED, RESTRICTED or BLOCKED, or the reason is longer than 255 characters.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              example:
                decision:
                - '"MAYBE" is not a valid choice.'
        '404':
          description: No directory entry or listed Didit network member has this id. Your own VASP profile is never a counterparty of yours.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: No directory entry or Didit network member has this id.
    delete:
      summary: Clear your decision on a VASP
      description: 'Clear your application''s own decision on a counterparty. The response shows the decision that applies afterwards: null, or for an entity of a brand the brand''s decision, which the entity follows again.'
      operationId: clearTravelRuleVaspDecision
      x-didit-sdk:
        resource: travel_rule
        method: clear_vasp_decision
        auth: api_key
        server: true
      tags:
      - Travel Rule
      security:
      - ApiKeyAuth: []
      parameters:
      - name: vasp_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 'The id of a row of GET /v3/travel-rule/vasps/: a directory entry or a Didit network member.'
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X DELETE https://verification.didit.me/v3/travel-rule/vasps/{vasp_id}/decision/ \\\n  -H 'x-api-key: YOUR_API_KEY'"
      responses:
        '200':
          description: The decision cleared; the body shows the decision that applies now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelRuleCounterpartyDecisionResponse'
              example:
                decision: null
        '404':
          description: 'No counterparty has this id, or your application has no decision of its own on it (a decision it only inherits from its brand cannot be cleared here: clear the brand''s).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              examples:
                Unknown id:
                  value:
                    detail: No directory entry or Didit network member has this id.
                No decision of its own:
                  value:
                    detail: This application has no decision of its own on this counterparty.
  /v3/travel-rule/vasps/{vasp_id}/screening/:
    get:
      summary: Get a VASP's entity screening
      description: Whether counterparty screening is on for your application, what one screening costs your organization, how long a result stays fresh, and your latest sanctions and adverse-media screening of the counterparty. Reading it is free.
      operationId: getTravelRuleVaspScreening
      x-didit-sdk:
        resource: travel_rule
        method: retrieve_vasp_screening
        auth: api_key
        server: true
      tags:
      - Travel Rule
      security:
      - ApiKeyAuth: []
      parameters:
      - name: vasp_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 'The id of a row of GET /v3/travel-rule/vasps/: a directory entry or a Didit network member.'
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X GET https://verification.didit.me/v3/travel-rule/vasps/{vasp_id}/screening/ \\\n  -H 'x-api-key: YOUR_API_KEY'"
      responses:
        '200':
          description: Your screening setting, its price and your latest screening.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelRuleCounterpartyScreeningStatus'
              example:
                enabled: true
                price: '0.20'
                fresh_days: 30
                screening:
                  id: 7a1d2c3b-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                  status: Approved
                  total_hits: 0
                  score: null
                  screened_at: '2026-10-14T09:58:00Z'
                  fresh: true
                  flagged: false
        '403':
          description: Your organization's contract has no rate configured for counterparty screening.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: No contract rate is configured for this usage type.
        '404':
          description: No directory entry or listed Didit network member has this id. Your own VASP profile is never a counterparty of yours.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: No directory entry or Didit network member has this id.
    post:
      summary: Screen a VASP
      description: 'Screen the counterparty entity against sanctions and adverse media for your application. Opt-in: counterparty_screening_enabled must be on in your Travel Rule settings. Each new screening is billed at your organization''s Company AML Screening price; a screening younger than 30 days is returned instead (200, not billed) unless you send refresh: true. One screening of a counterparty runs at a time per application. The result is private to your application. Sandbox applications are never screened.'
      operationId: screenTravelRuleVasp
      x-didit-sdk:
        resource: travel_rule
        method: screen_vasp
        auth: api_key
        server: true
      tags:
      - Travel Rule
      security:
