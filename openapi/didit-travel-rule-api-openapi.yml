                  value:
                    detail: A screening of this counterparty is already running. Try again in a moment.
        '502':
          description: The screening could not be completed. Nothing was billed; try again in a moment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: The screening provider did not answer. Try again in a moment.
