  /v3/transactions/{transaction_id}/travel-rule/:
    patch:
      summary: Finish, cancel, or resend a Travel Rule transfer
      description: 'Provide `payment_txn_id` to report the on-chain hash and move an outbound COMPLETED transfer to FINISHED (its INTERNAL-rail counterpart also moves to FINISHED), `{"action": "cancel"}` to cancel a non-terminal transfer, or `{"action": "resend"}` to re-run routing for an outbound transfer stuck in COUNTERPARTY_VASP_NOT_FOUND, COUNTERPARTY_VASP_NOT_REACHABLE, or NOT_ENOUGH_COUNTERPARTY_DATA (improve the counterparty data first, e.g. add a travel_address to the destination wallet entry). resend applies to outbound transfers only.'
      operationId: patchTravelRuleTransfer
      tags:
      - Travel Rule
      security:
      - ApiKeyAuth: []
      parameters:
      - name: transaction_id
        in: path
        required: true
        description: Didit-stable transaction UUID that owns the transfer.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravelRuleTransferPatchRequest'
            examples:
              Finish:
                value:
                  payment_txn_id: 0xchainhash
              Cancel:
                value:
                  action: cancel
              Resend:
                value:
                  action: resend
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X PATCH https://verification.didit.me/v3/transactions/{transaction_id}/travel-rule/ \\\n  -H 'x-api-key: YOUR_API_KEY' -H 'Content-Type: application/json' \\\n  -d '{\"payment_txn_id\": \"0xchainhash\"}'"
      responses:
        '200':
          description: The updated transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelRuleTransferDetail'
        '400':
          description: Neither payment_txn_id nor a supported action (cancel, resend) was provided.
          content:
            application/json:
              examples:
                No action:
                  value:
                    detail:
                    - Provide payment_txn_id, action=cancel or action=resend.
        '404':
          description: Unknown transaction, or the transaction has no Travel Rule transfer.
        '409':
          description: The transfer is not in a state that allows this operation (e.g. not COMPLETED/outbound for finish, already terminal for cancel, or not an outbound transfer in a resendable status for resend).
          content:
            application/json:
              examples:
                Cancel from a terminal status:
                  value:
                    detail: Transfer is already in a terminal state.
                Resend not allowed:
                  value:
                    detail: Transfer cannot be resent from its current state.
                Finish not allowed:
                  value:
                    detail: Transfer must be an outbound transfer in COMPLETED status to finish.
  /v3/transactions/{transaction_id}/travel-rule/ownership/:
    post:
      summary: Confirm or deny wallet ownership
      description: 'Resolve a transfer that waits on wallet ownership: call it on your own side of the transfer when it is UNCONFIRMED_OWNERSHIP, or when it is an inbound transfer in ON_HOLD. Confirming marks the matching wallet address book entry as ownership-verified (for an inbound ON_HOLD transfer with no entry, Didit creates one from beneficiary_data.wallet_address) and runs the beneficiary name match on both sides of the transfer; denying declines both sides. An inbound transfer whose deposit already settled moves on to FINISHED when the match succeeds. For an inbound TRP transfer in UNCONFIRMED_OWNERSHIP, ON_HOLD or COUNTERPARTY_MISMATCHED_DATA, Didit sends your decision to the originating VASP instead: approving returns the payment address (wallet_address, or the matched entry''s address) and moves the transfer to COMPLETED, and denying declines it.'
      operationId: confirmTravelRuleOwnership
      tags:
      - Travel Rule
      security:
      - ApiKeyAuth: []
      parameters:
      - name: transaction_id
        in: path
        required: true
        description: Didit-stable transaction UUID that owns the transfer (the beneficiary side's transaction).
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravelRuleOwnershipConfirmRequest'
            example:
              confirmed: true
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X POST https://verification.didit.me/v3/transactions/{transaction_id}/travel-rule/ownership/ \\\n  -H 'x-api-key: YOUR_API_KEY' -H 'Content-Type: application/json' \\\n  -d '{\"confirmed\": true}'"
      responses:
        '200':
          description: 'The updated transfer. For an inbound transfer the counterparty''s originator_data/beneficiary_data stay masked (`data_masked: true`) until ownership is confirmed, then `data_unmasked` records when, why and by whom.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelRuleTransferDetail'
        '400':
          description: 'Validation error: confirmed is missing, or an inbound TRP approval has no wallet_address and no address to fall back on.'
          content:
            application/json:
              examples:
                No payment address:
                  value:
                    wallet_address:
                    - wallet_address is required to approve.
        '404':
          description: Unknown transaction, or the transaction has no Travel Rule transfer.
        '409':
          description: The transfer is not waiting on ownership confirmation, no wallet address book entry matches its counterparty wallet, or an INTERNAL transfer from another Didit customer needs a control proof (a signed message or a test deposit) before it can be confirmed.
          content:
            application/json:
              examples:
                Not awaiting confirmation:
                  value:
                    detail: Transfer is not awaiting ownership confirmation.
                No matching address book entry:
                  value:
                    detail: wallet address entry no longer available
        '502':
          description: 'Inbound TRP transfer only: Didit could not deliver your decision to the originating VASP, so the transfer status does not change.'
          content:
            application/json:
              examples:
                Callback not delivered:
                  value:
                    detail: Counterparty inquiry-resolution callback could not be delivered.
