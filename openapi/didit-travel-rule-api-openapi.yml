          application/json:
            schema:
              $ref: '#/components/schemas/TravelRuleInboundRequest'
            example:
              chain: ETH
              txid: 0xdeposit-hash
              wallet_address: 0xYourDepositWallet
              amount: '500.00'
              currency: USDC
              originator_data:
                name: Origin CASP SL
              beneficiary_data:
                name: Ana Diaz
              originating_vasp:
                name: Origin CASP SL
                lei: ''
                travel_address: ta9JbXbsBSuS5ozArJRFVgvBHMVnDGUnrPPChSZYQsuZTn3kPrJXUQ7RSLUEJ5KjyPvr8C9sAxmPtZfGsQVKCi4n8ShxP9BkbDdbtjtA9aumNybAZ1BxC
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X POST https://verification.didit.me/v3/travel-rule/inbound/ \\\n  -H 'x-api-key: YOUR_API_KEY' -H 'Content-Type: application/json' \\\n  -d '{\"chain\":\"ETH\",\"txid\":\"0xdeposit-hash\",\"wallet_address\":\"0xYourDepositWallet\",\"amount\":\"500.00\",\"currency\":\"USDC\"}'"
      responses:
        '200':
          description: A transfer for this txid and wallet_address was already registered; the existing one is returned unchanged (created is false).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelRuleInboundResponse'
        '201':
          description: A new Travel Rule transfer was registered, on a new inbound transaction or on an existing unclaimed deposit (created is true).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelRuleInboundResponse'
        '400':
          description: A required field (`chain`, `txid`, `wallet_address`, `amount`, `currency`) is missing, `originating_vasp.lei` is not a valid LEI, or `originating_vasp.travel_address` is not a valid travel address.
          content:
            application/json:
              examples:
                Missing field:
                  value:
                    txid:
                    - This field is required.
                Invalid LEI:
                  value:
                    originating_vasp:
                      lei:
                      - 'Invalid LEI: expected 20 alphanumeric characters (ISO 17442).'
  /v3/travel-rule/widget-session/:
    post:
      summary: Mint a wallet-ownership widget session
      description: Mint a hosted wallet-ownership widget URL/token. Send the customer to the returned url to prove control of a wallet (message signing, Satoshi test, screenshot, or self-declaration). The widget is web-only in this release - open the url in the system browser or a custom tab, never inside a mobile SDK webview.
      operationId: createTravelRuleWidgetSession
      tags:
      - Travel Rule
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravelRuleWidgetSessionCreate'
            example:
              wallet_address: '0xd3b62acb76fb27a7f8961ec40fa11746b113aca9'
              chain: ETH
              holder_name: Jane Doe
              vendor_data: user-042
              transaction_id: 99999999-aaaa-bbbb-cccc-dddddddddddd
              expires_in_minutes: 60
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X POST https://verification.didit.me/v3/travel-rule/widget-session/ \\\n  -H 'x-api-key: YOUR_API_KEY' -H 'Content-Type: application/json' \\\n  -d '{\"wallet_address\":\"0xd3b62acb76fb27a7f8961ec40fa11746b113aca9\",\"chain\":\"ETH\",\"holder_name\":\"Jane Doe\",\"transaction_id\":\"99999999-aaaa-bbbb-cccc-dddddddddddd\"}'"
      responses:
        '201':
          description: The minted widget session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelRuleWidgetSessionResponse'
        '400':
          description: 'Invalid body: `callback_url` is not an absolute http(s) URL, `expires_in_minutes` is outside 5 to 10080, `transaction_id` is not a UUID, or a field is longer than its limit.'
          content:
            application/json:
              examples:
                Invalid callback_url:
                  value:
                    callback_url:
                    - callback_url must be an absolute http(s) URL.
        '404':
          description: '`transaction_id` does not name a Travel Rule transfer in this application.'
  /v3/travel-rule/widget/{token}/:
    get:
      summary: Get wallet-ownership widget context
      description: 'Public read endpoint keyed by the widget session token - no API key required. Returns the widget context plus the status of every proof, so you can poll it to detect completion; completed_at becomes non-null once a proof is verified. A SATOSHI_TEST proof can sit at status PENDING while its deposit is seen on-chain but unconfirmed - a background job automatically rechecks it and completes it once the deposit confirms, so no client action is needed while it waits. Each proof carries the fields its method needs: deposit_address, expected_amount, and its own expires_at for SATOSHI_TEST; challenge for MESSAGE_SIGNING. Prefer the travel_rule.status.updated webhook over polling when the session is linked to a transfer.'
      operationId: getTravelRuleWidgetContext
      tags:
      - Travel Rule
      security: []
      parameters:
      - name: token
        in: path
        required: true
        description: Opaque session token returned when the widget session was minted.
        schema:
          type: string
      x-codeSamples:
      - lang: curl
        label: curl
        source: curl https://verification.didit.me/v3/travel-rule/widget/{token}/
      responses:
        '200':
          description: The widget context and proof statuses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelRuleWidgetContext'
        '404':
          description: Unknown token.
        '410':
          description: The session expired without completing.
  /v3/travel-rule/widget/{token}/vasps/:
    get:
      summary: Search VASPs from the wallet widget
      description: 'Public read endpoint keyed by the widget session token, no API key required: the VASP picker of the end user''s widget. Same search and filters as GET /v3/travel-rule/vasps/ for the widget''s application, answering only who each VASP is and whether it can be reached.'
      operationId: listTravelRuleWidgetVasps
      x-didit-sdk:
        resource: travel_rule
        method: list_widget_vasps
        auth: public
        server: false
      tags:
      - Travel Rule
      security: []
      parameters:
      - name: token
        in: path
        required: true
        description: Opaque session token returned when the widget session was minted.
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
          maxLength: 255
        description: A name or alias fragment (case-insensitive), an exact LEI, or a domain (example.com or a URL on it). Didit network members match on their legal name, LEI or the domain of their compliance email.
      - name: network
        in: query
        schema:
          type: string
          enum:
          - GTR
          - TRUST
          - VERIFYVASP
          - SYGNA
          - TRISA
        description: Only directory entries a network's member directory currently lists.
      - name: jurisdiction
        in: query
        schema:
          type: string
        description: ISO 3166 alpha-2 or alpha-3 country code. 400 for anything else.
      - name: reachable
        in: query
        schema:
          type: boolean
        description: 'true: only VASPs your application has an available route to (Didit network members included). false: only directory entries it cannot reach today.'
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - directory
          - didit
        description: Only directory entries, or only Didit network members.
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          minimum: 1
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      x-codeSamples:
      - lang: curl
        label: curl
        source: curl 'https://verification.didit.me/v3/travel-rule/widget/{token}/vasps/?search=counterparty'
      responses:
        '200':
          description: Paginated, name-sorted results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                  previous:
                    type:
                    - string
                    - 'null'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/VaspDirectoryWidgetEntry'
        '400':
          description: 'A filter is not valid: the body names each field, for example an unknown network or country code.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              example:
                jurisdiction:
                - Use an ISO 3166 alpha-2 or alpha-3 country code.
                network:
                - '"SWIFT" is not a valid choice.'
        '404':
          description: Unknown token.
        '410':
          description: The session expired.
components:
  schemas:
    TravelRuleDataUnmasked:
      type:
      - object
      - 'null'
      description: Audit record of the moment the counterparty's data was unmasked. Null while the data is still masked, and for outbound transfers.
      properties:
        at:
          type: string
          format: date-time
        reason:
          type: string
          enum:
          - ownership_confirmed
          - wallet_proof
          - address_book_match
          - own_verified_wallet
          - inquiry_approved
          description: 'What confirmed ownership: your confirmation through the console or the API, a wallet proof in the widget, a verified address-book wallet, your own verified wallet, or your approval of an inbound TRP inquiry.'
        actor:
          type: string
          description: 'Who confirmed it: the console user''s email or the API key''s label. Blank for an automatic decision.'
    TravelRuleCounterpartyDecisionResponse:
      type: object
      properties:
        decision:
          allOf:
          - $ref: '#/components/schemas/TravelRuleCounterpartyDecision'
          description: 'The decision that applies to the counterparty for your application: its own, else (for an entity of a brand) the brand''s. Null when there is none.'
    TravelRuleTransferPatchRequest:
      type: object
      description: 'Provide exactly one of: payment_txn_id (finish), action=cancel, or action=resend.'
      properties:
        payment_txn_id:
          type: string
          description: The on-chain transaction hash. Requires the transfer to be an outbound transfer in COMPLETED status.
        action:
          type: string
          enum:
          - cancel
          - resend
          description: '"cancel" cancels a non-terminal transfer. "resend" re-runs routing for an outbound transfer stuck in COUNTERPARTY_VASP_NOT_FOUND, COUNTERPARTY_VASP_NOT_REACHABLE, or NOT_ENOUGH_COUNTERPARTY_DATA.'
    TravelRuleMessageCreateRequest:
      type: object
      description: Send as JSON, or as multipart/form-data with the attachments in `files`.
      properties:
        kind:
          type: string
          enum:
          - MESSAGE
          - DOCUMENT_REQUEST
          default: MESSAGE
        body:
          type: string
          maxLength: 5000
          description: Required for a MESSAGE unless a file is attached.
        requested_documents:
          type: array
          items:
            type: string
            maxLength: 255
          maxItems: 10
          description: Required (at least one) for a DOCUMENT_REQUEST, and only allowed there.
        reply_to:
          type:
          - string
          - 'null'
          format: uuid
          description: A message of the same transfer. A reply that carries a document fulfils the document request it answers.
        files:
          type: array
          items:
            type: string
            format: binary
          maxItems: 5
          description: Multipart only. Up to 5 files of 10 MB each.
    TravelRulePickupInfo:
      type: object
      properties:
        originator_vasp_name:
          type: string
        amount:
          type: string
        currency:
          type: string
        beneficiary_wallet:
          type: string
        status:
          type: string
    TravelRuleWidgetSessionResponse:
      type: object
      properties:
        widget_session_id:
          type: string
          format: uuid
        token:
          type: string
          description: Opaque session token embedded in the widget URL.
        url:
          type: string
          description: The hosted wallet-ownership widget URL. Open it verbatim in the system browser (never inside a mobile SDK webview).
        expires_at:
          type: string
          format: date-time
    TravelRuleCounterpartyQuestionnaireList:
      type: object
      properties:
        questionnaires:
          type: array
          items:
            $ref: '#/components/schemas/TravelRuleCounterpartyQuestionnaire'
          description: Newest first.
    WalletAddressEntry:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        address:
          type: string
          description: The wallet address. Unique per application and chain, comparing the address without regard to case. After you delete an entry, you can register the same address again.
        chain:
          type: string
          description: Chain token for the address, for example `ETH` or `BTC`. When Didit routes or registers a transfer, it matches address book entries on the wallet address and, when the transfer carries a chain, on this value too, ignoring case. A transfer's chain is `beneficiary_data.chain`, filled from the transaction's crypto chain or currency symbol (for example `ETH`) when you do not send it, or the `chain` of an after-deposit registration, so use the same token everywhere. An entry with an empty chain matches any chain.
        holder_vendor_data:
          type: string
          description: Your internal identifier for the holder.
        holder_name:
          type: string
          description: Name of the wallet holder, used for the beneficiary name match.
        entity_type:
          type: string
          description: Free text, defaults to "individual".
        is_ownership_verified:
          type: boolean
          description: Read-only. Whether ownership of this address has been proven.
        created_at:
          type: string
          format: date-time
        travel_address:
          type: string
          description: The counterparty VASP's travel address for this wallet, if known. Lets Didit route this beneficiary's BTC and ETH transfers over the TRP rail.
    TravelRuleDataSharingFields:
      type: object
      description: 'The fields Didit sends to the counterparty VASP about your own users, per entity type. The `name` and the `wallet_address` are always sent, whatever the list says. An entity type you never chose shares every field. An empty list is a choice too: it shares the name and the wallet only.'
      properties:
        individual:
          type: array
          items:
            type: string
            enum:
            - name
            - wallet_address
            - address
            - national_id
            - customer_identification
            - date_of_birth
            - place_of_birth
          description: Fields shared about a natural person.
        company:
          type: array
          items:
            type: string
            enum:
            - name
            - wallet_address
            - address
            - national_id
            - customer_identification
          description: Fields shared about a legal person.
    TravelRulePickupRespondRequest:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - accept
          - decline
        beneficiary_name:
          type: string
          description: Required in practice for decision=accept; run through the originator's name_matching_strictness policy.
    TravelRuleTransferDetail:
      type: object
      description: Full transfer object returned by the ownership-confirmation and finish/cancel endpoints. While an inbound transfer's wallet ownership is unconfirmed, the counterparty's `originator_data` and `beneficiary_data` come back masked (the first letter of each word is kept; the wallet, chain and VASP routing stay readable) and `data_masked` is true.
      properties:
        uuid:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - AWAITING_COUNTERPARTY
          - ON_HOLD
          - COMPLETED
          - FINISHED
          - CANCELLED
          - EXPIRED
          - COUNTERPARTY_MISMATCHED_DATA
          - COUNTERPARTY_VASP_NOT_FOUND
          - COUNTERPARTY_VASP_NOT_REACHABLE
          - UNCONFIRMED_OWNERSHIP
          - COUNTERPARTY_VASP_GENERAL_DECLINE
          - NOT_ENOUGH_COUNTERPARTY_DATA
          - NOT_APPLICABLE
        direction:
          type: string
          enum:
          - INBOUND
          - OUTBOUND
        rail:
          type:
          - string
          - 'null'
          enum:
          - INTERNAL
          - TRP
          - GTR
          - TRUST
          - VERIFYVASP
          - SYGNA
          - EMAIL
          - null
          description: 'The rail the transfer was routed over, or null when no rail was selected (for example below the threshold, a self-hosted counterparty wallet, an after-deposit registration, a sandbox application, or no reachable counterparty). INTERNAL means both sides are Didit applications; EMAIL means the counterparty was reached by an emailed pickup link. GTR, TRUST and VERIFYVASP are send-only: Didit sends the message but does not process the counterparty''s reply, so those transfers stay AWAITING_COUNTERPARTY until they expire. SYGNA receives the counterparty''s answer through Didit''s Sygna callback. A network rail is used only when you have connected your own membership for that network.'
        protocol:
          type:
          - string
          - 'null'
        ivms_version:
          type: string
          example: ivms101.2023
        required:
          type: boolean
        ownership_confirmed:
          type:
          - boolean
          - 'null'
        deadline_at:
          type:
          - string
          - 'null'
          format: date-time
        timeline:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              at:
                type: string
                format: date-time
              detail:
                type: string
        counterparty_vasp:
          type:
          - object
          - 'null'
          properties:
            name:
              type: string
            lei:
              type: string
            dd_score:
              type: integer
              description: Due-diligence score from 0 to 100, where higher is better. Same scale as in the VASP directory.
            dd_score_breakdown:
              type: object
              description: Per-component contributions to dd_score, one object per component as in the VASP directory (jurisdiction, verification, protocol, lei, history, essentials, responsiveness), each {points, max, reason, detail}. {} until the counterparty has been assessed.
              additionalProperties:
                type: object
                properties:
                  points:
                    type: number
                    description: Points awarded for this component.
                  max:
                    type: integer
                    description: Maximum points this component can award.
                  reason:
                    type: string
                    description: Machine-readable code of the component's verdict.
                  detail:
                    type: string
                    description: Human-readable reason for the awarded points.
            dd_assessed_at:
              type:
              - string
              - 'null'
              format: date-time
              description: When the due-diligence assessment last ran. Null until the counterparty has been assessed.
        originator_data:
          type: object
          description: Originator party. For an inbound transfer the counterparty's values are masked until ownership is confirmed.
        beneficiary_data:
          type: object
          description: Beneficiary party. For an inbound transfer the counterparty's values are masked until ownership is confirmed.
        name_match:
          type:
          - object
          - 'null'
          description: The name comparison that decided the transfer (score and strictness). Null until one ran. The compared names are masked together with the parties.
        data_match:
          $ref: '#/components/schemas/TravelRuleDataMatch'
        mismatched_fields:
          type: array
          items:
            type: string
          description: Shortcut for `data_match.mismatched_fields`. Empty when nothing differs.
        data_unmasked:
          $ref: '#/components/schemas/TravelRuleDataUnmasked'
        data_masked:
          type: boolean
          description: True while the counterparty's personal data is masked in this response.
        created_at:
          type: string
          format: date-time
    TravelRuleCounterpartyDecision:
      type: object
      description: 'Your application''s decision on a counterparty VASP. Private to your application: it never changes the shared directory entry and another customer never sees it. It acts only through your transaction rules (the counterparty_dd_status rule field and the travel-rule-counterparty-blocked and travel-rule-counterparty-restricted presets); it never changes how a transfer is routed.'
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - RESTRICTED
          - BLOCKED
          description: 'APPROVED: your team cleared the counterparty. RESTRICTED: transfers to it may go ahead after review. BLOCKED: your team refused it.'
        reason:
          type: string
          maxLength: 255
          description: Free-text reason you gave, empty when none.
        decided_by:
          type: string
          description: The console user who made or last changed the decision. Empty when an API key made it.
        updated_at:
          type: string
          format: date-time
        inherited_from:
          type:
          - object
          - 'null'
          description: The brand whose decision this entity follows because you made none on the entity itself. Null when the decision is the counterparty's own.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
    TravelRuleSettingsDetail:
      type: object
      properties:
        is_enabled:
          type: boolean
          description: Whether the managed Travel Rule negotiation flow is active for outbound `travelRule` transactions on this application.
        jurisdiction:
          type: string
          maxLength: 8
          description: Your VASP's operating jurisdiction code. Default `"EU"`. Didit maps it to the regime it stamps on your Travel Rule transactions as `travel_rule_regime` (for example `EU` or an EU member code becomes `eu`), which transaction rules can key on. Other Didit customers see it as your jurisdiction in the VASP directory once the Didit network lists your profile.
        name_matching_strictness:
          type: string
          enum:
          - NONE
          - STRICT
          - CONTAINS
          - DEFAULT
          - FUZZY
          description: How strictly beneficiary names must match before a transfer can reach COMPLETED. `CONTAINS` accepts one name whose words all appear in the other.
        confirmation_timeout_hours:
          type: integer
          minimum: 1
          description: Hours an AWAITING_COUNTERPARTY transfer may remain unconfirmed before the periodic sweeper expires it. Default 48.
        timeout_outcome:
          type: string
          enum:
          - HOLD
          - REJECT
          - PROCEED
          description: What happens to the underlying transaction when a transfer expires. Default HOLD. sunrise_policy and non_responsive_policy take precedence when they apply and are set.
        threshold_amount:
          type: string
          description: Decimal string, in your application's default currency. Minimum transfer amount that triggers a managed exchange; transfers below it resolve straight to NOT_APPLICABLE. Didit compares the transaction amount converted to your default currency, or the `amount_in_default_currency` you send; when no converted amount is available, the threshold does not apply. Defaults to "0.00" (EU TFR applies no minimum amount).
        ownership_validation_mode:
          type: string
          enum:
          - FULL
          - SIMPLIFIED
          - AUTOMATED
          description: How much proof a wallet's ownership takes. `FULL` always needs a proof (signed message, test deposit or reviewed screenshot), never the end user's word. `SIMPLIFIED` accepts a self-declaration below `simplified_validation_threshold` and a proof above it. `AUTOMATED` lets the address book and earlier proofs answer on their own, self-declarations included while `allow_self_declaration` is true. Default `AUTOMATED`.
        simplified_validation_threshold:
          type: string
          description: Decimal string, default "0.00". In `SIMPLIFIED` mode a transfer below this amount (in the threshold currency) accepts a self-declaration. A transfer with no amount in that currency counts as above it.
        data_sharing_fields:
          $ref: '#/components/schemas/TravelRuleDataSharingFields'
        matching_rules:
          $ref: '#/components/schemas/TravelRuleMatchingRules'
        legal_name:
          type: string
          description: Your VASP's legal name. Required (non-blank) to set is_enabled to true.
        lei:
          type: string
          description: Your Legal Entity Identifier, surfaced in the VASP directory.
        compliance_email:
          type: string
          format: email
          description: Compliance contact email for your VASP profile. The Didit network lists your profile only once this address is confirmed through an emailed link (POST /v3/travel-rule/settings/compliance-email/confirmation/); changing it needs a new confirmation.
        is_discoverable:
          type: boolean
          description: 'Whether your VASP profile can be listed in the Didit network: found in GET /v3/travel-rule/vasps/ by other Didit customers and reached on the INTERNAL rail. Listing also needs a live application, Travel Rule on, a legal name and a confirmed compliance email; didit_network says which are missing. Default true.'
        inbound_auto_accept:
          type: boolean
          description: When true, an inbound TRP inquiry whose beneficiary wallet is a verified address-book entry with a matching name is approved automatically. When false, that inquiry waits in ON_HOLD for you to approve or deny it with the ownership endpoint. INTERNAL-rail and after-deposit transfers are not affected. Default true.
        allow_self_declaration:
          type: boolean
          description: When true, the wallet-ownership widget offers self-declaration as a fallback proof method. Default true.
        allow_screenshot_proof:
          type: boolean
          description: When true, the wallet-ownership widget offers screenshot upload as an ownership evidence method. Default true.
        auto_wallet_verification:
          type: boolean
          description: When true, submitting an outbound Travel Rule transfer that needs end-user proof of wallet control auto-mints a wallet-ownership widget session bound to the transaction and exposes it in the transaction's action_required block. Default true.
        vasp_attribution_enabled:
          type: boolean
          description: 'When true, an outbound Travel Rule transfer that no rail can route is attributed through blockchain analytics: the destination wallet is resolved to its owning VASP, the entity is recorded on the transfer and in the VASP directory, and the rails are re-run once with the attributed name. Default true.'
        counterparty_screening_enabled:
          type: boolean
          description: 'Opt-in sanctions and adverse-media screening of counterparty VASPs, billed per screening at the Company AML Screening price. When on, Didit screens the counterparty an outbound exchange reaches (reusing a screening younger than 30 days) and you can screen one with POST /v3/travel-rule/vasps/{vasp_id}/screening/. Default false: nothing is screened or billed.'
        sunrise_policy:
          type: string
          enum:
          - ''
          - HOLD
          - REJECT
          - PROCEED
          description: 'What an expired transfer does to its transaction when the counterparty is a directory entry in a jurisdiction on sunrise_jurisdictions, which does not enforce the Travel Rule yet: HOLD moves it to review, REJECT declines it, PROCEED leaves its status untouched. Empty (the default) follows timeout_outcome. Applies before non_responsive_policy.'
        sunrise_jurisdictions:
          type: array
          items:
            type: string
          readOnly: true
          description: Read-only. The countries (ISO 3166 alpha-2) Didit treats as in a Travel Rule sunrise period, where sunrise_policy applies. Currently CO, KH and VN. Any other jurisdiction, and an empty or unknown one, follows timeout_outcome.
        non_responsive_policy:
          type: string
          enum:
          - ''
          - HOLD
          - REJECT
          - PROCEED
          description: 'What an expired transfer does to its transaction when the counterparty is a directory entry whose responsiveness is UNRESPONSIVE: HOLD, REJECT or PROCEED, as for timeout_outcome. Empty (the default) follows timeout_outcome. sunrise_policy applies first when both fit.'
        travel_address:
          type: string
          description: Read-only. Your VASP's own travel address - the encoded inbound TRP inquiry endpoint other VASPs use to reach you. Empty while `is_enabled` is false.
        disabled_networks:
          type: array
          items:
            type: string
            enum:
            - GTR
            - TRUST
            - VERIFYVASP
            - SYGNA
          description: Networks opted out of platform membership. Does not disable your connected own memberships or provision unavailable networks.
          default: []
        networks:
          type: object
          readOnly: true
          description: Effective membership configuration for each network. No network, including GTR, is included by default. This is not a live health or delivery check.
          properties:
            gtr:
              type: object
              properties:
                rail:
                  type: string
                  enum:
                  - GTR
                mode:
                  type: string
                  enum:
                  - own
                  - didit
                  - 'off'
                  - unavailable
                  description: 'own: connected customer membership takes precedence; didit: configured platform membership allowed; off: platform routing disabled with no own membership; unavailable: neither membership available.'
                platform_available:
                  type: boolean
                  description: Whether platform membership is configured; not a live health check.
                connected:
                  type: boolean
                  description: Whether a connected customer membership exists. Credentials are validated locally; network validation occurs on a live exchange.
            trust:
              type: object
              properties:
                rail:
                  type: string
                  enum:
                  - TRUST
                mode:
                  type: string
                  enum:
                  - own
                  - didit
                  - 'off'
                  - unavailable
                  description: 'own: connected customer membership takes precedence; didit: configured platform membership allowed; off: platform routing disabled with no own membership; unavailable: neither membership available.'
                platform_available:
                  type: boolean
                  description: Whether platform membership is configured; not a live health check.
                connected:
                  type: boolean
                  description: Whether a connected customer membership exists. Credentials are validated locally; network validation occurs on a live exchange.
            verifyvasp:
              type: object
              properties:
                rail:
                  type: string
                  enum:
                  - VERIFYVASP
                mode:
                  type: string
                  enum:
                  - own
                  - didit
                  - 'off'
                  - unavailable
                  description: 'own: connected customer membership takes precedence; didit: configured platform membership allowed; off: platform routing disabled with no own membership; unavailable: neither membership available.'
                platform_available:
                  type: boolean
                  description: Whether platform membership is configured; not a live health check.
                connected:
                  type: boolean
                  description: Whether a connected customer membership exists. Credentials are validated locally; network validation occurs on a live exchange.
            sygna:
              type: object
              properties:
                rail:
                  type: string
                  enum:
                  - SYGNA
                mode:
                  type: string
                  enum:
                  - own
                  - didit
                  - 'off'
                  - unavailable
                  description: 'own: connected customer membership takes precedence; didit: configured platform membership allowed; off: platform routing disabled with no own membership; unavailable: neither membership available.'
                platform_available:
                  type: boolean
                  description: Whether platform membership is configured; not a live health check.
                connected:
                  type: boolean
                  description: Whether a connected customer membership exists. Credentials are validated locally; network validation occurs on a live exchange.
        didit_network:
          type: object
          readOnly: true
          description: Whether the Didit network lists your VASP profile, so other Didit customers find it in the directory and reach it on the INTERNAL rail, and each condition it still misses.
          properties:
            listed:
              type: boolean
            missing:
              type: array
              items:
                type: string
                enum:
                - travel_rule_off
                - sandbox_application
                - not_discoverable
                - legal_name_missing
                - compliance_email_missing
                - compliance_email_unconfirmed
                - excluded_by_staff
                - internal_organization
              description: 'Empty when listed. compliance_email_unconfirmed: send the confirmation with POST /v3/travel-rule/settings/compliance-email/confirmation/ and open the emailed link. excluded_by_staff: Didit marked the application as a test, demo or internal one.'
            compliance_email_confirmed:
              type: boolean
              description: Whether the current compliance_email was confirmed through the emailed link.
    TravelRuleSettingsUpdate:
      type: object
      properties:
        is_enabled:
          type: boolean
        legal_name:
          type: string
          maxLength: 255
        lei:
          type: string
          maxLength: 20
        jurisdiction:
          type: string
          maxLength: 8
        name_matching_strictness:
          type: string
          enum:
          - NONE
          - STRICT
          - CONTAINS
          - DEFAULT
          - FUZZY
          description: '`CONTAINS` accepts one name whose words all appear in the other.'
        confirmation_timeout_hours:
          type: integer
          minimum: 1
        timeout_outcome:
          type: string
          enum:
          - HOLD
          - REJECT
          - PROCEED
        compliance_email:
          type: string
          format: email
          description: Compliance contact email for your VASP profile. The Didit network lists your profile only once this address is confirmed through an emailed link (POST /v3/travel-rule/settings/compliance-email/confirmation/); changing it needs a new confirmation.
        is_discoverable:
          type: boolean
          description: 'Whether your VASP profile can be listed in the Didit network: found in GET /v3/travel-rule/vasps/ by other Didit customers and reached on the INTERNAL rail. Listing also needs a live application, Travel Rule on, a legal name and a confirmed compliance email; didit_network says which are missing. Default true.'
        threshold_amount:
          type: string
          description: Decimal string, zero or greater, in your application's default currency. Minimum transfer amount that triggers a managed exchange.
        ownership_validation_mode:
          type: string
          enum:
          - FULL
          - SIMPLIFIED
          - AUTOMATED
          description: See the response field of the same name.
        simplified_validation_threshold:
          type: string
          description: Decimal string, 0 or more.
        data_sharing_fields:
          allOf:
          - $ref: '#/components/schemas/TravelRuleDataSharingFields'
          description: 'Merged per entity type: an entity type you leave out keeps its current choice. A choice that cannot meet the originator obligations of your `jurisdiction` regime (EU TFR or FATF Recommendation 16), an empty list included, is refused with `400`.'
        matching_rules:
          allOf:
          - $ref: '#/components/schemas/TravelRuleMatchingRules'
          description: Merged per entity type, and per field inside it. A field that entity type does not compare (for example `date_of_birth` for `company`) is refused with `400`.
        inbound_auto_accept:
          type: boolean
        allow_self_declaration:
          type: boolean
        allow_screenshot_proof:
          type: boolean
          description: When true, the wallet-ownership widget offers screenshot upload as an ownership evidence method. Default true.
        auto_wallet_verification:
          type: boolean
        vasp_attribution_enabled:
          type: boolean
        counterparty_screening_enabled:
          type: boolean
          description: 'Opt-in sanctions and adverse-media screening of counterparty VASPs, billed per screening at the Company AML Screening price. When on, Didit screens the counterparty an outbound exchange reaches (reusing a screening younger than 30 days) and you can screen one with POST /v3/travel-rule/vasps/{vasp_id}/screening/. Default false: nothing is screened or billed.'
        sunrise_policy:
          type: string
          enum:
          - ''
          - HOLD
          - REJECT
          - PROCEED
          description: HOLD, REJECT, PROCEED, or empty to follow timeout_outcome. See the response field of the same name.
        non_responsive_policy:
          type: string
          enum:
          - ''
          - HOLD
          - REJECT
          - PROCEED
          description: HOLD, REJECT, PROCEED, or empty to follow timeout_outcome. See the response field of the same name.
        disabled_networks:
          type: array
          items:
            type: string
            enum:
            - GTR
            - TRUST
            - VERIFYVASP
            - SYGNA
          description: Networks opted out of platform membership. Does not disable your connected own memberships or provision unavailable networks.
          default: []
      description: All fields optional; PUT applies a partial update.
    TravelRuleCounterpartyQuestionnaire:
      type: object
      description: 'One due-diligence questionnaire your application sent the counterparty: Didit''s standard questionnaire, emailed to a compliance address on record with a single-use answer link. Private to your application.'
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - SENT
          - ANSWERED
          - EXPIRED
          description: 'SENT: waiting for answers. ANSWERED: the counterparty answered every question. EXPIRED: the answer link closed unanswered (its deadline passed, or a newer questionnaire replaced it), or answers passed valid_until.'
        form_version:
          type: string
          description: Version of Didit's standard questionnaire the answers belong to. Currently 1.
        sent_to:
          type: string
          format: email
        sent_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The answer-by deadline, 30 days after sending. The link stops working after it.
        answered_at:
          type:
          - string
          - 'null'
          format: date-time
        valid_until:
          type:
          - string
          - 'null'
          format: date-time
          description: 'How long the answers stay current: 365 days after answering. Null until answered.'
        current:
          type: boolean
          description: true while the questionnaire is ANSWERED and valid_until has not passed.
        answers:
          type: object
          additionalProperties:
            type: string
          description: 'The answers keyed by question id: legal_name, licensing, jurisdictions, aml_program, compliance_officer, sanctions_screening, transaction_monitoring, travel_rule, custody, ownership, record_keeping, data_protection. Each answer is up to 2,000 characters. Empty until answered.'
    TravelRuleInboundResponse:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
          description: Didit transaction UUID for the inbound deposit.
        txn_id:
          type: string
          description: 'txn_id of the inbound transaction: Didit-generated when Didit created the transaction, or your own when an unclaimed deposit was reused.'
        created:
          type: boolean
          description: true when this call registered the transfer (HTTP 201); false when a transfer for the same txid and wallet_address already existed (HTTP 200).
        travel_rule:
          $ref: '#/components/schemas/TravelRuleTransferDetail'
    TravelRuleCounterpartyScreeningRequest:
      type: object
      properties:
        refresh:
          type: boolean
          default: false
          description: true screens again (and bills again) even when a fresh screening exists.
    TravelRuleMatchingRules:
      type: object
      description: How strictly each field of the counterparty's data is compared with what you hold, per entity type. A field you leave out keeps its default. `NONE` skips the comparison, `STRICT` needs exactly the same words, `CONTAINS` accepts one value whose words all appear in the other, `DEFAULT` is the standard subset match, and `FUZZY` accepts close spellings (and, for dates of birth, a swapped day and month).
      properties:
        individual:
          type: object
          description: Rules for a natural person.
          properties:
            name:
              type: string
              enum:
              - NONE
              - STRICT
              - CONTAINS
              - DEFAULT
              - FUZZY
              description: 'Default: follows `name_matching_strictness`.'
            date_of_birth:
              type: string
              enum:
              - NONE
              - STRICT
              - CONTAINS
              - DEFAULT
              - FUZZY
              description: Default `NONE`.
            address:
              type: string
              enum:
              - NONE
              - STRICT
              - CONTAINS
              - DEFAULT
              - FUZZY
              description: Default `NONE`.
            account:
              type: string
              enum:
              - NONE
              - STRICT
              - CONTAINS
              - DEFAULT
              - FUZZY
              description: The wallet the exchange was routed by. Default `STRICT`.
        company:
          type: object
          description: Rules for a legal person.
          properties:
            name:
              type: string
              enum:
              - NONE
              - STRICT
              - CONTAINS
              - DEFAULT
              - FUZZY
              description: 'Default: follows `name_matching_strictness`.'
            address:
              type: string
              enum:
              - NONE
              - STRICT
              - CONTAINS
              - DEFAULT
              - FUZZY
              description: Default `NONE`.
            account:
              type: string
              enum:
              - NONE
              - STRICT
              - CONTAINS
              - DEFAULT
              - FUZZY
              description: The wallet the exchange was routed by. Default `STRICT`.
    TravelRuleCounterpartyScreening:
      type: object
      description: 'One sanctions and adverse-media screening of the counterparty entity, run for and billed to your application. Private to your application: another customer never sees it.'
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - Approved
          - In Review
          - Declined
          description: 'Approved: no possible match needs attention. In Review or Declined: a possible sanctions or adverse-media match.'
        total_hits:
          type: integer
          description: How many possible matches the screening returned.
        score:
          type:
          - number
          - 'null'
          description: The highest risk score among the possible matches. Null when nothing matched.
        screened_at:
          type: string
          format: date-time
        fresh:
          type: boolean
          description: Whether the screening is younger than fresh_days (30 days). A fresh screening is reused instead of billed again.
        flagged:
          type: boolean
          description: true while the screening is fresh and its status is In Review or Declined. While your latest screening is flagged and counterparty screening stays on, counterparty_risk_level is HIGH in your rules.
    TravelRuleWidgetProofSummary:
      type: object
      properties:
        proof_id:
          type: string
          format: uuid
        method:
          type: string
          enum:
          - MESSAGE_SIGNING
          - SATOSHI_TEST
          - SCREENSHOT
          - SELF_DECLARATION
        status:
          type: string
          enum:
          - PENDING
          - VERIFIED
          - REJECTED
          - EXPIRED
          description: PENDING on a SATOSHI_TEST proof means the deposit has been seen on-chain but has not yet reached enough confirmations; a background job automatically rechecks it and moves it to VERIFIED once it confirms, with no resubmission needed. REJECTED means a genuinely wrong deposit was submitted (absent, wrong sender, or wrong amount). EXPIRED means the proof's own test window closed before a valid deposit was seen.
        wallet_address:
          type: string
        chain:
          type: string
        deposit_address:
          type:
          - string
          - 'null'
          description: Deposit address the customer must send the Satoshi test amount to. Present only on a SATOSHI_TEST proof.
        expected_amount:
          type:
          - string
          - 'null'
          description: Exact on-chain amount, in the deposit's native currency, the Satoshi test deposit must match. Present only on a SATOSHI_TEST proof.
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Deadline for this proof's own Satoshi test window. Present only on a SATOSHI_TEST proof; the widget session's own expires_at is extended to cover it when SATOSHI_TEST is offered.
        challenge:
          type:
          - string
          - 'null'
          description: Didit-issued message the customer signs with their wallet. Present only on a MESSAGE_SIGNING proof.
        rejection_reason:
          type: string
          description: Why the proof was rejected. Present only when `status` is REJECTED.
        created_at:
          type: string
          format: date-time
    TravelRuleOwnershipConfirmRequest:
      type: object
      required:
      - confirmed
      properties:
        confirmed:
          type: boolean
          description: true to confirm ownership, false to deny it.
        wallet_address:
          type: string
          default: ''
          description: 'Inbound TRP transfers only: the payment address Didit returns to the originating VASP when you approve. Defaults to the matched address book entry''s address, then beneficiary_data.wallet_address. Ignored for other transfers.'
    VaspDirectoryWidgetEntry:
      type: object
      description: 'What the end user''s VASP picker shows: who the VASP is and whether it can be reached.'
      properties:
        id:
          type: string
          format: uuid
          description: The entry's id, for GET /v3/travel-rule/vasps/{vasp_id}/.
        kind:
          type: string
          enum:
          - directory
          - didit
          description: directory for an entry of the shared directory; didit for a member of the Didit network.
        name:
          type: string
        lei:
          type: string
        jurisdiction:
          type: string
          description: ISO 3166 country code, as the source gives it.
        domains:
          type: array
          items:
            type: string
          description: The VASP's web domains. Always empty for Didit network members.
        reachable:
          type: boolean
          description: Whether your application has an available route to this VASP, or to one of its entities for a brand. Always true for a Didit network member.
    TravelRuleInboundRequest:
      type: object
      required:
      - chain
      - txid
      - wallet_address
      - amount
      - currency
      properties:
        chain:
          type: string
          description: Chain the deposit settled on, for example `ETH`. Stored lowercase and compared case-insensitively with your wallet address book entries, so use the same chain token there.
          maxLength: 32
        txid:
          type: string
          description: On-chain transaction hash. Deduped together with wallet_address.
          maxLength: 128
        wallet_address:
          type: string
          description: The destination wallet you received the deposit on.
          maxLength: 128
        amount:
          type: string
          description: Deposit amount as a decimal string, zero or greater, with up to 18 decimal places.
        currency:
          type: string
          description: Deposit asset, e.g. "USDC".
          maxLength: 16
        originator_data:
          type: object
          description: 'Originator details from the sending VASP, if known, as a flat object such as `{"name": "..."}`. Didit reads name (or full_name), first_name, last_name and vendor_data from it.'
          additionalProperties: true
        beneficiary_data:
          type: object
          description: 'Beneficiary details (your customer), as a flat object such as `{"name": "..."}`. Didit matches name against the holder_name of the matched address book entry, and sets wallet_address and chain from the request.'
          additionalProperties: true
        originating_vasp:
          type: object
          description: Optional description of the sending VASP.
          properties:
            name:
              type: string
              maxLength: 255
            lei:
              type: string
              maxLength: 20
              description: Optional. A valid 20-character ISO 17442 LEI, or empty.
            travel_address:
              type: string
              description: Travel address that lets Didit reach the sender on the TRP rail.
              maxLength: 512
    TravelRuleMessageAttachment:
      type:
      - object
      - 'null'
      description: The document attached to a message, stored like any other transaction document.
      properties:
        uuid:
          type: string
          format: uuid
        label:
          type:
          - string
          - 'null'
        note:
          type:
          - string
          - 'null'
        uploaded_by:
          type:
          - string
          - 'null'
          description: Who attached it. In the pickup portal, a file you sent shows your VASP name, never the person or API key behind it.
        created_at:
          type: string
          format: date-time
        files:
          type: array
          items:
            type: object
            properties:
              uuid:
                type: string
                format: uuid
              file_url:
                type:
                - string
                - 'null'
                description: Time-limited download URL.
              original_filename:
                type: string
              file_size:
                type: integer
    TravelRuleWidgetSessionCreate:
      type: object
      properties:
        wallet_address:
          type: string
          description: The wallet address to verify. Optional; when empty, the address must be supplied when a proof is started.
          maxLength: 128
        chain:
          type: string
          description: Chain token for the address, for example `ETH`, `BTC` or `SOL`. Use the same token as in your wallet address book. Message signing and the Satoshi test are offered only for a supported chain.
          maxLength: 32
        holder_name:
          type: string
          description: Name of the wallet holder, used for the beneficiary name match.
          maxLength: 255
        vendor_data:
          type: string
          description: Your internal identifier for the holder, carried onto the created address-book entry.
          maxLength: 255
        transaction_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Optional. Didit transaction UUID of a Travel Rule transfer to advance when the proof verifies.
        satoshi_deposit_address:
          type: string
          description: Optional. A deposit address you control; supplying it enables the SATOSHI_TEST proof method.
          maxLength: 128
        callback_url:
          type: string
          description: Optional. Absolute http(s) URL where the widget returns the customer after completion.
          maxLength: 512
        expires_in_minutes:
          type: integer
          description: Optional. Lifetime of the minted link, in minutes. Automatically extended to cover the Satoshi test window when SATOSHI_TEST is offered.
          default: 60
          minimum: 5
          maximum: 10080
    TravelRuleWidgetContext:
      type: object
      properties:
        vasp_name:
          type: string
          description: Legal name from your VASP profile, shown to the customer in the widget. Empty when no profile exists.
        wallet_address:
          type: string
        chain:
          type: string
        holder_name:
          type: string
        allowed_methods:
          type: array
          items:
            type: string
            enum:
            - MESSAGE_SIGNING
            - SCREENSHOT
            - SATOSHI_TEST
            - SELF_DECLARATION
          description: Proof methods available for this session. MESSAGE_SIGNING requires a supported chain family, SATOSHI_TEST requires a satoshi_deposit_address on the session, SCREENSHOT requires the allow_screenshot_proof setting, and SELF_DECLARATION requires the allow_self_declaration setting and an `ownership_validation_mode` that accepts a declaration for the linked transfer (never in `FULL`; in `SIMPLIFIED` only below `simplified_validation_threshold`). Initiating a SELF_DECLARATION the mode does not accept answers 403.
        transfer_status:
          type:
          - string
          - 'null'
          description: Status of the linked Travel Rule transfer. Null when the session was minted without a transaction_id.
        callback_url:
          type: string
          description: Where the widget returns the customer after completion. Empty when not set.
        expires_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Non-null once a proof has been verified.
        proofs:
          type: array
          items:
            $ref: '#/components/schemas/TravelRuleWidgetProofSummary'
        max_attempts:
          type: integer
          description: Rejected wallet proofs this session allows.
        attempts_used:
          type: integer
          description: Rejected proofs so far.
        attempts_remaining:
          type: integer
          description: When 0, starting another proof answers 409 and you mint a new widget session.
        customization:
          type:
          - object
          - 'null'
          description: The application's whitelabel customization (colors, logo, font family) when white label is enabled - the widget renders with the same branding as the verification flow. Null otherwise.
    VaspDirectoryEntry:
      type: object
      description: A VASP of the directory or a member of the Didit network, with the routes your application has to it. A customer is a member of the Didit network only while its application is live, its Travel Rule is on, its profile is discoverable, has a legal name and a confirmed compliance email, and Didit has not marked the application as a test, demo or internal one. Each row also carries the shared due-diligence assessment (dd_score, risk_level, responsiveness, essential_checks) and your application's own decision, entity screening and questionnaires, which no other customer sees.
      properties:
        id:
          type: string
          format: uuid
          description: The entry's id, for GET /v3/travel-rule/vasps/{vasp_id}/.
        kind:
          type: string
          enum:
          - directory
          - didit
          description: directory for an entry of the shared directory; didit for a member of the Didit network.
        name:
          type: string
        lei:
          type: string
        jurisdiction:
          type: string
          description: ISO 3166 country code, as the source gives it.
        domains:
          type: array
          items:
            type: string
          description: The VASP's web domains. Always empty for Didit network members.
        reachable:
          type: boolean
          description: Whether your application has an available route to this VASP, or to one of its entities for a brand. Always true for a Didit network member.
        aliases:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              kind:
                type: string
                enum:
                - trading_name
                - other_legal_name
                - network_name
                - attribution
                - merged
                - staff
                description: trading_name, other_legal_name (from the global LEI register), network_name (the name on a Travel Rule network), attribution (the entity name blockchain analytics gives the VASP's wallets), merged (the name of a duplicate entry merged into this one) or staff.
          description: Other names the VASP is found by.
        networks:
          type: array
          items:
            type: object
            description: A current listing of this VASP in a Travel Rule network's member directory. A TRISA listing says who the VASP is on TRISA; Didit has no TRISA rail, so it is never a route.
            properties:
              network:
                type: string
                enum:
                - GTR
                - TRUST
                - VERIFYVASP
                - SYGNA
                - TRISA
              code:
                type: string
                description: The VASP's identifier on that network.
              listed_name:
                type: string
                description: The name the network lists the VASP under.
              country:
                type: string
                description: The country the network lists, when it gives one.
              verified_at:
                type:
                - string
                - 'null'
                format: date-time
                description: When Didit staff verified the listing. Null for listings read from a public directory.
              last_seen_at:
                type:
                - string
                - 'null'
                format: date-time
                description: When the source last showed the listing. A listing the source has not shown for three weeks is removed.
              source:
                type: string
                enum:
                - trisa_directory
                - staff
                description: 'Where the listing comes from: the public TRISA directory, or Didit staff.'
        routes:
          type: array
          items:
            type: object
            description: 'One way your application can deliver Travel Rule data to this VASP, in the order dispatch tries them. A network route needs a membership on that network: your own (connected in the Marketplace) or Didit''s once Didit holds one. Without it the route is listed as unavailable with the reason, never as a way to reach the VASP.'
            properties:
              rail:
                type: string
                enum:
                - INTERNAL
                - TRP
                - GTR
                - TRUST
                - VERIFYVASP
                - SYGNA
                - EMAIL
              status:
                type: string
                enum:
                - available
                - unavailable
              reason:
                type: string
                enum:
                - ''
                - no_membership
                - network_switched_off
                description: 'Why an unavailable route cannot be used: no_membership (neither you nor Didit holds a membership on that network) or network_switched_off (you turned that network off in your settings). Empty when the route is available.'
              via:
                type: string
                enum:
                - ''
                - own_membership
                - didit_membership
                - directory
                - contact
                - didit_network
                description: 'How an available route is reached: own_membership or didit_membership for a network rail, directory for a TRP endpoint the directory verified, contact for the EMAIL rail, didit_network for a Didit network member. Empty when the route is unavailable.'
        umbrella:
          type:
          - object
          - 'null'
          description: The brand this entry is a regulated entity of. Null when it is not part of one.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        entities:
          type: array
          items:
            type: object
            description: 'A regulated entity of a brand: the legal entity that receives a transfer.'
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              lei:
                type: string
              jurisdiction:
                type: string
              reachable:
                type: boolean
                description: Whether your application has an available route to it.
          description: For a brand, the regulated entities that receive its transfers. A transfer naming the brand goes to the reachable entity in the jurisdiction it states (beneficiary_data.counterparty_vasp_jurisdiction), else to the entity blockchain analytics attribution linked to the destination wallet, else to the only reachable entity when no jurisdiction is stated. Two entities that fit equally are never guessed between.
        contacts:
          type: array
          items:
            type: object
            description: A compliance contact the EMAIL rail can write to.
            properties:
              id:
                type: string
                format: uuid
              email:
                type: string
                format: email
              name:
                type: string
              source:
                type: string
                enum:
                - staff
                - application
                - learned
                description: 'staff: curated by Didit; application: added by your application; learned: an address that answered a Travel Rule request through its response link.'
              scope:
                type: string
                enum:
                - platform
                - application
                description: platform contacts are used for every Didit customer's transfers; application contacts are private to your application, which sees only its own.
              verified_at:
                type:
                - string
                - 'null'
                format: date-time
                description: When someone at this address answered a request. Null when it has not yet.
          description: The platform's contacts for this VASP and your application's own.
        dd_status:
          type: string
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
          - REJECTED
          description: Didit's verification status of the entry, scored by the verification component of dd_score. Always COMPLETED for a Didit network member.
        dd_score:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
          description: 'The shared due-diligence score of a directory entry, 0 to 100, where higher is safer (see dd_score_semantic): the sum of the points in dd_score_breakdown. Null for a Didit network member, which is not scored. An entry not assessed yet (dd_assessed_at null) shows 0 with an empty risk_level, so read risk_level rather than the raw score.'
        reachable_rails:
          type: array
          items:
            type: string
            enum:
            - INTERNAL
            - TRP
            - GTR
            - TRUST
            - VERIFYVASP
            - SYGNA
            - EMAIL
          description: Rails recorded on the entry. Read routes for what your application can use today.
        is_didit_customer:
          type: boolean
          description: true for a member of the Didit network (dd_status is always COMPLETED, dd_score null and risk_level empty for these) and for a directory entry linked to a Didit customer.
        dd_score_breakdown:
          type: object
          description: 'One object per component of dd_score. Components, their weight (max) and their reason codes: jurisdiction, 25 (jurisdiction_not_high_risk, jurisdiction_high_risk, jurisdiction_unknown); verification, 15 (dd_status_completed, dd_status_in_progress, dd_status_not_started, dd_status_rejected); protocol, 15 (native_rail, email_only, no_rail); lei, 10 (lei_valid, lei_missing); history, 10 (history, no_history); essentials, 15 (essential_checks, no_essential_checks); responsiveness, 10 (responsive, unresponsive, responsiveness_unknown). Empty for a Didit network member.'
          additionalProperties:
            type: object
            properties:
              points:
                type: number
                description: Points the component contributes, rounded to one decimal.
              max:
                type: integer
                description: 'The component''s weight: the points it contributes at best.'
              reason:
                type: string
                description: Machine-readable code of the component's verdict.
              detail:
                type: string
                description: One-line English explanation.
        dd_assessed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When dd_score, risk_level and responsiveness were last computed: after an exchange with the entry completes, finishes, expires, mismatches or is declined, when Didit refreshes or curates the entry, and in the weekly directory refresh. Null for a Didit network member.'
        dd_score_semantic:
          type: string
          enum:
          - higher_is_safer
          description: 'Which way dd_score points: always higher_is_safer.'
        risk_level:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - ''
          description: 'The band dd_score falls in: LOW (70 or more), MEDIUM (40 to 69) or HIGH (below 40). Empty for a Didit network member and for an entry not assessed yet. Filter on it with risk. Your own flagged screening never changes this shared value: it makes counterparty_risk_level HIGH in your rules instead.'
        responsiveness:
          type: object
          description: 'Whether the VASP answers Travel Rule requests: the share of the requests Didit customers started towards it in the last 90 days that it answered. Only requests sent over a network or protocol rail, or by email to a shared address (the entry''s compliance address or a platform contact), count; a request sent to an address a customer typed, or to a customer''s private contact, never does. An expired request is unanswered; a completed exchange, a decline or a data mismatch is an answer; a cancelled request or an unreachable rail is neither. Always UNKNOWN with zero counts for a Didit network member.'
          properties:
            status:
              type: string
              enum:
              - RESPONSIVE
              - UNRESPONSIVE
              - UNKNOWN
              description: UNKNOWN with fewer than 5 decided requests in the window; UNRESPONSIVE when less than 10 percent of them were answered; RESPONSIVE otherwise.
            answered:
              type: integer
              description: Decided requests in the window that the VASP answered.
            total:
              type: integer
              description: 'Decided requests in the window: answered plus expired.'
            computed_at:
              type:
              - string
              - 'null'
              format: date-time
        essential_checks:
          type: object
          description: 'The essential-checks report of a directory entry, built only from the platform''s verified sources: registration (an official register lists the VASP: the EU''s interim MiCA register, the public TRISA directory or the global LEI register), licence (a MiCA authorisation is on record and current), domain (the entry''s domain matches its TRP endpoint or the website its register gives) and lei (its LEI record is active, issued and consistent with the entry''s names and country). The essentials component of dd_score is the share of decided checks that pass. Empty until the weekly directory refresh first checks the entry, and always empty for a Didit network member.'
          properties:
            level:
              type: string
              enum:
              - essential
            checked_at:
              type: string
              format: date-time
            checks:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    enum:
                    - registration
                    - licence
                    - domain
                    - lei
                  status:
                    type: string
                    enum:
                    - pass
                    - fail
                    - unknown
                    description: unknown when no source on record can decide the check.
                  reason:
                    type: string
                    description: Machine-readable code of the verdict.
                  detail:
                    type: string
                    description: One-line English explanation.
            passed:
              type: integer
            failed:
              type: integer
            unknown:
              type: integer
            total:
              type: integer
        decision:
          allOf:
          - $ref: '#/components/schemas/TravelRuleCounterpartyDecision'
          description: Your application's decision on this VASP, or for an entity with no decision of its own its brand's (inherited_from names the brand). Null when there is none. Private to your application.
        entity_screening:
          allOf:
          - $ref: '#/components/schemas/TravelRuleCounterpartyScreening'
          description: Your application's latest sanctions and adverse-media screening of this VASP. Null when you never screened it. Private to your application.
        questionnaires:
          type: array
          items:
            $ref: '#/components/schemas/TravelRuleCounterpartyQuestionnaire'
          description: Your application's due-diligence questionnaires with this VASP, newest first. Private to your application.
