  /v3/kyb/select/:
    post:
      summary: KYB registry company select (standalone)
      operationId: post_v3_kyb_select
      tags:
      - Standalone APIs
      security:
      - ApiKeyAuth: []
      parameters: []
      description: 'Retrieve the full registry profile of one candidate returned by `POST /v3/kyb/search/` — company details, officers, beneficial owners, addresses, industries, filings, and the complete raw registry payload.


        **Pairing with search.** Pass the candidate''s `kyb_response_id` exactly as returned by the search. The handle is ephemeral and scoped to that search — select promptly, and re-search for a fresh handle rather than storing it.


        **Billing.** Each select is billed at the KYB registry price (search is free). The balance is checked before any registry call (`403` when short) and the charge is recorded against the created business session.


        **Persistence is mandatory.** Every select creates a business session (its id is the `request_id`) so billing and retrieval can be tracked; it appears in the console. `save_api_request` is accepted for symmetry but must be `true` (the default) — sending `false` returns `400`.


        **Resolution.** The API polls the registry for the full profile before responding. If the registry is still processing after polling, the response comes back with `fetch_status: "pending"` / `data_resolved: false` and sparse fields; the stored record completes automatically once the registry resolves (the business session status updates with it) — re-check it in the Business Console or by polling `GET /v3/session/{request_id}/decision/` (business sessions resolve through the same decision endpoint).


        **Status.** `kyb_registry.status` is Didit''s assessment of the registry check: companies that are not active in the registry, or whose officers/ownership could not be derived, are routed to `In Review`; clean active companies are `Approved`. `registry_status` is the company''s own status at the registry (e.g. `active`, `dissolved`).


        **Sandbox.** Keys from sandbox applications return a static resolved company without contacting any registry and without billing.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - kyb_response_id
              properties:
                kyb_response_id:
                  type: string
                  maxLength: 255
                  description: Candidate handle from `POST /v3/kyb/search/` (`kyb_registry.companies[].kyb_response_id`). Ephemeral — use it shortly after the search that produced it.
                  example: 69aeeb95febb0f1704042259
                vendor_data:
                  type: string
                  description: Your identifier for this company; echoed back and stored with the business session.
                metadata:
                  type: object
                  nullable: true
                  description: Free-form JSON stored with the business session and echoed back.
                save_api_request:
                  type: boolean
                  default: true
                  description: Must be `true` (the default). KYB registry selects are always persisted so billing and retrieval can be tracked; `false` returns `400`.
      x-codeSamples:
      - lang: curl
        label: curl
        source: "curl -X POST https://verification.didit.me/v3/kyb/select/ \\\n  -H 'x-api-key: YOUR_API_KEY' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"kyb_response_id\": \"69aeeb95febb0f1704042259\",\n    \"vendor_data\": \"company-1234\"\n  }'"
      - lang: python
        label: Python
        source: "import os, requests\n\nsearch = requests.post(\n    \"https://verification.didit.me/v3/kyb/search/\",\n    headers={\"x-api-key\": os.environ[\"DIDIT_API_KEY\"]},\n    json={\"country_code\": \"GB\", \"name\": \"Tesco\"},\n    timeout=60,\n).json()\nkyb_response_id = search[\"kyb_registry\"][\"companies\"][0][\"kyb_response_id\"]\n\nresp = requests.post(\n    \"https://verification.didit.me/v3/kyb/select/\",\n    headers={\"x-api-key\": os.environ[\"DIDIT_API_KEY\"]},\n    json={\"kyb_response_id\": kyb_response_id, \"vendor_data\": \"company-1234\"},\n    timeout=90,  # waits for the registry to resolve the full profile\n)\nresp.raise_for_status()\ncompany = resp.json()[\"kyb_registry\"]\nprint(company[\"company_name\"], company[\"registry_status\"], company[\"status\"])"
      - lang: javascript
        label: JavaScript
        source: "const res = await fetch('https://verification.didit.me/v3/kyb/select/', {\n  method: 'POST',\n  headers: {\n    'x-api-key': 'YOUR_API_KEY',\n    'Content-Type': 'application/json',\n  },\n  body: JSON.stringify({\n    kyb_response_id: '69aeeb95febb0f1704042259',\n    vendor_data: 'company-1234',\n  }),\n});\nconst data = await res.json();\nconsole.log(data.kyb_registry.company_name, data.kyb_registry.registry_status);"
      responses:
        '200':
          description: Company retrieved and billed. `kyb_registry` carries the full profile; check `data_resolved` — when `false` the registry was still processing and the stored record completes automatically once it resolves.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    format: uuid
                    description: Id of the business session created for this retrieval. The stored record (visible in the console) keeps updating if the registry resolves after the response.
                  kyb_registry:
                    type: object
