                        groups:
                          type: object
                          description: Per-group progress counters keyed by group name (e.g. legal_presence, ownership_structure).
                          additionalProperties:
                            type: object
                            properties:
                              total:
                                type: integer
                              approved:
                                type: integer
                              pending:
                                type: integer
                              declined:
                                type: integer
                              in_review:
                                type: integer
