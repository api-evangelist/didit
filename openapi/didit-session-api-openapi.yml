                                longitude:
                                  type: number
                                  example: 1.9770097
                              description: Coordinates, or `null` when unavailable.
                            distance_from_ip:
                              type: number
                              nullable: true
                              example: 12.3
                            distance_from_id_document:
                              type: number
                              nullable: true
                              example: 18.7
                        warnings:
                          type: array
                          items:
                            type: object
                            properties:
                              feature:
                                type: string
                                enum:
                                - ID_VERIFICATION
                                - NFC
                                - LIVENESS
                                - FACEMATCH
                                - PROOF_OF_ADDRESS
                                - PHONE
                                - EMAIL
                                - AML
                                - LOCATION
                                - DATABASE_VALIDATION
                                - QUESTIONNAIRE
                                - DOCUMENT_AI
                                - KYB_REGISTRY
                                - KYB_DOCUMENTS
                                - KYB_KEY_PEOPLE
                                description: The feature that generated this warning. The value identifies the feature block the warning belongs to. Each module's warnings array typically uses the value matching its module (e.g. `PHONE` inside `phone_verifications[].warnings`), but the enum above is authoritative across all feature warnings on the decision payload.
                              risk:
                                type: string
                              additional_data:
                                type: object
                                nullable: true
                              log_type:
                                type: string
                              short_description:
                                type: string
                              long_description:
                                type: string
                              node_id:
                                type: string
                                description: The workflow graph node ID that generated this warning
                        matches:
                          type: array
                          description: Cross-session matches found for this entry's IP address or device identity. Every match is another verification session in your application (`source` is always `session`) that shares the same value, always belonging to a different vendor user / `vendor_data` than the current session, capped at 5 per collector (`device_fingerprint` sums two independently capped collectors, so up to 10 entries are possible). Every item carries `match_source`, `confidence`, `match_mode`, `device_info` and `location_info`; the keys `recovery_similarity`, `tls_ja4_corroborated` and `recovery_gate_reason` are present only when `match_source` is `recovered_high`.
                          items:
                            type: object
                            additionalProperties: false
                            properties:
                              session_id:
                                type: string
                                format: uuid
                                description: Session ID of the matching session.
                              session_number:
                                type: integer
                                description: Sequential number of the matching session.
                              vendor_data:
                                type: string
                                nullable: true
                                description: '`vendor_data` of the matching session — always different from the current session''s vendor user.'
                              verification_date:
                                type: string
                                format: date-time
                                nullable: true
                                description: Creation date of the matching session (`YYYY-MM-DDTHH:MM:SSZ`).
                              match_type:
                                type: string
                                enum:
                                - ip_address
                                - device_fingerprint
                                description: Whether the match was on IP address or device fingerprint
                              match_source:
                                type: string
                                enum:
                                - ip_address
                                - persistent_id
                                - legacy_fp
                                - recovered_high
                                description: 'How this match was reached: `ip_address` (shared IP address — network co-location, not a device-identity claim), `persistent_id` (exact stored persistent device identifier), `legacy_fp` (legacy `didit-fp-*` device-fingerprint hash), or `recovered_high` (high-confidence fuzzy fingerprint-recovery hit). Lower-confidence recovery candidates surface as risk warnings only, never in this array.'
                              matched_value:
                                type: string
                                nullable: true
                                description: 'The value that matched: the shared IP address, the persistent device identifier or legacy fingerprint hash, or — for `recovered_high` — the UUID of the recovered device.'
                              status:
                                type: string
                                description: Lifecycle status of the matching session.
                              is_blocklisted:
                                type: boolean
                                description: Whether the matched value is on a blocklist. Currently always `false` for device/IP matches.
                              api_service:
                                type: string
                                nullable: true
                                description: Standalone API service of the matching session; `null` for workflow sessions.
                              source:
                                type: string
                                enum:
                                - session
                                description: Always `session` for device/IP matches — every match is another verification session in your application.
                              device_info:
                                type: object
                                description: Device details observed on the matching session.
                                properties:
                                  device_brand:
                                    type: string
                                    nullable: true
                                  device_model:
                                    type: string
                                    nullable: true
                                  browser_family:
                                    type: string
                                    nullable: true
                                  os_family:
                                    type: string
                                    nullable: true
                                  platform:
                                    type: string
                                    nullable: true
                                  device_fingerprint:
                                    type: string
                                    nullable: true
                              location_info:
                                type: object
                                description: Network and geolocation details observed on the matching session.
                                properties:
                                  ip_address:
                                    type: string
                                    nullable: true
                                  ip_country:
                                    type: string
                                    nullable: true
                                  ip_country_code:
                                    type: string
                                    nullable: true
                                  ip_state:
                                    type: string
                                    nullable: true
                                  ip_city:
                                    type: string
                                    nullable: true
                                  is_vpn_or_tor:
                                    type: boolean
                                  is_data_center:
                                    type: boolean
                              confidence:
                                type: number
                                minimum: 0
                                maximum: 1
                                description: 'Server-side identification confidence, computed as `1 - P(false positive)`: `1.0` for deterministic matches (`persistent_id`, or hardware-rooted `recovered_high`), `0.5` for `legacy_fp`, `0.0` for `ip_address` (co-location only), and a corroboration-adjusted value below `1.0` for probabilistic recovered matches (higher when the TLS JA4 fingerprint and IP country independently agree).'
                              match_mode:
                                type: string
                                enum:
                                - deterministic
                                - probabilistic
                                - co_occurrence
                                description: 'Evidence class of the match: `deterministic` (exact stored or hardware-rooted identifier that cannot collide between physical devices), `probabilistic` (fuzzy fingerprint evidence), or `co_occurrence` (shared network only, no device-identity claim).'
                              recovery_similarity:
                                type: number
                                description: Cosine similarity of the fingerprint-recovery match, rounded to 4 decimals. Present only when `match_source` is `recovered_high`.
                              tls_ja4_corroborated:
                                type: boolean
                                description: Whether the TLS JA4 fingerprints of the two observations agree — a server-observed signal the browser cannot spoof. Present only when `match_source` is `recovered_high`.
                              recovery_gate_reason:
                                type: string
                                description: 'Why the recovery match passed the false-positive hard gate: `hardware_root_match` (a hardware-rooted device identifier matched exactly) or, on configurations that admit probe-only evidence, `exact_composite_plus_<n>_families` / `very_high_similarity_plus_<n>_families`. Present only when `match_source` is `recovered_high`.'
                  database_validations:
                    type: array
                    nullable: true
                    description: '**Array of Database Validation reports** — always a JSON array, never a singular `database_validation` object. `null` until at least one DB validation step has produced data. Each item is the full report, including `node_id`, feature-level `status`, `screened_data`, the per-service `validations[]` (each with its registry `source_data`), and `warnings[]`. The `screened_data` and `source_data` fields vary by country:


                      **ARG (Argentina)**: screened_data: {document_number, selfie, gender, first_name, last_name}. source_data: {identification_number, first_name, last_name, full_name, date_of_birth, date_of_death, tax_id, tax_id_type, face_match_score, sit_1_since, banks, last_position, highest_position, rejected_checks}. Uses RENAPER biometric face-match validation. Gender is auto-inferred from face analysis or given name when not present in the document (e.g., driver licenses)


                      **BOL (Bolivia)**: screened_data: {document_number, date_of_birth, first_name, last_name}. source_data: {identification_number, first_name, last_name, full_name, date_of_birth, gender}


                      **BRA (Brazil)**: screened_data: {tax_number, first_name, last_name, date_of_birth}. source_data always includes {identification_number, first_name, last_name, date_of_birth, lgpd_minor, minor_under_18, minor_under_16} for successful CPF matches. Successful adult lookups set those flags to false. The Receita Federal Consulta CPF service may return HTTP 422 (minor under 18) or 451 (under 16) with LGPD-withheld data; in those cases source_data sets the minor flags to true as appropriate, includes the upstream HTTP status, and field-level validation is no_match. See the Brazil section of the Database Validation Outcome Codes reference for the full code list.


                      **CHL (Chile)**: screened_data: {personal_number, first_name, last_name, date_of_birth}. source_data: {identification_number, first_name, last_name, date_of_birth, gender}


                      **COL (Colombia)**: screened_data: {document_number, document_type, first_name, last_name}. source_data: {identification_number, first_name, last_name, full_name, date_of_birth, document_type}


                      **CRI (Costa Rica)**: screened_data: {personal_number, first_name, last_name}. source_data: {identification_number, first_name, last_name, full_name}


                      **DOM (Dominican Republic)**: screened_data: {personal_number}. source_data: {identification_number} (returns valid/invalid only)


                      **ECU (Ecuador)**: screened_data: {personal_number, first_name, last_name}. source_data: {identification_number, first_name, last_name, street, formatted_address, gender, nationality, education, marital_status, spouse, mother_name, father_name, profession}


                      **ESP (Spain)**: screened_data: {personal_number, document_type, expiration_date, first_name, last_name}. source_data: {identification_number, first_name, last_name, full_name, document_type, expiration_date}


                      **GTM (Guatemala)**: screened_data: {document_number, first_name, last_name}. source_data: {identification_number, first_name, last_name, full_name}


                      **HND (Honduras)**: screened_data: {document_number, first_name, last_name}. source_data: {identification_number, first_name, last_name, full_name}


                      **MEX (Mexico)**: screened_data: {personal_number (CURP), first_name, last_name}. source_data: {identification_number, first_name, last_name, full_name, date_of_birth, gender, nationality, curp_status, state_of_birth, doc_probatorio, registration_year, registration_state, registration_municipality, num_acta, crip, issuing_state_code, foreign_registry_number, folio_carta, folio_certificado}. Uses the RENAPO civil registry. A separate INE validity-check service is also available for MEX as an additional one-by-one validation.


                      **PAN (Panama)**: screened_data: {personal_number, selfie}. source_data: {identification_number}. Uses SIB biometric validation


                      **PER (Peru)**: screened_data: {personal_number (DNI), first_name, last_name}. source_data: {identification_number, first_name, last_name, paternal_name, maternal_name, verification_number, verification_letter}


                      **PRY (Paraguay)**: screened_data: {document_number, first_name, last_name}. source_data: {identification_number, first_name, last_name, full_name}


                      **SLV (El Salvador)**: screened_data: {document_number, date_of_birth, first_name, last_name}. source_data: {identification_number, first_name, last_name, full_name}


                      **URY (Uruguay)**: screened_data: {personal_number, date_of_birth, first_name, last_name}. source_data: {identification_number, first_name, last_name, full_name}


                      **VEN (Venezuela)**: screened_data: {document_number, first_name, last_name}. source_data: {identification_number, first_name, last_name, full_name, gender, date_of_birth, document_type}'
                    items:
                      type: object
                      properties:
                        node_id:
                          type: string
                          description: Unique identifier for this database validation step in the workflow graph.
                        issuing_state:
                          type: string
                          description: ISO 3166-1 alpha-3 code of the country whose government/registry sources were queried (e.g. `BRA`, `MEX`, `ESP`, `NGA`, `IDN`). Database Validation covers 60+ countries across the Americas, Europe, Africa, the Middle East and Asia-Pacific, plus global multi-country sources — coverage expands regularly, so treat the value as an open set rather than a fixed enum.
                        validation_type:
                          type: string
                          enum:
                          - one_by_one
                          - two_by_two
                          - not_enabled
                          description: 'How the result was corroborated: `one_by_one` (single-service outcome), `two_by_two` (two or more distinct services independently full-matched the identification number), or `not_enabled` (persisted when no service produced a usable match). The value is never `null`. Dedicated biometric 2x2 validation modes are currently available for `ECU` and `PER`.'
                        screened_data:
                          type: object
